services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: akp
      POSTGRES_PASSWORD: akp
      POSTGRES_DB: akp
    ports:
      - "127.0.0.1:${AKP_POSTGRES_PORT:-55432}:5432"
    volumes:
      - akp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akp -d akp"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: akp
      MINIO_ROOT_PASSWORD: ${AKP_RAW_SECRET_KEY:-local-development-only-change-me}
    ports:
      - "127.0.0.1:${AKP_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${AKP_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - akp_minio:/data

  extractor:
    build: ./apps/extractor
    environment:
      AKP_RAW_ENDPOINT: http://minio:9000
      AKP_EXTRACTOR_TOKEN: ${AKP_EXTRACTOR_TOKEN:-local-extractor-development-token}
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  akp_postgres:
  akp_minio:
