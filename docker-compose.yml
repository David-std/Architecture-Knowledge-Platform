services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: akp
      POSTGRES_PASSWORD: akp
      POSTGRES_DB: akp
    ports:
      - "5432:5432"
    volumes:
      - akp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akp -d akp"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: akp
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - akp_minio:/data

  extractor:
    build: ./apps/extractor
    environment:
      AKP_RAW_ENDPOINT: http://minio:9000
    ports:
      - "8090:8090"

volumes:
  akp_postgres:
  akp_minio:
