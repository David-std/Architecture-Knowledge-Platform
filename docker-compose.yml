services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: akp
      POSTGRES_PASSWORD: akp
      POSTGRES_DB: akp
    ports:
      - "127.0.0.1:${AKP_POSTGRES_PORT:-55432}:5432"
    volumes:
      - akp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akp -d akp"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: akp
      MINIO_ROOT_PASSWORD: ${AKP_RAW_SECRET_KEY:-local-development-only-change-me}
    ports:
      - "127.0.0.1:${AKP_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${AKP_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - akp_minio:/data

  extractor:
    build: ./apps/extractor
    environment:
      AKP_RAW_ENDPOINT: http://minio:9000
      AKP_EXTRACTOR_TOKEN: ${AKP_EXTRACTOR_TOKEN:-local-extractor-development-token}
    ports:
      - "127.0.0.1:8090:8090"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${AKP_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${AKP_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${AKP_OTEL_HEALTH_PORT:-13133}:13133"

volumes:
  akp_postgres:
  akp_minio:
