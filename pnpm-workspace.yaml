packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: warn
linkWorkspacePackages: true
overrides:
  "@grpc/grpc-js": 1.14.5
  # Security floors for direct/transitive advisories: adm-zip, fast-uri, js-yaml and sharp.
  adm-zip: 0.6.1
  postcss: 8.5.25
  sharp: 0.35.4
  fast-uri: 4.1.4
  js-yaml: 3.15.2
  nanoid: 3.3.18
  brace-expansion: 2.1.7
  # Security floor for the MCP SDK's transitive Hono dependency.
  hono: 4.13.5
  # Security floors for advisories published 2026-10-05.
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - "@fastify/rate-limit@11.2.0"
  - "postcss@8.5.25"

peerDependencyRules:
  allowedVersions:
    "@emnapi/core": ">=1.0.0"
    "@emnapi/runtime": ">=1.0.0"
