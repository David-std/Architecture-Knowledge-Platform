packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: warn
linkWorkspacePackages: true
overrides:
  # Security floors for direct/transitive advisories: adm-zip, fast-uri, js-yaml and sharp.
  adm-zip: 0.6.0
  postcss: 8.5.25
  sharp: 0.35.4
  fast-uri: 4.1.3
  js-yaml: 3.15.2
  nanoid: 3.3.18
  # Security floor for the MCP SDK's transitive Hono dependency.
  hono: 4.13.5
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - "@fastify/rate-limit@11.2.0"
  - "postcss@8.5.25"

peerDependencyRules:
  allowedVersions:
    "@emnapi/core": ">=1.0.0"
    "@emnapi/runtime": ">=1.0.0"
