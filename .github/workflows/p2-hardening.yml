name: p2-hardening
# Clean rerun after generated P2 corrections are committed.

on:
  push:
    branches: [batch/p2-hardening-20260916]

permissions:
  contents: write

concurrency:
  group: p2-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply isolated P2 TypeScript corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          context_path = Path("apps/api/src/routes/context-fabric.ts")
          context = context_path.read_text()
          old_authority = "        authority: request.body?.authority,\n"
          new_authority = (
              "        ...(request.body?.authority\n"
              "          ? { authority: request.body.authority }\n"
              "          : {}),\n"
          )
          if old_authority in context:
              context = context.replace(old_authority, new_authority, 1)
              context_path.write_text(context)
          elif new_authority not in context:
              raise SystemExit("context-fabric authority call shape changed unexpectedly")

          presence_path = Path("apps/api/src/routes/workspace-presence.ts")
          presence = presence_path.read_text()
          old_ttl = "        ttlSeconds: request.body?.ttlSeconds,\n"
          new_ttl = (
              "        ...(request.body?.ttlSeconds !== undefined\n"
              "          ? { ttlSeconds: request.body.ttlSeconds }\n"
              "          : {}),\n"
          )
          if old_ttl in presence:
              presence = presence.replace(old_ttl, new_ttl, 1)
              presence_path.write_text(presence)
          elif new_ttl not in presence:
              raise SystemExit("workspace-presence ttl call shape changed unexpectedly")
          PY
      - name: Format P2 sources
        shell: bash
        run: |
          {
            git diff --name-only 2e93a0a1d4ed5b0a20b77cde4921fb23befb260f...HEAD \
              | grep -E '\.(ts|tsx|js|mjs|cjs|json|md|ya?ml)$' || true
            printf '%s\n' \
              apps/api/src/routes/sessions.ts \
              packages/application/src/index.ts \
              packages/postgres/src/workspace-coordination.ts
          } | sort -u > /tmp/p2-prettier-files.txt
          mapfile -t files < /tmp/p2-prettier-files.txt
          if [ "${#files[@]}" -gt 0 ]; then
            pnpm exec prettier --write "${files[@]}"
          fi
          pnpm exec prettier --check .
      - name: Validate TypeScript workspace
        run: pnpm check
      - name: Validate build
        run: pnpm build
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit generated formatting and corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated corrections remain."
            exit 0
          fi
          git config user.name "AKP P2 Hardening"
          git config user.email "akp-p2-hardening@users.noreply.github.com"
          git add --all
          git commit -m "fix(p2): satisfy type and formatting gates"
          git push origin HEAD:batch/p2-hardening-20260916
