name: connector-format-diagnostic

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - .github/workflows/connector-format-diagnostic.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --write apps/api/src/routes/context-fabric.ts contracts/openapi.yaml docs/context-fabric.md packages/contracts/src/connector-capabilities.ts
      - uses: actions/upload-artifact@v7
        with:
          name: connector-format
          path: |
            apps/api/src/routes/context-fabric.ts
            contracts/openapi.yaml
            docs/context-fabric.md
            packages/contracts/src/connector-capabilities.ts
