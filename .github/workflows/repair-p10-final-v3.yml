name: repair-p10-final-v3

on:
  push:
    branches: [work/product-completion-final]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply Agent A/B evidence fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          workflow = Path('.github/workflows/repair-p10-final.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip().startswith('H4sI'))
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PATCH')
          payload = ''.join(line.strip() for line in workflow[start:end])
          Path('/tmp/repair.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-ab-benchmark.ts')
          text = path.read_text()
          replacements = [
              (r'.replace(/^\\[/u, "")', r'.replace(/^\[/u, "")'),
              (r'.replace(/\\]$/u, "")', r'.replace(/\]$/u, "")'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'agent regex repair {old!r} count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write scripts/agent-ab-benchmark.ts
          git diff --check
          test "$(git diff --name-only)" = "scripts/agent-ab-benchmark.ts"
      - name: Validate repository
        run: pnpm check
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://akp:akp@localhost:55432/akp
        run: pnpm db:migrate
      - name: Validate embedding integration semantics
        env:
          DATABASE_URL: postgres://akp:akp@localhost:55432/akp
        run: pnpm --filter @akp/indexing exec vitest run test/embedding-index.integration.test.ts
      - name: Preflight Scale 100K
        env:
          DATABASE_URL: postgres://akp:akp@localhost:55432/akp
        shell: bash
        run: |
          pnpm benchmark:scale -- \
            --output reports/preflight-scale-100000.json \
            --targets 100000 \
            --iterations 1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('reports/preflight-scale-100000.json', 'utf8'));
          if (report.status !== 'PASSED' || report.cleanup?.succeeded !== true || report.results?.[0]?.targetDocuments !== 100000) {
            throw new Error(`Scale 100K preflight failed: ${JSON.stringify({status: report.status, cleanup: report.cleanup, failure: report.failure})}`);
          }
          NODE
      - name: Commit validated Agent fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/agent-ab-benchmark.ts
          git commit -m "fix(eval): stabilize live Agent A/B output contract"
          git push origin HEAD:work/product-completion-final
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
