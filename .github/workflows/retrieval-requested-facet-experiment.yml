name: retrieval-requested-facet-experiment

on:
  pull_request:
    branches:
      - chore/retrieval-generality-policy
  push:
    branches:
      - experiment/retrieval-requested-facet-veto

permissions:
  contents: read

jobs:
  requested-facet-veto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AKP_REQUESTED_FACET_REPORT: reports/ci/requested-facet-veto.json
      AKP_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm build
      - name: Run requested-facet veto experiment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci
          pnpm exec tsx scripts/evidence-requested-facet-veto-experiment.ts \
            2>&1 | tee reports/ci/requested-facet-veto.log
      - name: Validate experiment contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("reports/ci/requested-facet-veto.json", "utf8"));
          if (report.schemaVersion !== "akp.requested-facet-veto.v1") throw new Error(`Unexpected schema ${report.schemaVersion}`);
          if (!["PROMOTE", "REJECT", "INCONCLUSIVE"].includes(report.outcome)) throw new Error(`Unexpected outcome ${report.outcome}`);
          if (report.productionDefaultChanged !== false || report.enforcementEnabled !== false) throw new Error("Experiment changed a production admission default.");
          if (report.privateFreshValidationRequired !== true || report.blindHoldoutRequired !== true) throw new Error("Required downstream validation was weakened.");
          if (report.contract?.baseline_sha !== "8ba789faae9b66339abfd5b125461d048dbb8d5a") throw new Error("Experiment baseline drifted from current #38 HEAD.");
          console.log(JSON.stringify({outcome:report.outcome,development:report.development,heldout:report.heldout,alignmentAudit:report.alignmentAudit,changedRows:report.changedRows}, null, 2));
          NODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: requested-facet-veto-${{ github.sha }}
          path: |
            reports/ci/requested-facet-veto.json
            reports/ci/requested-facet-veto.log
          if-no-files-found: warn
