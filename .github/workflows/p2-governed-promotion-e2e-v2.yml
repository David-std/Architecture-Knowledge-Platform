name: p2-governed-promotion-e2e-v2

on:
  push:
    branches:
      - batch/p2-governed-promotion-e2e-v2-20260916

permissions:
  contents: write

jobs:
  e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_API_TOKEN: akp-ci-integration-token-not-for-production
      AKP_API_TOKEN_SCOPES: >-
        {"spaces":[{"spaceId":"00000000-0000-0000-0000-000000000003","pathPrefix":null,"permissions":["knowledge:read","source:read","source:write","knowledge:propose","knowledge:review","eval:run","admin"]}]}
      AKP_INGEST_ROOTS: ${{ github.workspace }}/test/fixtures
      AKP_PROJECT_ROOTS: ${{ github.workspace }}
      AKP_MANAGED_REPO: /tmp/akp-managed-knowledge
      AKP_EXTRACTOR_TOKEN: akp-ci-extractor-token-not-for-production
      AKP_RAW_SECRET_KEY: akp-ci-minio-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Extend governed promotion E2E
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{label} target not found in {path}')
              path.write_text(text.replace(old, new, 1))

          test = Path('apps/api/test/workspace-coordination.integration.test.ts')
          replace_once(
              test,
              '''const outsiderId = randomUUID();\nconst vaultId = randomUUID();\n''',
              '''const outsiderId = randomUUID();\nconst reviewerId = randomUUID();\nconst vaultId = randomUUID();\n''',
              'reviewer id',
          )
          replace_once(
              test,
              '''const outsiderToken = `workspace-outsider-${randomUUID()}`;\n''',
              '''const outsiderToken = `workspace-outsider-${randomUUID()}`;\nconst reviewerToken = `workspace-reviewer-${randomUUID()}`;\n''',
              'reviewer token',
          )
          replace_once(
              test,
              '''const outsiderHeaders = { authorization: `Bearer ${outsiderToken}` };\n\nlet app: FastifyInstance;\nlet db: Postgres;\nlet sessionId = "";\n''',
              '''const outsiderHeaders = { authorization: `Bearer ${outsiderToken}` };\nconst reviewerHeaders = { authorization: `Bearer ${reviewerToken}` };\n\nlet app: FastifyInstance;\nlet db: Postgres;\nlet sessionId = "";\nlet successorSessionId = "";\nlet promotionReviewId = "";\n''',
              'reviewer headers and cleanup state',
          )
          replace_once(
              test,
              '''      ($5,$6,'Workspace Outsider')`,\n    [\n      actorAId,\n      `${actorAId}@example.test`,\n      actorBId,\n      `${actorBId}@example.test`,\n      outsiderId,\n      `${outsiderId}@example.test`,\n    ],\n''',
              '''      ($5,$6,'Workspace Outsider'),\n      ($7,$8,'Workspace Reviewer')`,\n    [\n      actorAId,\n      `${actorAId}@example.test`,\n      actorBId,\n      `${actorBId}@example.test`,\n      outsiderId,\n      `${outsiderId}@example.test`,\n      reviewerId,\n      `${reviewerId}@example.test`,\n    ],\n''',
              'reviewer user',
          )
          replace_once(
              test,
              '''      ($1,$4,'VIEWER',null),\n      ($2,$4,'VIEWER',null),\n      ($3,$4,'VIEWER',null)`,\n    [actorAId, actorBId, outsiderId, spaceId],\n''',
              '''      ($1,$5,'VIEWER',null),\n      ($2,$5,'VIEWER',null),\n      ($3,$5,'VIEWER',null),\n      ($4,$5,'REVIEWER',null)`,\n    [actorAId, actorBId, outsiderId, reviewerId, spaceId],\n''',
              'reviewer membership',
          )
          replace_once(
              test,
              '''  }\n  await insertToken(actorAId, actorAToken, "workspace actor a");\n''',
              '''  }\n  await grantVaultMembership(db, {\n    userId: reviewerId,\n    vaultId,\n    role: "REVIEWER",\n    pathPrefix: null,\n    permissions: ["knowledge:read", "knowledge:review"],\n  });\n  await insertToken(actorAId, actorAToken, "workspace actor a");\n''',
              'reviewer vault membership',
          )
          replace_once(
              test,
              '''  await insertToken(outsiderId, outsiderToken, "workspace outsider");\n''',
              '''  await insertToken(outsiderId, outsiderToken, "workspace outsider");\n  await insertToken(\n    reviewerId,\n    reviewerToken,\n    "workspace reviewer",\n    null,\n    ["knowledge:read", "knowledge:review"],\n  );\n''',
              'reviewer token insert',
          )
          replace_once(
              test,
              '''    if (sessionId) {\n      await db.pool.query(\n        "delete from audit_events where resource_type='agent_session' and resource_id=$1",\n        [sessionId],\n      );\n      await db.pool.query("delete from agent_sessions where id=$1", [\n        sessionId,\n      ]);\n    }\n''',
              '''    if (promotionReviewId) {\n      await db.pool.query("delete from reviews where id=$1", [promotionReviewId]);\n    }\n    await db.pool.query(\n      "delete from audit_events where actor_id=any($1::uuid[])",\n      [[actorAId, actorBId, outsiderId, reviewerId]],\n    );\n    for (const id of [successorSessionId, sessionId]) {\n      if (id) {\n        await db.pool.query("delete from agent_sessions where id=$1", [id]);\n      }\n    }\n''',
              'session review audit cleanup',
          )
          replace_once(
              test,
              '''          tokenHash(outsiderToken),\n        ],\n''',
              '''          tokenHash(outsiderToken),\n          tokenHash(reviewerToken),\n        ],\n''',
              'reviewer api token cleanup',
          )
          replace_once(
              test,
              '''      [[actorAId, actorBId, outsiderId], spaceId],\n''',
              '''      [[actorAId, actorBId, outsiderId, reviewerId], spaceId],\n''',
              'reviewer membership cleanup',
          )
          replace_once(
              test,
              '''      [actorAId, actorBId, outsiderId],\n''',
              '''      [actorAId, actorBId, outsiderId, reviewerId],\n''',
              'reviewer user cleanup',
          )
          replace_once(
              test,
              '''    expect(created.statusCode).toBe(201);\n    sessionId = (created.json() as { id: string }).id;\n''',
              '''    expect(created.statusCode).toBe(201);\n    const createdSession = created.json() as {\n      id: string;\n      contextRevisionSetHash: string;\n    };\n    sessionId = createdSession.id;\n    const initialRevisionSetHash = createdSession.contextRevisionSetHash;\n    expect(initialRevisionSetHash).toMatch(/^[a-f0-9]{64}$/);\n''',
              'capture initial revision hash',
          )
          replace_once(
              test,
              '''    const promotionBody = promotion.json() as {\n      reviewId: string;\n      promotionEventId: string;\n      evidenceEventIds: string[];\n      revisionSetHash: string;\n    };\n''',
              '''    const promotionBody = promotion.json() as {\n      reviewId: string;\n      promotionEventId: string;\n      evidenceEventIds: string[];\n      revisionSetHash: string;\n    };\n    promotionReviewId = promotionBody.reviewId;\n''',
              'track promotion review',
          )
          replace_once(
              test,
              '''    expect(\n      Number(\n        (\n          await db.pool.query(\n            "select count(*)::int count from reviews where vault_id=$1",\n            [vaultId],\n          )\n        ).rows[0]?.count ?? 0,\n      ),\n    ).toBeGreaterThan(0);\n''',
              '''    expect(\n      Number(\n        (\n          await db.pool.query(\n            "select count(*)::int count from reviews where vault_id=$1",\n            [vaultId],\n          )\n        ).rows[0]?.count ?? 0,\n      ),\n    ).toBeGreaterThan(0);\n\n    const issuedAgent = await app.inject({\n      method: "POST",\n      url: `/v1/sessions/${sessionId}/agent-processes`,\n      headers: actorAHeaders,\n      payload: {\n        label: "Promotion governance agent",\n        durationMinutes: 30,\n        allowedActions: [\n          "workspace:read",\n          "workspace:event:append",\n          "knowledge:read",\n          "knowledge:propose",\n        ],\n      },\n    });\n    expect(issuedAgent.statusCode).toBe(201);\n    const agentToken = (issuedAgent.json() as { token: string }).token;\n    expect(agentToken).toBeTruthy();\n\n    const agentApproval = await app.inject({\n      method: "POST",\n      url: `/v1/reviews/${promotionBody.reviewId}/decision`,\n      headers: { authorization: `Bearer ${agentToken}` },\n      payload: {\n        decision: "APPROVE",\n        reason: "An agent process must never self-approve its promotion.",\n      },\n    });\n    expect(agentApproval.statusCode).toBe(403);\n\n    const humanApproval = await app.inject({\n      method: "POST",\n      url: `/v1/reviews/${promotionBody.reviewId}/decision`,\n      headers: reviewerHeaders,\n      payload: {\n        decision: "APPROVE",\n        reason: "Human reviewer validated the promoted workspace evidence.",\n      },\n    });\n    expect(humanApproval.statusCode).toBe(200);\n    expect(humanApproval.json()).toMatchObject({\n      id: promotionBody.reviewId,\n      status: "APPROVED",\n    });\n\n    const publishedReview = await db.pool.query<{\n      status: string;\n      merged_commit: string | null;\n    }>("select status,merged_commit from reviews where id=$1", [\n      promotionBody.reviewId,\n    ]);\n    expect(publishedReview.rows[0]?.status).toBe("APPROVED");\n    expect(publishedReview.rows[0]?.merged_commit).toBeTruthy();\n\n    const staleOriginal = await app.inject({\n      method: "GET",\n      url: `/v1/sessions/${sessionId}/state`,\n      headers: actorAHeaders,\n    });\n    expect(staleOriginal.statusCode).toBe(200);\n    expect(staleOriginal.json()).toMatchObject({\n      contextRevision: {\n        status: "CHANGED",\n        changedDimensions: expect.arrayContaining(["knowledgeGit"]),\n      },\n    });\n\n    const successor = await app.inject({\n      method: "POST",\n      url: "/v1/sessions",\n      headers: actorAHeaders,\n      payload: {\n        spaceId,\n        vaultId,\n        purpose: "Resume after governed promotion publication",\n        contextBudget: 4096,\n      },\n    });\n    expect(successor.statusCode).toBe(201);\n    const successorBody = successor.json() as {\n      id: string;\n      contextRevisionSetHash: string;\n    };\n    successorSessionId = successorBody.id;\n    expect(successorBody.contextRevisionSetHash).not.toBe(initialRevisionSetHash);\n\n    const successorState = await app.inject({\n      method: "GET",\n      url: `/v1/sessions/${successorSessionId}/state`,\n      headers: actorAHeaders,\n    });\n    expect(successorState.statusCode).toBe(200);\n    expect(successorState.json()).toMatchObject({\n      contextRevision: { status: "CURRENT" },\n    });\n''',
              'governed promotion e2e',
          )
          PY
          pnpm exec prettier --write apps/api/test/workspace-coordination.integration.test.ts
      - run: pnpm exec prettier --check .
      - run: pnpm build
      - run: docker compose up -d --wait postgres minio
      - run: |
          rm -rf "$AKP_MANAGED_REPO"
          git init -b main "$AKP_MANAGED_REPO"
          git -C "$AKP_MANAGED_REPO" config user.name "AKP CI"
          git -C "$AKP_MANAGED_REPO" config user.email "akp-ci@localhost"
          git -C "$AKP_MANAGED_REPO" commit --allow-empty -m "chore: initialize managed knowledge for CI"
      - run: pnpm db:migrate
      - name: Run governed promotion integration
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/workspace-coordination.integration.test.ts
      - name: Commit governed promotion E2E
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/test/workspace-coordination.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(p2): prove governed promotion revision transition"
          git push origin HEAD:batch/p2-governed-promotion-e2e-v2-20260916
      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose ps --all || true
          docker compose logs --no-color postgres minio || true
      - name: Stop services
        if: always()
        run: docker compose down -v
