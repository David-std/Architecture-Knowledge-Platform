name: one-shot-p2-format-cleanup

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format exact P2 cleanup files and remove this workflow
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/api/test/bootstrap-context.integration.test.ts \
            apps/api/test/offline-snapshot.integration.test.ts \
            apps/api/test/security.integration.test.ts \
            packages/application/src/index.ts
          git rm .github/workflows/format-p2-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/test/bootstrap-context.integration.test.ts \
            apps/api/test/offline-snapshot.integration.test.ts \
            apps/api/test/security.integration.test.ts \
            packages/application/src/index.ts
          git commit -m "style(p2): format context fabric cleanup"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
