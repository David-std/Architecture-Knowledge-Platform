name: one-shot-format-mcp-identity-contract

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - name: Normalize identity contract block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("contracts/mcp-tools.json")
          text = path.read_text()
          old = '''    {
            "name": "akp_get_current_identity",
            "version": "1.0.0",
            "permission": "knowledge:read",
            "mutates": false,
            "inputSchema": {
              "type": "object",
              "additionalProperties": false,
              "properties": {}
            },
            "http": { "method": "GET", "path": "/v1/auth/session" }
          },'''
          # The previous insertion was de-indented by the YAML/Python literal boundary.
          malformed = '''    {
          "name": "akp_get_current_identity",
          "version": "1.0.0",
          "permission": "knowledge:read",
          "mutates": false,
          "inputSchema": {
            "type": "object",
            "additionalProperties": false,
            "properties": {}
          },
          "http": { "method": "GET", "path": "/v1/auth/session" }
        },'''
          # Match structurally from the unique tool name, regardless of current indentation.
          import re
          pattern = re.compile(r'    \{\n\s+"name": "akp_get_current_identity",\n\s+"version": "1\.0\.0",\n\s+"permission": "knowledge:read",\n\s+"mutates": false,\n\s+"inputSchema": \{\n\s+"type": "object",\n\s+"additionalProperties": false,\n\s+"properties": \{\}\n\s+\},\n\s+"http": \{ "method": "GET", "path": "/v1/auth/session" \}\n\s+\},')
          updated, count = pattern.subn(old, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one identity block, replaced {count}")
          path.write_text(updated)
          PY
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-format-mcp-contract.yml
          git add contracts/mcp-tools.json
          git diff --cached --check
          git commit -m "style(mcp): normalize identity contract formatting"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
