name: p7-outbox-materialize

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'work/p5-document-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --strict-peer-dependencies
      - name: Materialize durable W3C event context
        shell: bash
        run: |
          set -euo pipefail
          node scripts/p7-outbox-materialize.mjs
          pnpm exec prettier --write packages/postgres/src/outbox.ts pnpm-lock.yaml
          git rm scripts/p7-outbox-materialize.mjs
          rm .github/workflows/p7-outbox-materialize.yml
          node scripts/validate-repository-hygiene.mjs --write
          git config user.name "AKP CI"
          git config user.email "akp-ci@localhost"
          git add packages/postgres/src/outbox.ts pnpm-lock.yaml REPOSITORY_FILE_CLASSIFICATION.json
          git commit -m "feat(p7): persist and propagate durable W3C trace context"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
