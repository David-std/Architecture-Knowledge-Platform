name: one-shot-p2-format-principal-expiry

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format regression exactly
        run: pnpm exec prettier --write apps/api/test/principal-credential-expiry.integration.test.ts
      - name: Validate formatting and static contracts
        run: |
          pnpm exec prettier --check apps/api/test/principal-credential-expiry.integration.test.ts
          pnpm check
      - name: Commit formatted regression and consume workflow
        run: |
          git rm .github/workflows/p2-format-principal-expiry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/principal-credential-expiry.integration.test.ts
          git diff --cached --check
          git commit -m "style(p2): format principal expiry regression"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
