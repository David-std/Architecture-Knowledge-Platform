name: resilience-matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  injected-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_API_TOKEN: akp-ci-integration-token-not-for-production
      AKP_API_TOKEN_SCOPES: >-
        {"spaces":[{"spaceId":"00000000-0000-0000-0000-000000000003","pathPrefix":null,"permissions":["knowledge:read","source:read","source:write","knowledge:propose","knowledge:review","eval:run","admin"]}]}
      AKP_API_URL: http://127.0.0.1:8080
      PORT: 8080
      AKP_INGEST_ROOTS: ${{ github.workspace }}/test/fixtures
      AKP_PROJECT_ROOTS: ${{ github.workspace }}
      AKP_MANAGED_REPO: /tmp/akp-managed-resilience
      AKP_EXTRACTOR_URL: http://127.0.0.1:8090
      AKP_EXTRACTOR_TOKEN: akp-ci-extractor-token-not-for-production
      AKP_RAW_ENDPOINT: http://127.0.0.1:19000
      AKP_RAW_BUCKET: akp-raw
      AKP_RAW_ACCESS_KEY: akp
      AKP_RAW_SECRET_KEY: akp-ci-minio-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: apps/extractor/uv.lock
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Install pinned Graphify for recovery rebuild
        shell: bash
        run: |
          uv tool install graphifyy==0.9.63
          echo "AKP_GRAPHIFY_EXECUTABLE=$(uv tool dir --bin)/graphify" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: docker compose up -d --wait postgres minio extractor
      - run: |
          rm -rf "$AKP_MANAGED_REPO"
          git init -b main "$AKP_MANAGED_REPO"
          git -C "$AKP_MANAGED_REPO" config user.name "AKP Resilience CI"
          git -C "$AKP_MANAGED_REPO" config user.email "akp-resilience-ci@localhost"
          mkdir -p "$AKP_MANAGED_REPO/managed" "$AKP_MANAGED_REPO/src"
          cat > "$AKP_MANAGED_REPO/managed/resilience-restore-probe.md" <<'EOF'
          ---
          id: RESILIENCE-RESTORE-PROBE
          title: Resilience Restore Probe
          type: note
          status: active
          knowledge_layer: managed
          ---

          Recovery must restore this managed Git source and rebuild a searchable projection.
          EOF
          cat > "$AKP_MANAGED_REPO/src/resilience-code.ts" <<'EOF'
          export function restoredDependency(): string {
            return "resilience";
          }

          export function restoredCaller(): string {
            return restoredDependency();
          }
          EOF
          git -C "$AKP_MANAGED_REPO" add --all
          git -C "$AKP_MANAGED_REPO" commit -m "test: initialize resilience repository"
      - run: pnpm db:migrate
      - run: pnpm auth:provision
      - name: Validate durable leasing, fencing, retry and quarantine
        run: |
          pnpm --filter @akp/postgres exec vitest run test/outbox.integration.test.ts
          pnpm --filter @akp/worker exec vitest run test/drain.integration.test.ts
      - name: Validate Continuous Assurance and authenticated connector boundaries
        run: |
          pnpm --filter @akp/postgres exec vitest run \
            test/assurance.integration.test.ts \
            test/source-connectors.integration.test.ts
          pnpm --filter @akp/worker exec vitest run \
            test/assurance-worker.integration.test.ts
          pnpm --filter @akp/api exec vitest run test/source-connectors.test.ts
          pnpm --filter @akp/api exec vitest run \
            --config vitest.integration.config.ts \
            test/source-connectors.integration.test.ts
      - name: Validate recovery and failure-injection boundaries
        run: |
          pnpm --filter @akp/api exec vitest run \
            --config vitest.integration.config.ts \
            test/workspace-coordination.integration.test.ts \
            test/context-fabric.integration.test.ts \
            test/temporal-truth-retrieval.integration.test.ts
          pnpm --filter @akp/postgres exec vitest run \
            test/federated-graph.integration.test.ts \
            test/knowledge-profile-activation.integration.test.ts
          pnpm --filter @akp/indexing exec vitest run \
            test/community-index.integration.test.ts
          pnpm --filter @akp/retrieval exec vitest run test/ppr.test.ts
          pnpm --filter @akp/worker exec vitest run \
            test/compilation-stage.test.ts \
            test/truth-maintenance.test.ts
      - name: Validate idempotent redelivery, vector invariants and stale generations
        run: |
          pnpm --filter @akp/indexing exec vitest run \
            test/incremental-index.integration.test.ts \
            test/embedding-generation.integration.test.ts \
            test/embedding-stale-generation.integration.test.ts
      - name: Validate graph mismatch degradation
        run: |
          pnpm --filter @akp/retrieval exec vitest run test/query-planner.test.ts
          pnpm --filter @akp/api exec vitest run test/retrieval-capabilities.test.ts
      - name: Validate publication compensation and recovery
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/publication-recovery.integration.test.ts
      - name: Validate semantic provider degradation preserves the active generation
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/projection-vector-preservation.integration.test.ts
      - name: Validate unavailable document-intelligence provider fails closed
        working-directory: apps/extractor
        run: |
          uv sync --locked
          uv run --locked pytest -p no:cacheprovider \
            tests/test_explicit_provider_fail_closed.py -q
      - name: Validate collector-independent observability bridge
        run: >-
          pnpm --filter @akp/observability exec vitest run test/bridge.test.ts
      - name: Start API with MCP absent and OpenTelemetry collector unreachable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          OTEL_TRACES_EXPORTER=otlp \
          OTEL_METRICS_EXPORTER=otlp \
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:43199 \
          OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf \
          pnpm --filter @akp/api exec node --import tsx src/server.ts \
            > reports/ci/resilience-api.log 2>&1 &
          echo $! > reports/ci/resilience-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/readiness \
              > reports/ci/readiness-baseline.json; then
              exit 0
            fi
            sleep 1
          done
          cat reports/ci/resilience-api.log
          exit 1
      - name: Inject PostgreSQL, MinIO and extractor restarts
        shell: bash
        run: |
          set -euo pipefail

          wait_ready() {
            local label="$1"
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8080/health/readiness \
                > "reports/ci/readiness-${label}.json"; then
                node -e '
                  const fs=require("fs");
                  const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                  if (body.status!=="UP" || !body.database || !body.rawObjectStore || !body.extractor) process.exit(1);
                ' "reports/ci/readiness-${label}.json"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          expect_down() {
            local service="$1"
            local field="$2"
            local label="$3"
            local observed_down=0
            docker compose stop "$service"
            for i in $(seq 1 30); do
              local code
              code=$(curl -sS -o "reports/ci/readiness-${label}-down.json" \
                -w '%{http_code}' http://127.0.0.1:8080/health/readiness || true)
              if ! curl -fsS http://127.0.0.1:8080/health/liveness \
                > "reports/ci/liveness-${label}-down.json"; then
                echo "API liveness failed while ${service} was stopped" >&2
                return 1
              fi
              if [ "$code" = "503" ] && FIELD="$field" node -e '
                const fs=require("fs");
                const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                if (body.status!=="DOWN" || body[process.env.FIELD]!==false) process.exit(1);
              ' "reports/ci/readiness-${label}-down.json"; then
                observed_down=1
                break
              fi
              sleep 1
            done
            if [ "$observed_down" -ne 1 ]; then
              echo "Readiness never reported ${field}=false while ${service} was stopped" >&2
              cat "reports/ci/readiness-${label}-down.json" 2>/dev/null || true
              return 1
            fi
            docker compose up -d --wait "$service"
            wait_ready "${label}-recovered"
          }

          wait_ready "pre-injection"
          expect_down postgres database postgres
          expect_down minio rawObjectStore minio
          expect_down extractor extractor extractor
      - name: Validate backup restore then projection rebuild
        shell: pwsh
        run: |
          ./scripts/backup.ps1 `
            -OutputDirectory backups/resilience-recovery `
            -ManagedRepository $env:AKP_MANAGED_REPO
          ./scripts/restore-smoke.ps1 `
            -BackupDirectory backups/resilience-recovery `
            -ManagedRepository $env:AKP_MANAGED_REPO
          ./scripts/verify-managed-git-restore.ps1 `
            -BackupDirectory backups/resilience-recovery `
            -SourceManagedRepository $env:AKP_MANAGED_REPO `
            -SpaceId 00000000-0000-0000-0000-000000000003
      - name: Persist executed resilience matrix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const manifest = JSON.parse(
            readFileSync("evals/generic/resilience-failure-matrix.json", "utf8"),
          );
          const report = {
            schemaVersion: manifest.schemaVersion,
            status: "PROVEN",
            evidenceLevel: manifest.evidenceLevel,
            commit: process.env.GITHUB_SHA,
            executedAt: new Date().toISOString(),
            runtime: {
              node: process.version,
              platform: process.platform,
              architecture: process.arch,
            },
            scenarios: manifest.scenarios.map((scenario) => ({
              ...scenario,
              status: "PROVEN",
            })),
            limitations: manifest.limitations,
          };
          writeFileSync(
            "reports/ci/resilience-matrix.json",
            `${JSON.stringify(report, null, 2)}\n`,
          );
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Capture resilience diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports/ci
          docker compose ps --all > reports/ci/resilience-docker-compose-ps.txt 2>&1
          docker compose logs --no-color --timestamps \
            > reports/ci/resilience-docker-compose.log 2>&1
      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resilience-matrix-${{ github.run_id }}
          path: |
            reports/ci
            backups/resilience-recovery/manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop API and disposable services
        if: always()
        shell: bash
        run: |
          if [ -f reports/ci/resilience-api.pid ]; then
            kill "$(cat reports/ci/resilience-api.pid)" 2>/dev/null || true
          fi
          docker compose down -v --remove-orphans
