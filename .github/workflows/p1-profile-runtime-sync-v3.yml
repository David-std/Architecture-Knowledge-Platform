name: p1-profile-runtime-sync-v3

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/v0.4-enterprise-context-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply active-profile compiler binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def r(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: {path}: expected 1, got {count}")
              p.write_text(text.replace(old, new, 1))

          p = 'packages/compiler/src/contracts.ts'
          r(p, 'import { z } from "zod";\n',
            'import { z } from "zod";\nimport { KnowledgeProfileV1 } from "@akp/contracts/knowledge-profile";\n',
