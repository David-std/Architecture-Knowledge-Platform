''', 'profile context')
          r(p, '    existingCandidates: z.array(ExistingKnowledgeCandidate).max(50),\n',
            '    existingCandidates: z.array(ExistingKnowledgeCandidate).max(50),\n    knowledgeProfile: CompilerKnowledgeProfileContext,\n',
            'profile input')
