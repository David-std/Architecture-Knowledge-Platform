name: format-once

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply canonical formatter and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feat/v0.4-enterprise-context-workspace
          pnpm exec prettier --write apps/api/test/governed-product-flow.integration.test.ts
          rm .github/workflows/format-once.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format governed workspace integration test"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
