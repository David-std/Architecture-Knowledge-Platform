name: P1 interoperability materializer

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - scripts/tmp-p1-interop-materialize.py
      - .github/workflows/p1-interop-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Materialize P1 interoperability candidate
        run: python scripts/tmp-p1-interop-materialize.py

      - name: Format candidate
        run: >-
          pnpm exec prettier --write
          apps/api/src/interoperability.ts
          apps/api/src/review-draft.ts
          apps/api/src/routes/interoperability.ts
          apps/api/src/routes/reviews.ts
          apps/api/src/server.ts
          apps/api/test/interoperability.test.ts
          apps/api/test/interoperability.integration.test.ts

      - name: Build workspace packages
        run: pnpm build

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run interoperability unit tests
        run: >-
          pnpm --filter @akp/api exec vitest run
          test/interoperability.test.ts

      - name: Run interoperability integration
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/interoperability.integration.test.ts

      - name: Re-run review policy integration after proposal refactor
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/review-policy.integration.test.ts

      - name: Run workspace check
        run: pnpm check

      - name: Promote clean product commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/interoperability.ts \
            apps/api/src/review-draft.ts \
            apps/api/src/routes/interoperability.ts \
            apps/api/src/routes/reviews.ts \
            apps/api/src/server.ts \
            apps/api/test/interoperability.test.ts \
            apps/api/test/interoperability.integration.test.ts
          git rm -f .github/workflows/p1-interop-materialize.yml scripts/tmp-p1-interop-materialize.py
          git diff --cached --check
          git commit -m "feat(p1): add governed knowledge interoperability"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace

      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans || true
