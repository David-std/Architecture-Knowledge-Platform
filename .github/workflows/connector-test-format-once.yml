name: connector-test-format-once

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - .github/workflows/connector-test-format-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply canonical test formatting and consume staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$GITHUB_SHA"
          pnpm exec prettier --write packages/contracts/test/connector-capabilities.test.ts
          rm -f .github/workflows/connector-test-format-once.yml
          git add packages/contracts/test/connector-capabilities.test.ts .github/workflows
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(p2): format connector capability regressions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
