            scripts/agent-ab-benchmark.ts | sort > /tmp/expected
          git diff --name-only | sort > /tmp/changed
          diff -u /tmp/expected /tmp/changed
      - name: Validate repository
        run: pnpm check
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://akp:akp@localhost:55432/akp
        run: pnpm db:migrate
      - name: Validate embedding integration semantics
        env:
          DATABASE_URL: postgres://akp:akp@localhost:55432/akp
        run: pnpm --filter @akp/indexing exec vitest run test/embedding-index.integration.test.ts
      - name: Preflight Scale 100K
        env:
          DATABASE_URL: postgres://akp:akp@localhost:55432/akp
        shell: bash
        run: |
          pnpm benchmark:scale -- \
            --output reports/preflight-scale-100000.json \
            --targets 100000 \
            --iterations 1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('reports/preflight-scale-100000.json', 'utf8'));
          if (report.status !== 'PASSED' || report.cleanup?.succeeded !== true || report.results?.[0]?.targetDocuments !== 100000) {
            throw new Error(`Scale 100K preflight failed: ${JSON.stringify({status: report.status, cleanup: report.cleanup, failure: report.failure})}`);
          }
          NODE
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            db/migrations/026_consolidate_embedding_validation.sql \
            scripts/agent-ab-benchmark.ts
          git commit -m "fix(p10): stabilize agent evidence and embedding scale"
          git push origin HEAD:work/product-completion-final
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
