name: P2 Workspace Contract Preflight

on:
  push:
    branches: [feat/v0.4-enterprise-context-workspace]
    paths:
      - .github/scripts/p2-workspace-contract-sync.py
      - .github/workflows/p2-workspace-contract-preflight.yml

permissions:
  contents: write

jobs:
  contract-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize P2 shared contracts
        run: python3 .github/scripts/p2-workspace-contract-sync.py

      - name: Format touched contract surfaces
        run: |
          pnpm exec prettier --write \
            contracts/openapi.yaml \
            contracts/asyncapi.yaml \
            contracts/mcp-tools.json \
            apps/mcp/src/server.ts \
            scripts/validate-contracts.mjs \
            scripts/mcp-smoke.ts

      - name: Capture candidate diff
        run: git diff --binary > /tmp/p2-workspace-contract.patch

      - name: Validate shared contracts
        run: pnpm contracts:validate

      - name: MCP package gate
        run: pnpm --filter @akp/mcp check

      - name: Monorepo static gate
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Promote verified contract patch
        run: |
          remote_head="$(git ls-remote origin refs/heads/feat/v0.4-enterprise-context-workspace | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch advanced concurrently: expected $GITHUB_SHA, found $remote_head" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/openapi.yaml \
            contracts/asyncapi.yaml \
            contracts/mcp-tools.json \
            apps/mcp/src/server.ts \
            scripts/validate-contracts.mjs \
            scripts/mcp-smoke.ts
          git diff --cached --check
          git commit -m "feat(p2): publish workspace coordination contracts"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace

      - name: Upload candidate patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-workspace-contract-candidate
          path: /tmp/p2-workspace-contract.patch
          if-no-files-found: ignore
