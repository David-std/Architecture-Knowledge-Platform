name: Reconcile unified branch

on:
  push:
    branches:
      - work/product-completion-unified

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-unified
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Align extractor multipart contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/worker/src/worker.ts")
          text = path.read_text(encoding="utf-8")
          old = 'upload.set("configuration", JSON.stringify(configuration));'
          new = 'upload.set("configuration_json", JSON.stringify(configuration));'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one legacy extractor configuration field, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Regenerate workspace lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Remove reconciliation workflow
        run: rm .github/workflows/reconcile.yml
      - name: Commit deterministic reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/worker.ts apps/mcp/package.json pnpm-lock.yaml .github/workflows/reconcile.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore: reconcile workspace lock and extractor contract"
          git push origin HEAD:work/product-completion-unified
