name: evidence-admission-open-reader-authority-fresh-dev

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-admission-open-reader-authority-fresh-dev:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'experiment/open-reader-authority-fresh-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AKP_LOCAL_AGENT_MODEL: onnx-community/Qwen2.5-1.5B-Instruct
      AKP_LOCAL_AGENT_MODEL_REVISION: 9f9c976052bfb08a20793f0c3013563dc095c966
      AKP_LOCAL_AGENT_DTYPE: q4
      AKP_LOCAL_AGENT_PORT: "18083"
      AKP_OPEN_READER_BASE_URL: http://127.0.0.1:18083/chat/completions
      AKP_OPEN_READER_MODEL: onnx-community/Qwen2.5-1.5B-Instruct
      AKP_OPEN_READER_MODEL_REVISION: 9f9c976052bfb08a20793f0c3013563dc095c966
      AKP_OPEN_READER_DTYPE: q4
      AKP_OPEN_READER_FRESH_DEV_REPORT: reports/ci/open-reader-authority-fresh-dev.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Validate frozen open-reader worker
        run: |
          pnpm exec prettier --check \
            evals/generic/open-reader-authority-fresh-dev/domains/*.json \
            evals/generic/open-reader-authority-fresh-dev/manifest.json \
            scripts/evidence-admission-open-reader-authority-fresh-dev-experiment.ts \
            .github/workflows/evidence-admission-open-reader-authority-fresh-dev.yml
          pnpm check
      - name: Build provider workspace dependency
        run: pnpm --filter @akp/contracts build
      - name: Prepare experiment evidence
        run: mkdir -p reports/ci
      - name: Start pinned 1.5B local reader provider
        shell: bash
        run: |
          pnpm --filter @akp/retrieval exec tsx scripts/local-agent-provider.ts \
            > reports/ci/open-reader-provider.log 2>&1 &
          echo $! > /tmp/open-reader-provider.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:18083/health \
              > reports/ci/open-reader-provider-health.json; then
              cat reports/ci/open-reader-provider-health.json
              exit 0
            fi
            sleep 5
          done
          cat reports/ci/open-reader-provider.log >&2
          exit 1
      - name: Execute frozen open-reader authority development gate
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/evidence-admission-open-reader-authority-fresh-dev-experiment.ts \
            2>&1 | tee reports/ci/open-reader-authority-fresh-dev.log
      - name: Validate governed development outcome
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync("reports/ci/open-reader-authority-fresh-dev.json", "utf8"),
          );
          const health = JSON.parse(
            readFileSync("reports/ci/open-reader-provider-health.json", "utf8"),
          );
          if (
            ![
              "PROCEED_TO_FRESH_HOLDOUT",
              "REJECT_FRESH_DEVELOPMENT_FRONTIER",
            ].includes(report.outcome)
          ) {
            throw new Error("Open-reader development outcome is invalid.");
          }
          if (
            report.heldoutEvaluated !== false ||
            report.readerMayCreateSourceBoundSupport !== true ||
            report.runtimeChanged !== false ||
            report.productionAdmissionChanged !== false ||
            report.dataFreezeCommit !==
              "19c3d0c177ee78771d5c55eae0e3ae067f546274"
          ) {
            throw new Error("Open-reader worker crossed its claim boundary.");
          }
          if (report.gates?.allSemanticSupportsSourceBound !== true) {
            throw new Error("Open-reader source-bound invariant failed.");
          }
          if (
            health.model !== "onnx-community/Qwen2.5-1.5B-Instruct" ||
            health.revision !==
              "9f9c976052bfb08a20793f0c3013563dc095c966" ||
            health.dtype !== "q4"
          ) {
            throw new Error("Pinned 1.5B local reader identity drifted.");
          }
          console.log(
            JSON.stringify(
              {
                outcome: report.outcome,
                baseline: report.baseline,
                candidate: report.candidate,
                gates: report.gates,
                counts: report.counts,
                protocolHash: report.protocolHash,
                dataFreezeCommit: report.dataFreezeCommit,
              },
              null,
              2,
            ),
          );
          NODE
      - name: Upload open-reader evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-admission-open-reader-authority-fresh-dev-${{ github.run_id }}
          path: |
            reports/ci/open-reader-authority-fresh-dev.json
            reports/ci/open-reader-authority-fresh-dev.log
            reports/ci/open-reader-provider-health.json
            reports/ci/open-reader-provider.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop 1.5B local reader provider
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/open-reader-provider.pid ]; then
            kill "$(cat /tmp/open-reader-provider.pid)" 2>/dev/null || true
          fi
