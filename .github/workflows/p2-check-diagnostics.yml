name: p2-workspace-hardening-preflight

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Materialize bounded P2 hardening
        run: python .github/scripts/p2-workspace-hardening.py
      - name: Format and verify changed product files
        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
          pnpm exec prettier --check \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
      - name: Run repository check
        run: pnpm check
      - name: Start disposable Postgres
        run: docker compose up -d --wait postgres
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run focused workspace coordination integration
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/workspace-coordination.integration.test.ts
      - name: Promote verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            db/migrations/032_workspace_coordination_hardening.sql \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
          git diff --cached --quiet && { echo "No product delta to promote"; exit 1; }
          git commit -m "feat(p2): harden versioned workspace coordination"
          git push origin HEAD:${{ github.ref_name }}
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
