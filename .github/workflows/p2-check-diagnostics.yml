        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
          pnpm exec prettier --check \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
      - name: Run repository check
        run: pnpm check
      - name: Start disposable Postgres
        run: docker compose up -d --wait postgres
      - run: pnpm db:migrate
      - name: Run focused workspace coordination integration
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/workspace-coordination.integration.test.ts
      - name: Promote verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            db/migrations/032_workspace_coordination_hardening.sql \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
          git commit -m "feat(p2): harden versioned workspace coordination"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
