name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_API_TOKEN: akp-ci-integration-token-not-for-production
      AKP_API_TOKEN_SCOPES: >-
        {"spaces":[{"spaceId":"00000000-0000-0000-0000-000000000003","pathPrefix":null,"permissions":["knowledge:read","source:read","source:write","knowledge:propose","knowledge:review","eval:run","admin"]}]}
      AKP_API_URL: http://127.0.0.1:8080
      PORT: 8080
      AKP_INGEST_ROOTS: ${{ github.workspace }}/test/fixtures
      AKP_PROJECT_ROOTS: ${{ github.workspace }}
      AKP_MANAGED_REPO: /tmp/akp-managed-knowledge
      AKP_EXTRACTOR_TOKEN: akp-ci-extractor-token-not-for-production
      AKP_RAW_SECRET_KEY: akp-ci-minio-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm audit --audit-level high
      - name: Generate canonical P5 ingest contract patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOne(path, pattern, replacement) {
            const before = fs.readFileSync(path, 'utf8');
            const after = before.replace(pattern, replacement);
            if (after === before) throw new Error(`Expected replacement did not match: ${path}`);
            fs.writeFileSync(path, after);
          }

          replaceOne(
            'packages/contracts/src/index.ts',
            /export const IngestRequest = z\.object\(\{[\s\S]*?export type IngestRequest = z\.infer<typeof IngestRequest>;/,
            `export const DocumentIntelligenceIngestOptions = z\n  .object({\n    complexity: z\n      .enum([\n        "simple",\n        "digital",\n        "complex",\n        "scanned",\n        "formula",\n        "table-heavy",\n        "unknown",\n      ])\n      .optional(),\n    ocrRequired: z.boolean().default(false),\n    tables: z.boolean().default(false),\n    formula: z.boolean().default(false),\n    costPolicy: z.enum(["NO_PAID", "STANDARD", "QUALITY"]).default("STANDARD"),\n    privacyPolicy: z\n      .enum(["LOCAL_ONLY", "LOCAL_PREFERRED", "REMOTE_ALLOWED"])\n      .default("LOCAL_PREFERRED"),\n    language: z\n      .string()\n      .trim()\n      .regex(/^[A-Za-z][A-Za-z0-9_-]{1,31}$/)\n      .optional(),\n  })\n  .strict();\nexport type DocumentIntelligenceIngestOptions = z.infer<\n  typeof DocumentIntelligenceIngestOptions\n>;\n\nexport const IngestRequest = z.object({\n  spaceId: z.string().uuid(),\n  vaultId: z.string().uuid(),\n  sourceUri: z.string(),\n  expectedSha256: z\n    .string()\n    .regex(/^[a-f0-9]{64}$/)\n    .optional(),\n  title: z.string().optional(),\n  mediaType: z.string().optional(),\n  documentIntelligence: DocumentIntelligenceIngestOptions.optional(),\n  policy: z\n    .enum(["REVIEW_REQUIRED", "ALLOW_LOW_RISK_AUTO_APPROVAL"])\n    .default("REVIEW_REQUIRED"),\n  idempotencyKey: z.string().min(8).max(200).optional(),\n});\nexport type IngestRequest = z.infer<typeof IngestRequest>;`,
          );

          replaceOne(
            'apps/api/src/routes/ingest.ts',
            'import { IngestRequest } from "@akp/contracts";\nimport { z } from "zod";',
            'import { IngestRequest } from "@akp/contracts";',
          );
          replaceOne(
            'apps/api/src/routes/ingest.ts',
            /\nconst DocumentIntelligenceIngestOptions = z[\s\S]*?const DocumentIntelligenceIngestRequest = IngestRequest\.extend\(\{\n  documentIntelligence: DocumentIntelligenceIngestOptions\.optional\(\),\n\}\);\n/,
            '\n',
          );
          replaceOne(
            'apps/api/src/routes/ingest.ts',
            'DocumentIntelligenceIngestRequest.safeParse(request.body)',
            'IngestRequest.safeParse(request.body)',
          );

          fs.writeFileSync(
            'apps/worker/src/document-intelligence-request.ts',
            `import { DocumentIntelligenceIngestOptions } from "@akp/contracts";\n\n/**\n * Build the only document-intelligence values the ingest worker may send to\n * the internal extractor. Durable job payloads are revalidated even though\n * the API validated them at submission time. Legacy jobs without P5 policy\n * receive safe defaults; malformed/tampered P5 policy fails closed.\n */\nexport function documentIntelligenceFormFields(\n  payload: Record<string, unknown>,\n  jobId: string,\n): Record<string, string> {\n  const parsed = DocumentIntelligenceIngestOptions.safeParse(\n    payload.documentIntelligence ?? {},\n  );\n  if (!parsed.success) {\n    throw new Error("INVALID_DOCUMENT_INTELLIGENCE_PAYLOAD");\n  }\n  const options = parsed.data;\n  const configuration = options.language ? { language: options.language } : {};\n\n  return {\n    ...(options.complexity ? { complexity: options.complexity } : {}),\n    ocr_required: String(options.ocrRequired),\n    tables: String(options.tables),\n    formula: String(options.formula),\n    cost_policy: options.costPolicy,\n    privacy_policy: options.privacyPolicy,\n    ingest_job_id: jobId,\n    configuration_json: JSON.stringify(configuration),\n  };\n}\n\nexport function appendDocumentIntelligenceFormFields(\n  form: FormData,\n  payload: Record<string, unknown>,\n  jobId: string,\n): void {\n  for (const [name, value] of Object.entries(\n    documentIntelligenceFormFields(payload, jobId),\n  )) {\n    form.set(name, value);\n  }\n}\n`,
          );

          fs.writeFileSync(
            'apps/worker/test/document-intelligence-request.test.ts',
            `import { describe, expect, it } from "vitest";\nimport { IngestRequest } from "@akp/contracts";\nimport { documentIntelligenceFormFields } from "../src/document-intelligence-request.js";\n\ndescribe("document intelligence ingest controls", () => {\n  it("uses the shared ingest contract for provider-neutral policy", () => {\n    const parsed = IngestRequest.parse({\n      spaceId: "00000000-0000-0000-0000-000000000003",\n      vaultId: "00000000-0000-0000-0000-000000000004",\n      sourceUri: "/allowed/source.pdf",\n      documentIntelligence: {\n        complexity: "scanned",\n        ocrRequired: true,\n        tables: true,\n        formula: false,\n        costPolicy: "NO_PAID",\n        privacyPolicy: "LOCAL_ONLY",\n        language: "es",\n      },\n    });\n\n    expect(\n      documentIntelligenceFormFields(\n        parsed as unknown as Record<string, unknown>,\n        "11111111-1111-1111-1111-111111111111",\n      ),\n    ).toEqual({\n      complexity: "scanned",\n      ocr_required: "true",\n      tables: "true",\n      formula: "false",\n      cost_policy: "NO_PAID",\n      privacy_policy: "LOCAL_ONLY",\n      ingest_job_id: "11111111-1111-1111-1111-111111111111",\n      configuration_json: JSON.stringify({ language: "es" }),\n    });\n  });\n\n  it("uses safe defaults for legacy jobs without P5 policy", () => {\n    expect(documentIntelligenceFormFields({}, "job-legacy")).toEqual({\n      ocr_required: "false",\n      tables: "false",\n      formula: "false",\n      cost_policy: "STANDARD",\n      privacy_policy: "LOCAL_PREFERRED",\n      ingest_job_id: "job-legacy",\n      configuration_json: "{}",\n    });\n  });\n\n  it("rejects provider-specific or malformed durable policy instead of forwarding it", () => {\n    expect(() =>\n      documentIntelligenceFormFields(\n        {\n          documentIntelligence: {\n            complexity: "remote-magic",\n            ocrRequired: "yes",\n            extractor: "chunkr",\n            providerUrl: "https://attacker.invalid",\n          },\n        },\n        "job-tampered",\n      ),\n    ).toThrowError("INVALID_DOCUMENT_INTELLIGENCE_PAYLOAD");\n\n    expect(() =>\n      IngestRequest.parse({\n        spaceId: "00000000-0000-0000-0000-000000000003",\n        vaultId: "00000000-0000-0000-0000-000000000004",\n        sourceUri: "/allowed/source.pdf",\n        documentIntelligence: {\n          extractor: "chunkr",\n          providerUrl: "https://attacker.invalid",\n        },\n      }),\n    ).toThrow();\n  });\n});\n`,
          );
          NODE
          pnpm exec prettier --write \
            packages/contracts/src/index.ts \
            apps/api/src/routes/ingest.ts \
            apps/worker/src/document-intelligence-request.ts \
            apps/worker/test/document-intelligence-request.test.ts
      - name: Upload canonical P5 ingest contract patch
        uses: actions/upload-artifact@v7
        with:
          name: p5-ingest-contract-${{ github.run_id }}
          path: |
            packages/contracts/src/index.ts
            apps/api/src/routes/ingest.ts
            apps/worker/src/document-intelligence-request.ts
            apps/worker/test/document-intelligence-request.test.ts
          retention-days: 1
      - name: Check repository formatting
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci/formatted
          pnpm exec prettier apps/api/src/routes/provider-tasks.ts \
            > reports/ci/formatted/provider-tasks.ts
          pnpm exec prettier apps/worker/src/document-intelligence-request.ts \
            > reports/ci/formatted/document-intelligence-request.ts
          pnpm exec prettier apps/worker/src/worker.ts \
            > reports/ci/formatted/worker.ts
          pnpm exec prettier --check . 2>&1 | tee reports/ci/prettier-check.txt
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres minio extractor
      - run: |
          git init -b main "$AKP_MANAGED_REPO"
          git -C "$AKP_MANAGED_REPO" config user.name "AKP CI"
          git -C "$AKP_MANAGED_REPO" config user.email "akp-ci@localhost"
          git -C "$AKP_MANAGED_REPO" commit --allow-empty -m "chore: initialize managed knowledge for CI"
      - run: pnpm db:migrate
      - run: pnpm auth:provision
      - run: pnpm check
      - run: pnpm contracts:validate
      - run: pnpm docs:validate
      - run: pnpm hygiene:validate
      - run: pnpm build
      - run: pnpm security:secrets
      - name: Run API integration with a persisted report
        run: |
          mkdir -p reports/ci
          pnpm --filter @akp/api exec vitest run \
            --config vitest.integration.config.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=../../reports/ci/api-integration-junit.xml
      - run: >-
          pnpm akp vault import
          --vault-path test/fixtures/vault
          --space-id 00000000-0000-0000-0000-000000000003
          --read-only
      - run: pnpm verify:runtime
      - run: pnpm --filter @akp/api dev > api.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/readiness && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - run: pnpm test:mcp
      - shell: pwsh
        run: ./scripts/backup.ps1 -OutputDirectory backups/ci
      - shell: pwsh
        run: ./scripts/restore-smoke.ps1 -BackupDirectory backups/ci
      - name: Capture service and durable-work diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports/ci
          docker compose ps --all > reports/ci/docker-compose-ps.txt 2>&1
          docker compose logs --no-color --timestamps > reports/ci/docker-compose.log 2>&1
          docker compose exec -T postgres psql -X -U akp -d akp \
            -c "\copy (select d.consumer_name,e.event_type,d.status,count(*) as deliveries from event_deliveries d join event_outbox e on e.event_id=d.event_id group by d.consumer_name,e.event_type,d.status order by d.consumer_name,e.event_type,d.status) to stdout with csv header" \
            > reports/ci/outbox-delivery-summary.csv 2>&1
          docker compose exec -T postgres psql -X -U akp -d akp \
            -c "\copy (select state,count(*) as jobs from ingest_jobs group by state order by state) to stdout with csv header" \
            > reports/ci/ingest-job-summary.csv 2>&1
          for log in api.log worker.log; do
            if [ -f "$log" ]; then
              sed \
                -e "s|$AKP_API_TOKEN|<redacted>|g" \
                -e "s|$AKP_EXTRACTOR_TOKEN|<redacted>|g" \
                -e "s|$AKP_RAW_SECRET_KEY|<redacted>|g" \
                "$log" > "reports/ci/$log"
            fi
          done
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.job }}
          path: reports/ci
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extractor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install executable local document-intelligence tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils ffmpeg
          tesseract --version | head -n 1
          pdftoppm -v 2>&1 | head -n 1
          ffmpeg -version | head -n 1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: apps/extractor/uv.lock
      - run: uv sync --locked
      - name: Run Ruff with persisted diagnostics
        shell: bash
        run: |
          mkdir -p ../../reports/ci
          uv run --locked ruff check --no-cache --fix --diff . \
            > ../../reports/ci/python-ruff-fix.diff 2>&1 || true
          set -o pipefail
          uv run --locked ruff check --no-cache . 2>&1 | tee ../../reports/ci/python-ruff.txt
      - run: uv run --locked mypy app
      - name: Run extractor suite with real local OCR tools
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../reports/ci
          uv run --locked pytest -p no:cacheprovider -m "not provider_runtime" 2>&1 \
            | tee ../../reports/ci/python-pytest.txt
      - name: Upload Python diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.job }}
          path: reports/ci
          if-no-files-found: ignore
          retention-days: 14

  python-docling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extractor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: apps/extractor/uv.lock
      - name: Sync the locked opt-in Docling profile
        run: uv sync --locked --extra docling
      - name: Execute the real Docling provider against a structured fixture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../reports/ci
          uv run --locked --extra docling pytest -p no:cacheprovider \
            tests/test_p5_docling_runtime.py -q 2>&1 \
            | tee ../../reports/ci/python-docling.txt
      - name: Upload Docling diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.job }}
          path: reports/ci
          if-no-files-found: ignore
          retention-days: 14
