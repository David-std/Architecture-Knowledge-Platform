name: Finalize contracts and worker reconciliation

on:
  push:
    branches:
      - work/product-completion-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Reuse reconciliation transform and close legacy worker references
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/reconcile-contracts-worker.yml").read_text(encoding="utf-8").splitlines()
          marker = "      - name: Reconcile shared contracts and worker serialization"
          start = workflow.index(marker)
          run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == "run: |")
          block = []
          for line in workflow[run_line + 1 :]:
              if line.startswith("      - name:"):
                  break
              block.append(line[10:] if line.startswith("          ") else line)
          code = "\n".join(block)
          exec(compile(code, "reconcile-contracts-worker", "exec"), {})

          worker_path = Path("apps/worker/src/worker.ts")
          worker = worker_path.read_text(encoding="utf-8")
          worker, parsed_count = re.subn(
              r"const documentIntelligence = DocumentIntelligenceRequest\.parse\(\s*payload\.documentIntelligence \?\? \{\},\s*\);\s*const configuration = extractorConfiguration\(documentIntelligence\);",
              "const documentIntelligence = parseDocumentIntelligenceOptions(payload);",
              worker,
              count=1,
          )
          worker, fields_count = re.subn(
              r"if \(documentIntelligence\.complexity\) \{\s*upload\.set\(\"complexity\", documentIntelligence\.complexity\);\s*\}\s*if \(Object\.keys\(configuration\)\.length\) \{\s*upload\.set\(\"configuration_json\", JSON\.stringify\(configuration\)\);\s*\}",
              "appendDocumentIntelligenceFormFields(\n        upload,\n        payload,\n        id,\n        documentIntelligence,\n      );",
              worker,
              count=1,
          )
          worker = worker.replace(
              "ocrRequested: documentIntelligence.ocr ?? false,",
              "ocrRequested:\n          documentIntelligence.ocrRequired || documentIntelligence.ocr === true,",
          )
          if parsed_count != 1 or fields_count != 1:
              raise SystemExit(
                  f"legacy worker replacement incomplete: parse={parsed_count}, fields={fields_count}"
              )
          if "DocumentIntelligenceRequest" in worker or "extractorConfiguration(" in worker:
              raise SystemExit("legacy document intelligence references remain in worker")
          worker_path.write_text(worker, encoding="utf-8")
      - name: Regenerate and install workspace
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format reconciled files
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/index.ts \
            apps/worker/src/document-intelligence-request.ts \
            apps/worker/src/worker.ts \
            apps/worker/test/document-intelligence-request.test.ts \
            apps/mcp/package.json \
            pnpm-lock.yaml
      - name: Validate reconciled contracts and consumers
        run: |
          pnpm --filter @akp/contracts build
          pnpm --filter @akp/worker check
          pnpm --filter @akp/mcp build
          pnpm --filter @akp/api build
          pnpm build
      - name: Commit reconciled source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/index.ts \
            apps/worker/src/document-intelligence-request.ts \
            apps/worker/src/worker.ts \
            apps/worker/test/document-intelligence-request.test.ts \
            apps/mcp/package.json \
            pnpm-lock.yaml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: reconcile shared ingestion and MCP contracts"
          git push origin HEAD:work/product-completion-final
