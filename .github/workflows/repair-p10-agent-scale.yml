name: repair-p10-agent-scale

on:
  push:
    branches: [work/product-completion-final]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply evidence fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} count={text.count(old)}')
              return text.replace(old, new, 1)

          agent = Path('scripts/agent-ab-benchmark.ts')
          text = agent.read_text()
          text = replace_once(
              text,
              '''type ProviderResult = {
            output: AgentAbModelOutput;
            usage: ProviderUsage;
            latencyMs: number;
          };''',
              '''type ProviderResult = {
            output: AgentAbModelOutput;
            usage: ProviderUsage;
            latencyMs: number;
            formatRetries: number;
          };''',
              'ProviderResult type',
          )
          text = replace_once(
              text,
              '''    "Return one JSON object with exactly these fields:",
            '{"answer":"...","abstain":false,"citations":["..."],"claims":[{"text":"...","citations":["..."]}]}',
            "Use only citation identifiers that appear verbatim in the supplied context.",''',
              '''    "Return one complete JSON object only, with no markdown or text outside JSON.",
            "Keep answer under 120 words and use at most four concise claims so the JSON always fits the output budget.",
            "Return exactly these fields:",
            '{"answer":"...","abstain":false,"citations":["..."],"claims":[{"text":"...","citations":["..."]}]}',
            "Use only citation identifiers that appear verbatim in the supplied context.",''',
              'evaluation prompt contract',
          )
          invoke_start = text.index('async function invokeProvider(')
          run_arm_start = text.index('\nasync function runArm(', invoke_start)
          replacement = r'''async function invokeProvider(
            task: AgentAbTask,
            input: ArmInput,
            config: ReturnType<typeof benchmarkPrerequisites>,
          ): Promise<ProviderResult> {
            const basePrompt = evaluationPrompt(task, input.context);
            let totalLatencyMs = 0;
            let totalPromptTokens: number | null = null;
            let totalCompletionTokens: number | null = null;

            for (let attempt = 0; attempt < 2; attempt += 1) {
              const prompt =
                attempt === 0
                  ? basePrompt
                  : `${basePrompt}\n\nFORMAT RETRY: The prior completion was not a complete valid JSON object. Return the same answer task again as exactly one complete JSON object, no markdown, no commentary, and keep it concise.`;
              const started = performance.now();
              const response = await fetch(`${config.providerBaseUrl}/chat/completions`, {
                method: "POST",
                headers: {
                  ...(config.providerApiKey
                    ? { authorization: `Bearer ${config.providerApiKey}` }
                    : {}),
                  "content-type": "application/json",
                },
                body: JSON.stringify({
                  model: config.providerModel,
                  temperature: config.temperature,
                  max_tokens: config.maxOutputTokens,
                  messages: [
                    {
                      role: "system",
                      content:
                        "You are a controlled evaluation assistant. Follow the caller's JSON contract and never use knowledge outside the supplied context.",
                    },
                    { role: "user", content: prompt },
                  ],
                }),
                signal: AbortSignal.timeout(120_000),
              });
              totalLatencyMs += performance.now() - started;
              const responseText = await response.text();
              if (!response.ok) {
                throw new Error(
                  `Provider request ${response.status}: ${responseText.slice(0, 500)}`,
                );
              }
              const body = JSON.parse(responseText) as Record<string, unknown>;
              const choices = Array.isArray(body.choices) ? body.choices : [];
              const first = choices[0] as Record<string, unknown> | undefined;
              const message = first?.message as Record<string, unknown> | undefined;
              const content =
                typeof message?.content === "string" ? message.content : null;
              if (!content) throw new Error("Provider returned no text completion.");
              const usage = (body.usage ?? {}) as Record<string, unknown>;
              const promptTokens =
                typeof usage.prompt_tokens === "number" ? usage.prompt_tokens : null;
              const completionTokens =
                typeof usage.completion_tokens === "number"
                  ? usage.completion_tokens
                  : null;
              if (promptTokens !== null) {
                totalPromptTokens = (totalPromptTokens ?? 0) + promptTokens;
              }
              if (completionTokens !== null) {
                totalCompletionTokens =
                  (totalCompletionTokens ?? 0) + completionTokens;
              }
              try {
                return {
                  output: parseModelOutput(content),
                  usage: {
                    promptTokens: totalPromptTokens,
                    completionTokens: totalCompletionTokens,
                  },
                  latencyMs: totalLatencyMs,
                  formatRetries: attempt,
                };
              } catch (error) {
                if (attempt === 0) continue;
                const detail = error instanceof Error ? error.message : String(error);
                throw new Error(
                  `Provider response remained invalid after one format retry: ${detail}`,
                );
              }
            }
            throw new Error("Provider format retry loop exhausted unexpectedly.");
          }
'''
          text = text[:invoke_start] + replacement + text[run_arm_start:]
          text = replace_once(
              text,
              '''    retrievalMetadata: input.retrievalMetadata,
            modelOutput: provider.output,''',
              '''    retrievalMetadata: {
              ...input.retrievalMetadata,
              modelFormatRetries: provider.formatRetries,
            },
            modelOutput: provider.output,''',
              'record model format retries',
          )
          agent.write_text(text)

          scale = Path('scripts/load-scale-benchmark.ts')
          text = scale.read_text()
          text = replace_once(
              text,
              '''  await client.query("drop index if exists unit_embeddings_vector_idx");
          }''',
              '''  await client.query("drop index if exists unit_embeddings_vector_idx");
            await client.query("drop index if exists unit_embeddings_64_vector_idx");
            await client.query("drop index if exists unit_embeddings_384_vector_idx");
            const remainingAnnIndexes = await client.query<{ indexname: string }>(
              `select indexname
                 from pg_indexes
                where schemaname='public'
                  and tablename='unit_embeddings'
                  and lower(indexdef) like '% using hnsw %'`,
            );
            if (remainingAnnIndexes.rowCount !== 0) {
              throw new Error(
                `Scale benchmark exact-vector mode still has HNSW indexes: ${remainingAnnIndexes.rows
                  .map((row) => row.indexname)
                  .join(", ")}`,
              );
            }
          }''',
              'exact vector index preparation',
          )
          text = replace_once(
              text,
              '"The disposable scale database removes the HNSW index before fixture loading so general 1K-100K scale evidence is not conflated with ANN tuning; ANN selection is evaluated separately.",',
              '"The disposable scale database removes all HNSW indexes from unit_embeddings before fixture loading so general 1K-100K scale evidence is not conflated with ANN tuning; ANN selection is evaluated separately.",',
              'scale ANN limitation wording',
          )
          scale.write_text(text)

          workflow = Path('.github/workflows/agent-ab.yml')
          text = workflow.read_text()
          text = replace_once(
              text,
              'AKP_AGENT_AB_MAX_OUTPUT_TOKENS: "320"',
              'AKP_AGENT_AB_MAX_OUTPUT_TOKENS: "512"',
              'Agent output token budget',
          )
          workflow.write_text(text)
          PY
          pnpm exec prettier --write \
            scripts/agent-ab-benchmark.ts \
            scripts/load-scale-benchmark.ts \
            .github/workflows/agent-ab.yml
          git diff --check
          printf '%s\n' \
            .github/workflows/agent-ab.yml \
            scripts/agent-ab-benchmark.ts \
            scripts/load-scale-benchmark.ts | sort > /tmp/expected
          git diff --name-only | sort > /tmp/changed
          diff -u /tmp/expected /tmp/changed
      - name: Validate repository
        run: pnpm check
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/agent-ab.yml \
            scripts/agent-ab-benchmark.ts \
            scripts/load-scale-benchmark.ts
          git commit -m "fix(eval): harden final agent and scale evidence"
          git push origin HEAD:work/product-completion-final
