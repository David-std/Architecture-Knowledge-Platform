name: p2-format-once

on:
  push:
    branches:
      - batch/p2-clean-gate-20260916

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format P2 context fabric files
        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/context-fabric.ts \
            apps/api/src/routes/sessions.ts \
            apps/api/src/routes/workspace-presence.ts \
            apps/api/test/context-fabric.integration.test.ts \
            apps/api/test/p2-product-flow.integration.test.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            apps/api/test/workspace-presence.integration.test.ts \
            packages/application/src/index.ts \
            packages/postgres/src/team-context-fabric.ts \
            packages/postgres/src/workspace-coordination.ts \
            packages/postgres/src/workspace-presence.ts
      - name: Commit exact Prettier output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/api/src/routes/context-fabric.ts \
            apps/api/src/routes/sessions.ts \
            apps/api/src/routes/workspace-presence.ts \
            apps/api/test/context-fabric.integration.test.ts \
            apps/api/test/p2-product-flow.integration.test.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            apps/api/test/workspace-presence.integration.test.ts \
            packages/application/src/index.ts \
            packages/postgres/src/team-context-fabric.ts \
            packages/postgres/src/workspace-coordination.ts \
            packages/postgres/src/workspace-presence.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(p2): format context fabric hardening"
          git push origin HEAD:batch/p2-clean-gate-20260916
