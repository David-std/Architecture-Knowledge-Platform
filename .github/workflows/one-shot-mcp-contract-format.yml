name: one-shot-mcp-contract-format

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format MCP contract
        run: pnpm exec prettier --write contracts/mcp-tools.json
      - name: Commit normalized contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-mcp-contract-format.yml
          git add contracts/mcp-tools.json
          git diff --cached --check
          git commit -m "style(mcp): normalize identity contract formatting"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
