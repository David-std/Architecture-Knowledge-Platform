name: p6-hygiene-output

on:
  pull_request:

permissions:
  contents: write

jobs:
  hygiene-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Regenerate canonical hygiene inventory and remove diagnostic
        shell: bash
        run: |
          rm .github/workflows/p6-hygiene-output.yml
          node scripts/validate-repository-hygiene.mjs --write
          node scripts/validate-repository-hygiene.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_CLASSIFICATION.json .github/workflows/p6-hygiene-output.yml
          git commit -m "chore(p6): refresh final hygiene inventory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
