name: agent-ab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  controlled-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_AGENT_AB_TASKS: evals/registered/agent-ab-public-product-tasks.json
      AKP_AGENT_AB_REPORT: reports/ci/agent-ab-benchmark.json
      AKP_AGENT_AB_ENABLE: "1"
      AKP_AGENT_AB_REAL_MODEL: "1"
      AKP_API_URL: http://127.0.0.1:18080
      AKP_API_TOKEN: agent-ab-local-evidence-token-2026
      AKP_API_TOKEN_SCOPES: '{"spaces":[{"spaceId":"00000000-0000-0000-0000-000000000003","pathPrefix":null,"permissions":["knowledge:read","source:read"]}]}'
      AKP_AGENT_AB_SPACE_ID: 00000000-0000-0000-0000-000000000003
      AKP_AGENT_AB_VAULT_IDS: 10000000-0000-4000-8000-000000000001,10000000-0000-4000-8000-000000000002
      AKP_AGENT_AB_PROVIDER_BASE_URL: http://127.0.0.1:18081
      AKP_AGENT_AB_PROVIDER_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_AGENT_AB_TEMPERATURE: "0"
      AKP_AGENT_AB_MAX_OUTPUT_TOKENS: "512"
      AKP_LOCAL_AGENT_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_LOCAL_AGENT_MODEL_REVISION: cc5cc01a65cc3ff17bdb73a7de33d879f62599b0
      AKP_LOCAL_AGENT_DTYPE: q4
      AKP_LOCAL_AGENT_PORT: "18081"
      AKP_CONTEXT_TOKENIZER_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_CONTEXT_TOKENIZER_REVISION: cc5cc01a65cc3ff17bdb73a7de33d879f62599b0
      AKP_CONTEXT_TOKENIZER_REPORT: reports/ci/context-tokenizer-baseline.json
      PORT: "18080"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: docker compose up -d --wait postgres
      - run: pnpm db:migrate
      - name: Provision registered public product corpus and least-privilege token
        shell: bash
        run: |
          mkdir -p reports/ci
          pnpm exec tsx scripts/provision-agent-ab-fixture.ts \
            2>&1 | tee reports/ci/agent-ab-fixture.log
          pnpm auth:provision \
            2>&1 | tee reports/ci/agent-ab-auth.log
      - name: Start isolated AKP API
        shell: bash
        run: |
          pnpm --filter @akp/api dev > reports/ci/agent-ab-api.log 2>&1 &
          echo $! > reports/ci/agent-ab-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/liveness >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat reports/ci/agent-ab-api.log >&2
          exit 1
      - name: Start pinned local real-model provider
        shell: bash
        run: |
          pnpm --filter @akp/retrieval exec tsx scripts/local-agent-provider.ts \
            > reports/ci/local-agent-provider.log 2>&1 &
          echo $! > reports/ci/local-agent-provider.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18081/health \
              > reports/ci/local-agent-provider-health.json; then
              cat reports/ci/local-agent-provider-health.json
              exit 0
            fi
            sleep 5
          done
          cat reports/ci/local-agent-provider.log >&2
          exit 1
      - name: Measure pinned tokenizer against serialized ContextPacket
        shell: bash
        run: |
          set -o pipefail
          pnpm benchmark:context-tokenization \
            2>&1 | tee reports/ci/context-tokenizer-baseline.log
      - name: Execute live controlled Agent A/B comparison
        shell: bash
        run: |
          set +e
          pnpm benchmark:agent-ab > reports/ci/agent-ab.log 2>&1
          status=$?
          cat reports/ci/agent-ab.log
          if [ ! -f reports/ci/agent-ab-benchmark.json ]; then
            echo "Agent A/B harness did not produce its report" >&2
            exit 1
          fi
          exit "$status"
      - name: Validate live evidence claim discipline
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(
            readFileSync("reports/ci/agent-ab-benchmark.json", "utf8"),
          );
          const providerHealth = JSON.parse(
            readFileSync("reports/ci/local-agent-provider-health.json", "utf8"),
          );
          const tokenizerBaseline = JSON.parse(
            readFileSync("reports/ci/context-tokenizer-baseline.json", "utf8"),
          );
          if (report.taskSet?.evidenceLevel !== "REGISTERED_PUBLIC_PRODUCT_CORPUS") {
            throw new Error("Agent A/B must use the registered public product corpus task set.");
          }
          if (report.taskSet?.sourceCorpus !== "architecture-knowledge-platform-public-product-docs") {
            throw new Error("Agent A/B source corpus does not match the registered product corpus.");
          }
          if (report.taskSet?.tasks !== 6) {
            throw new Error(`Expected six controlled Agent A/B tasks, got ${report.taskSet?.tasks}.`);
          }
          if (report.status !== "PROVEN") {
            throw new Error(`Live Agent A/B benchmark status is ${report.status}, expected PROVEN.`);
          }
          if (report.claimPolicy?.realModelRequired !== true || report.execution?.provider?.operatorAssertedRealModel !== true) {
            throw new Error("PROVEN Agent A/B evidence requires an explicitly asserted real model.");
          }
          if (report.execution?.provider?.model !== "onnx-community/Qwen2.5-0.5B-Instruct") {
            throw new Error(`Unexpected live model: ${report.execution?.provider?.model}`);
          }
          if (providerHealth.revision !== "cc5cc01a65cc3ff17bdb73a7de33d879f62599b0" || providerHealth.dtype !== "q4") {
            throw new Error("Local provider did not execute the pinned model revision and dtype.");
          }
          if (tokenizerBaseline.status !== "PROVEN" || tokenizerBaseline.productionDefaultsChanged !== false) {
            throw new Error("P0 tokenizer baseline must be proven without changing production defaults.");
          }
          if (
            tokenizerBaseline.targetModel?.model !== "onnx-community/Qwen2.5-0.5B-Instruct" ||
            tokenizerBaseline.targetModel?.revision !== "cc5cc01a65cc3ff17bdb73a7de33d879f62599b0" ||
            tokenizerBaseline.targetModel?.exact !== true
          ) {
            throw new Error("P0 tokenizer baseline did not use the pinned exact model tokenizer.");
          }
          const tokenizerSamples = Array.isArray(tokenizerBaseline.samples)
            ? tokenizerBaseline.samples
            : [];
          if (tokenizerSamples.length !== 3) {
            throw new Error(`Expected three tokenizer baseline samples, got ${tokenizerSamples.length}.`);
          }
          const languages = new Set(tokenizerSamples.map((item) => item.language));
          for (const requiredLanguage of ["english", "spanish", "code"]) {
            if (!languages.has(requiredLanguage)) {
              throw new Error(`Tokenizer baseline is missing ${requiredLanguage}.`);
            }
          }
          for (const sample of tokenizerSamples) {
            if (sample.tokenizer?.approximate !== false || sample.fallbackTokenizer?.approximate !== true) {
              throw new Error(`Tokenizer baseline ${sample.language} did not preserve EXACT/APPROXIMATE evidence.`);
            }
            if (!Number.isFinite(sample.exactContentTokens) || !Number.isFinite(sample.exactSerializedPacketTokens)) {
              throw new Error(`Tokenizer baseline ${sample.language} lacks exact token measurements.`);
            }
          }
          if (!Array.isArray(tokenizerBaseline.identifiers) || tokenizerBaseline.identifiers.length === 0) {
            throw new Error("Tokenizer baseline must measure exact code identifiers.");
          }
          if (report.winner !== null || report.claimPolicy?.superiorityClaimAllowed !== false) {
            throw new Error("The harness must report measurements without manufacturing a superiority claim.");
          }
          const observations = Array.isArray(report.observations) ? report.observations : [];
          if (observations.length !== 12) {
            throw new Error(`Expected 12 arm observations, got ${observations.length}.`);
          }
          const arms = new Set(observations.map((item) => item.arm));
          if (!arms.has("A_RAW_SEARCH") || !arms.has("B_AKP_CONTEXT_PACKET")) {
            throw new Error("Both controlled comparison arms must be present.");
          }
          for (const observation of observations) {
            if (!Number.isFinite(observation.contextTokens) || !Number.isFinite(observation.latencyMs)) {
              throw new Error(`Observation ${observation.taskId}/${observation.arm} lacks token or latency evidence.`);
            }
            if (!Number.isFinite(observation.correctness) || !Number.isFinite(observation.unsupportedClaimRate)) {
              throw new Error(`Observation ${observation.taskId}/${observation.arm} lacks quality evidence.`);
            }
          }
          console.log(JSON.stringify({
            status: report.status,
            model: report.execution.provider.model,
            modelRevision: providerHealth.revision,
            dtype: providerHealth.dtype,
            tokenizerBaseline: {
              model: tokenizerBaseline.targetModel.model,
              revision: tokenizerBaseline.targetModel.revision,
              samples: tokenizerSamples,
              identifiers: tokenizerBaseline.identifiers,
            },
            observations: observations.length,
            aggregates: report.aggregates,
          }, null, 2));
          NODE
      - name: Capture Agent A/B diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          docker compose ps --all > reports/ci/agent-ab-docker-compose-ps.txt 2>&1
          docker compose logs --no-color --timestamps postgres \
            > reports/ci/agent-ab-postgres.log 2>&1
          if [ -f reports/ci/agent-ab-api.log ]; then tail -n 300 reports/ci/agent-ab-api.log > reports/ci/agent-ab-api-tail.log; fi
          if [ -f reports/ci/local-agent-provider.log ]; then tail -n 300 reports/ci/local-agent-provider.log > reports/ci/local-agent-provider-tail.log; fi
      - name: Upload Agent A/B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-ab-${{ github.run_id }}
          path: reports/ci
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable Agent A/B services
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f reports/ci/agent-ab-api.pid ]; then kill "$(cat reports/ci/agent-ab-api.pid)" 2>/dev/null; fi
          if [ -f reports/ci/local-agent-provider.pid ]; then kill "$(cat reports/ci/local-agent-provider.pid)" 2>/dev/null; fi
          docker compose down -v --remove-orphans
