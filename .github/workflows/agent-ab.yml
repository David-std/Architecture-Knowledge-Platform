name: agent-ab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: comparison
            shard: 0
            shard_count: 3
          - kind: comparison
            shard: 1
            shard_count: 3
          - kind: comparison
            shard: 2
            shard_count: 3
          - kind: ergonomics
            shard: 0
            shard_count: 6
          - kind: ergonomics
            shard: 1
            shard_count: 6
          - kind: ergonomics
            shard: 2
            shard_count: 6
          - kind: ergonomics
            shard: 3
            shard_count: 6
          - kind: ergonomics
            shard: 4
            shard_count: 6
          - kind: ergonomics
            shard: 5
            shard_count: 6
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_AGENT_AB_TASKS: evals/registered/agent-ab-public-product-tasks.json
      AKP_TOOL_ERGONOMICS_TASKS: evals/registered/agent-ab-public-product-tasks.json
      AKP_AGENT_AB_ENABLE: "1"
      AKP_AGENT_AB_REAL_MODEL: "1"
      AKP_API_URL: http://127.0.0.1:18080
      AKP_API_TOKEN: agent-ab-local-evidence-token-2026
      AKP_API_TOKEN_SCOPES: '{"spaces":[{"spaceId":"00000000-0000-0000-0000-000000000003","pathPrefix":null,"permissions":["knowledge:read","source:read"]}]}'
      AKP_AGENT_AB_SPACE_ID: 00000000-0000-0000-0000-000000000003
      AKP_AGENT_AB_VAULT_IDS: 10000000-0000-4000-8000-000000000001,10000000-0000-4000-8000-000000000002
      AKP_AGENT_AB_PROVIDER_BASE_URL: http://127.0.0.1:18081
      AKP_AGENT_AB_PROVIDER_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_AGENT_AB_TEMPERATURE: "0"
      AKP_AGENT_AB_MAX_OUTPUT_TOKENS: "96"
      AKP_AGENT_AB_PROVIDER_TIMEOUT_MS: "120000"
      AKP_LOCAL_AGENT_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_LOCAL_AGENT_MODEL_REVISION: cc5cc01a65cc3ff17bdb73a7de33d879f62599b0
      AKP_LOCAL_AGENT_DTYPE: q4
      AKP_LOCAL_AGENT_PORT: "18081"
      AKP_CONTEXT_TOKENIZER_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_CONTEXT_TOKENIZER_REVISION: cc5cc01a65cc3ff17bdb73a7de33d879f62599b0
      PORT: "18080"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Prepare shard evidence directory
        run: mkdir -p reports/ci
      - name: Start Postgres with bounded registry retry
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if docker compose up -d --wait postgres \
              2>&1 | tee -a "reports/ci/postgres-${{ matrix.kind }}-${{ matrix.shard }}.log"; then
              exit 0
            fi
            echo "Postgres startup attempt ${attempt}/3 failed" \
              | tee -a "reports/ci/postgres-${{ matrix.kind }}-${{ matrix.shard }}.log"
            docker compose down --remove-orphans >/dev/null 2>&1 || true
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          exit 1
      - run: pnpm db:migrate
      - name: Provision registered public product corpus and least-privilege token
        shell: bash
        run: |
          pnpm exec tsx scripts/provision-agent-ab-fixture.ts \
            > "reports/ci/fixture-${{ matrix.kind }}-${{ matrix.shard }}.log" 2>&1
          pnpm auth:provision \
            > "reports/ci/auth-${{ matrix.kind }}-${{ matrix.shard }}.log" 2>&1
      - name: Start isolated AKP API
        shell: bash
        run: |
          pnpm --filter @akp/api dev \
            > "reports/ci/api-${{ matrix.kind }}-${{ matrix.shard }}.log" 2>&1 &
          echo $! > /tmp/agent-ab-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/liveness >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "reports/ci/api-${{ matrix.kind }}-${{ matrix.shard }}.log" >&2
          exit 1
      - name: Start pinned local real-model provider
        shell: bash
        run: |
          pnpm --filter @akp/retrieval exec tsx scripts/local-agent-provider.ts \
            > "reports/ci/provider-${{ matrix.kind }}-${{ matrix.shard }}.log" 2>&1 &
          echo $! > /tmp/local-agent-provider.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18081/health \
              > "reports/ci/provider-health-${{ matrix.kind }}-${{ matrix.shard }}.json"; then
              cat "reports/ci/provider-health-${{ matrix.kind }}-${{ matrix.shard }}.json"
              exit 0
            fi
            sleep 5
          done
          cat "reports/ci/provider-${{ matrix.kind }}-${{ matrix.shard }}.log" >&2
          exit 1
      - name: Measure pinned tokenizer against serialized ContextPacket
        if: matrix.kind == 'comparison' && matrix.shard == 0
        env:
          AKP_CONTEXT_TOKENIZER_REPORT: reports/ci/context-tokenizer-baseline.json
        shell: bash
        run: |
          set -o pipefail
          pnpm benchmark:context-tokenization \
            2>&1 | tee reports/ci/context-tokenizer-baseline.log
      - name: Execute real-model benchmark shard
        shell: bash
        run: |
          set +e
          if [ "${{ matrix.kind }}" = "comparison" ]; then
            export AKP_AGENT_AB_SHARD_INDEX="${{ matrix.shard }}"
            export AKP_AGENT_AB_SHARD_COUNT="${{ matrix.shard_count }}"
            export AKP_AGENT_AB_REPORT="reports/ci/agent-ab-shard-${{ matrix.shard }}.json"
            pnpm benchmark:agent-ab \
              > "reports/ci/comparison-${{ matrix.shard }}.log" 2>&1
            status=$?
            cat "reports/ci/comparison-${{ matrix.shard }}.log"
            test -f "reports/ci/agent-ab-shard-${{ matrix.shard }}.json" || exit 1
          else
            export AKP_TOOL_ERGONOMICS_SHARD_INDEX="${{ matrix.shard }}"
            export AKP_TOOL_ERGONOMICS_SHARD_COUNT="${{ matrix.shard_count }}"
            export AKP_TOOL_ERGONOMICS_REPORT="reports/ci/agent-context-shard-${{ matrix.shard }}.json"
            pnpm benchmark:agent-context-ergonomics \
              > "reports/ci/ergonomics-${{ matrix.shard }}.log" 2>&1
            status=$?
            cat "reports/ci/ergonomics-${{ matrix.shard }}.log"
            test -f "reports/ci/agent-context-shard-${{ matrix.shard }}.json" || exit 1
          fi
          exit "${status}"
      - name: Capture shard diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          docker compose ps --all \
            > "reports/ci/docker-compose-${{ matrix.kind }}-${{ matrix.shard }}.txt" 2>&1
          docker compose logs --no-color --timestamps postgres \
            > "reports/ci/postgres-runtime-${{ matrix.kind }}-${{ matrix.shard }}.log" 2>&1
          tail -n 300 "reports/ci/api-${{ matrix.kind }}-${{ matrix.shard }}.log" \
            > "reports/ci/api-tail-${{ matrix.kind }}-${{ matrix.shard }}.log" 2>/dev/null || true
          tail -n 300 "reports/ci/provider-${{ matrix.kind }}-${{ matrix.shard }}.log" \
            > "reports/ci/provider-tail-${{ matrix.kind }}-${{ matrix.shard }}.log" 2>/dev/null || true
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-evidence-${{ github.run_id }}-${{ matrix.kind }}-${{ matrix.shard }}
          path: reports/ci
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable shard services
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/agent-ab-api.pid ]; then kill "$(cat /tmp/agent-ab-api.pid)" 2>/dev/null; fi
          if [ -f /tmp/local-agent-provider.pid ]; then kill "$(cat /tmp/local-agent-provider.pid)" 2>/dev/null; fi
          docker compose down -v --remove-orphans

  aggregate-evidence:
    needs: benchmark-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AKP_AGENT_AB_TASKS: evals/registered/agent-ab-public-product-tasks.json
      AKP_AGENT_AB_REPORT: reports/ci/agent-ab-benchmark.json
      AKP_TOOL_ERGONOMICS_REPORT: reports/ci/agent-context-ergonomics.json
      AKP_AGENT_PROVIDER_HEALTH_REPORT: reports/ci/local-agent-provider-health.json
      AKP_CONTEXT_TOKENIZER_REPORT: reports/ci/context-tokenizer-baseline.json
      AKP_AGENT_SHARD_DIR: reports/ci/shards
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Download all shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: agent-evidence-${{ github.run_id }}-*
          path: reports/ci/shards
          merge-multiple: true
      - name: Aggregate complete benchmark evidence
        run: pnpm benchmark:agent-shards:aggregate
      - name: Validate complete Agent A/B evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(
            readFileSync("reports/ci/agent-ab-benchmark.json", "utf8"),
          );
          const providerHealth = JSON.parse(
            readFileSync("reports/ci/local-agent-provider-health.json", "utf8"),
          );
          const tokenizerBaseline = JSON.parse(
            readFileSync("reports/ci/context-tokenizer-baseline.json", "utf8"),
          );
          if (report.status !== "PROVEN" || report.taskSet?.tasks !== 6) {
            throw new Error("Aggregated Agent A/B evidence is incomplete.");
          }
          if (report.observations?.length !== 12) {
            throw new Error("Expected exactly 12 aggregated Agent A/B observations.");
          }
          if (
            report.execution?.provider?.model !==
              "onnx-community/Qwen2.5-0.5B-Instruct" ||
            providerHealth.revision !==
              "cc5cc01a65cc3ff17bdb73a7de33d879f62599b0" ||
            providerHealth.dtype !== "q4"
          ) {
            throw new Error("Aggregated Agent A/B evidence did not use the pinned real model.");
          }
          if (
            tokenizerBaseline.status !== "PROVEN" ||
            tokenizerBaseline.targetModel?.model !==
              "onnx-community/Qwen2.5-0.5B-Instruct" ||
            tokenizerBaseline.targetModel?.revision !==
              "cc5cc01a65cc3ff17bdb73a7de33d879f62599b0" ||
            tokenizerBaseline.targetModel?.exact !== true
          ) {
            throw new Error("Tokenizer baseline is not exact/pinned.");
          }
          if (report.winner !== null || report.claimPolicy?.superiorityClaimAllowed !== false) {
            throw new Error("Agent A/B must not manufacture a winning arm.");
          }
          const noiseProbes = report.observations.filter(
            (item) =>
              item.arm === "B_AKP_CONTEXT_PACKET" &&
              item.retrievalMetadata?.noiseProbe,
          );
          if (noiseProbes.length !== 3) {
            throw new Error("Expected exactly three controlled noise probes.");
          }
          const aggregates = Array.isArray(report.aggregates) ? report.aggregates : [];
          if (aggregates.length !== 2) {
            throw new Error("Agent A/B aggregate must contain two arms.");
          }
          for (const aggregate of aggregates) {
            for (const metric of [
              "retrievalRecallCoverage",
              "contextPrecisionCoverage",
              "claimSupportRecallCoverage",
              "contextUtilizationCoverage",
            ]) {
              if (!Number.isFinite(aggregate[metric]) || aggregate[metric] < 5 / 6) {
                throw new Error("Agent A/B aggregate lacks " + metric + ".");
              }
            }
            if (!Number.isFinite(aggregate.noAnswerAccuracy) || aggregate.noAnswerCases !== 1) {
              throw new Error("Agent A/B aggregate lacks no-answer evidence.");
            }
            if (!Number.isFinite(aggregate.faithfulnessCoverage) || aggregate.faithfulnessCoverage < 5 / 6) {
              throw new Error("Agent A/B aggregate lacks faithfulness coverage.");
            }
          }
          console.log(
            JSON.stringify(
              {
                status: report.status,
                observations: report.observations.length,
                noiseProbes: noiseProbes.length,
                provider: providerHealth,
                aggregates,
              },
              null,
              2,
            ),
          );
          NODE
      - name: Validate complete agent context ergonomics evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(
            readFileSync("reports/ci/agent-context-ergonomics.json", "utf8"),
          );
          if (
            report.benchmark !== "AGENT_CONTEXT_TOOL_ERGONOMICS" ||
            report.status !== "PROVEN" ||
            report.taskSet?.tasks !== 6
          ) {
            throw new Error("Aggregated agent context ergonomics evidence is incomplete.");
          }
          if (report.observations?.length !== 18 || report.aggregates?.length !== 3) {
            throw new Error("Agent context ergonomics must retain 18 observations and 3 arms.");
          }
          if (
            report.claimPolicy?.realModelRequired !== true ||
            report.claimPolicy?.sameModelSettingsAcrossArms !== true ||
            report.claimPolicy?.superiorityClaimAllowed !== false ||
            report.claimPolicy?.mutationExecutionAllowed !== false
          ) {
            throw new Error("Agent context ergonomics claim policy changed.");
          }
          if (
            typeof report.instructionBundle?.sha256 !== "string" ||
            !/^[a-f0-9]{64}$/.test(report.instructionBundle.sha256)
          ) {
            throw new Error("Agent context ergonomics instruction bundle is not integrity-addressed.");
          }
          if (report.winner !== null) {
            throw new Error("Agent context ergonomics must not manufacture a winner.");
          }
          console.log(
            JSON.stringify(
              {
                status: report.status,
                observations: report.observations.length,
                aggregates: report.aggregates,
              },
              null,
              2,
            ),
          );
          NODE
      - name: Upload canonical Agent A/B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-ab-${{ github.run_id }}
          path: |
            reports/ci/agent-ab-benchmark.json
            reports/ci/agent-context-ergonomics.json
            reports/ci/context-tokenizer-baseline.json
            reports/ci/local-agent-provider-health.json
            reports/ci/shards
          if-no-files-found: warn
          retention-days: 14
