name: final-evidence-repair

on:
  push:
    branches: [work/product-completion-final]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Apply parser and embedding-shape repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/agent-ab-benchmark.ts")
          text = path.read_text()
          old = '''      const separator = value.indexOf(" || ");
                if (separator < 0)
                  throw new Error("Provider CLAIM omitted its citation delimiter.");
                const text = value.slice(0, separator).trim();
                if (!text) throw new Error("Provider CLAIM text was empty.");
                claims.push({
                  text,
                  citations: citationList(value.slice(separator + 4)),
                });'''
          new = '''      const separator = value.indexOf(" || ");
                const text = (separator < 0 ? value : value.slice(0, separator)).trim();
                if (!text) throw new Error("Provider CLAIM text was empty.");
                claims.push({
                  text,
                  citations:
                    separator < 0
                      ? []
                      : citationList(value.slice(separator + 4)),
                });'''
          if text.count(old) != 1:
              raise SystemExit(f"agent parser anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          cat > db/migrations/028_preserve_embedding_shape_errors.sql <<'SQL'
          -- Preserve the domain error for malformed embedding shapes before
          -- PostgreSQL CHECK constraints or dimension-specific vector indexes
          -- can surface storage-level errors. This trigger performs no table
          -- lookup; generation, scope, content, eligibility, and normalization
          -- validation remains set-based in the statement-level validator.
          create or replace function akp_validate_unit_embedding_shape()
          returns trigger
          language plpgsql
          as $function$
          begin
            if new.embedding_dimensions < 1
               or new.embedding_dimensions > 2000
               or vector_dims(new.embedding) is distinct from new.embedding_dimensions then
              raise exception 'EMBEDDING_DIMENSION_MISMATCH';
            end if;
            return new;
          end;
          $function$;

          drop trigger if exists unit_embeddings_validate_shape on unit_embeddings;
          create trigger unit_embeddings_validate_shape
            before insert or update on unit_embeddings
            for each row execute function akp_validate_unit_embedding_shape();
          SQL

          pnpm exec prettier --write scripts/agent-ab-benchmark.ts
          git add -N db/migrations/028_preserve_embedding_shape_errors.sql
          git diff --check
          printf '%s\n' \
            db/migrations/028_preserve_embedding_shape_errors.sql \
            scripts/agent-ab-benchmark.ts | sort > /tmp/expected
          git diff --name-only | sort > /tmp/changed
          diff -u /tmp/expected /tmp/changed

      - name: Validate repository
        run: pnpm check

      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Validate embedding domain semantics
        run: >-
          pnpm --filter @akp/indexing exec vitest run
          test/embedding-generation.integration.test.ts
          test/embedding-stale-generation.integration.test.ts
          test/incremental-index.integration.test.ts

      - name: Validate 100K scale path
        shell: bash
        run: |
          pnpm benchmark:scale -- \
            --targets 100000 \
            --iterations 1 \
            --output /tmp/scale-100000.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/scale-100000.json', 'utf8'));
          const row = report.results?.[0];
          if (report.status !== 'PASSED') throw new Error(`scale status=${report.status}`);
          if (!report.cleanup?.succeeded) throw new Error('scale cleanup failed');
          if (row?.rows?.documents !== 100000 || row?.rows?.units !== 100000 || row?.rows?.embeddings !== 100000 || row?.rows?.relations !== 99999) {
            throw new Error(`unexpected 100K cardinality: ${JSON.stringify(row?.rows)}`);
          }
          if (row?.contextPacket?.candidateCount !== 20) throw new Error(`unexpected packet candidate count=${row?.contextPacket?.candidateCount}`);
          console.log(JSON.stringify({status: report.status, rows: row.rows, packetCandidates: row.contextPacket.candidateCount, cleanup: report.cleanup.succeeded}));
          NODE

      - name: Commit validated repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/migrations/028_preserve_embedding_shape_errors.sql scripts/agent-ab-benchmark.ts
          git diff --cached --check
          git commit -m 'fix(evidence): preserve embedding and agent claim semantics'
          git push origin HEAD:work/product-completion-final

      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
