name: p1-source-summary-provenance-fix

on:
  push:
    branches: [feat/v0.4-enterprise-context-workspace]
    paths: [.github/workflows/p1-source-summary-provenance-fix.yml]

permissions:
  contents: write

env:
  DATABASE_URL: postgres://akp:akp@localhost:55432/akp
  AKP_INGEST_ROOTS: ${{ github.workspace }}/test/fixtures
  AKP_PROJECT_ROOTS: ${{ github.workspace }}
  AKP_MANAGED_REPO: /tmp/akp-managed-knowledge
  AKP_EXTRACTOR_TOKEN: akp-ci-extractor-token-not-for-production
  AKP_RAW_SECRET_KEY: akp-ci-minio-secret-not-for-production

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply provenance-scoped compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path("apps/api/src/review-policy.ts")
          text = policy.read_text()
          function_start = text.index("export async function resolveProposalReviewPolicy(")
          block_start = text.index('  if (binding.source === "LEGACY_UNBOUND") {', function_start)
          block_end = text.index("  const revision = binding.revision;", block_start)
          replacement = '''  if (binding.source === "LEGACY_UNBOUND") {
            const context = defaultCompilerKnowledgeProfileContext();
            return {
              policy: effectiveReviewPolicyForKinds(context, kinds),
              pinned: true,
            };
          }
'''
          text = text[:block_start] + replacement + text[block_end:]
          policy.write_text(text)

          routes = Path("apps/api/src/routes/reviews.ts")
          text = routes.read_text()
          import_old = '''  resolveProposalReviewPolicy,
            reviewApprovalStatus,
          } from "../review-policy.js";'''
          if import_old not in text:
              import_old = '''  resolveProposalReviewPolicy,
  reviewApprovalStatus,
} from "../review-policy.js";'''
          import_new = '''  resolveProposalReviewPolicy,
  reviewApprovalStatus,
  reviewPolicyState,
} from "../review-policy.js";'''
          if import_old not in text:
              raise SystemExit("review-policy import anchor not found")
          text = text.replace(import_old, import_new, 1)

          helper_anchor = "async function recordPublicationFailure("
          helper_pos = text.index(helper_anchor)
          helper = '''/** `source-summary` is a v0.3 ingest/compiler provenance draft, not a
 * KnowledgeProfile kind. Only an already-persisted worker review whose
 * manifest points back to its durable ingest job may retain that legacy
 * shape while being revised. Direct proposals never reach this boundary. */
async function isLegacyWorkerSourceSummaryReview(
  db: Postgres,
  review: Record<string, unknown>,
  kinds: readonly string[],
): Promise<boolean> {
  if (
    kinds.length !== 1 ||
    kinds[0] !== "source-summary" ||
    reviewPolicyState(review).pinned
  ) {
    return false;
  }
  const manifest = (review.impact_manifest ?? {}) as Record<string, unknown>;
  const jobId = typeof manifest.jobId === "string" ? manifest.jobId : "";
  const spaceId = String(review.space_id ?? "");
  const vaultId = String(review.vault_id ?? "");
  const authorId = typeof review.author_id === "string" ? review.author_id : null;
  if (!jobId || !spaceId || !vaultId) return false;
  const source = await db.pool.query(
    `select 1
       from ingest_jobs
      where id::text=$1 and space_id=$2 and vault_id=$3
        and created_by is not distinct from $4::uuid
      limit 1`,
    [jobId, spaceId, vaultId, authorId],
  );
  return Boolean(source.rowCount);
}

'''
          text = text[:helper_pos] + helper + text[helper_pos:]

          revise_start = text.index("const revisedReviewKinds =")
          catch_start = text.index("      } catch (error) {", revise_start)
          catch_end = text.index(
              "      const previousManifest = (review.impact_manifest ?? {}) as Record<",
              catch_start,
          )
          new_catch = '''      } catch (error) {
        const code = error instanceof Error ? error.message : String(error);
        if (
          code === "COMPILER_PROFILE_KIND_NOT_DECLARED:source-summary" &&
          (await isLegacyWorkerSourceSummaryReview(
            db,
            review,
            revisedReviewKinds as string[],
          ))
        ) {
          const legacyState = reviewPolicyState(review);
          revisedReviewPolicy = {
            policy: legacyState.policy,
            pinned: false,
          };
        } else if (code.startsWith("COMPILER_PROFILE_KIND_NOT_DECLARED:")) {
          return reply.code(422).send({
            code: "KNOWLEDGE_PROFILE_KIND_NOT_ALLOWED",
            kind: code.split(":")[1] ?? "",
          });
        } else if (code === "COMPILER_REVIEW_POLICY_ROLE_CONFLICT") {
          return reply
            .code(422)
            .send({ code: "KNOWLEDGE_PROFILE_REVIEW_POLICY_CONFLICT" });
        } else if (code === "ACTIVE_KNOWLEDGE_PROFILE_BINDING_INVALID") {
          return reply.code(409).send({ code });
        } else {
          throw error;
        }
      }

'''
          text = text[:catch_start] + new_catch + text[catch_end:]
          routes.write_text(text)

          test = Path("apps/api/test/review-policy.integration.test.ts")
          text = test.read_text()
          test_anchor = '  it("rebinds an explicit revision to the current profile policy snapshot", async () => {'
          new_test = '''  it("rejects source-summary as a direct semantic proposal under the v0.3 default profile", async () => {
    await db.pool.query(
      "update vaults set active_knowledge_profile_revision_id=null where id=$1 and space_id=$2",
      [vaultId, spaceId],
    );
    await db.pool.query(
      `update knowledge_profile_revisions
          set status='SUPERSEDED',superseded_at=now(),updated_at=now()
        where vault_id=$1 and status='ACTIVE'`,
      [vaultId],
    );

    const proposed = await propose("source-summary");
    expect(proposed.statusCode).toBe(422);
    expect(proposed.json()).toMatchObject({
      code: "KNOWLEDGE_PROFILE_KIND_NOT_ALLOWED",
      kind: "source-summary",
    });

    await activateProfile("1.0.3-source-summary-guard");
  });

  it("rebinds an explicit revision to the current profile policy snapshot", async () => {'''
          if test_anchor not in text:
              raise SystemExit("review-policy integration insertion anchor not found")
          test.write_text(text.replace(test_anchor, new_test, 1))
          PY
          pnpm exec prettier --write \
            apps/api/src/review-policy.ts \
            apps/api/src/routes/reviews.ts \
            apps/api/test/review-policy.integration.test.ts
      - run: pnpm check
      - run: docker compose up -d --wait postgres minio extractor
      - run: |
          git init -b main "$AKP_MANAGED_REPO"
          git -C "$AKP_MANAGED_REPO" config user.name "AKP CI"
          git -C "$AKP_MANAGED_REPO" config user.email "akp-ci@localhost"
          git -C "$AKP_MANAGED_REPO" commit --allow-empty -m "chore: initialize managed knowledge for CI"
      - run: pnpm db:migrate
      - name: Run review-policy integration
        run: pnpm --filter @akp/api exec vitest run --config vitest.integration.config.ts test/review-policy.integration.test.ts
      - name: Run product lifecycle regression
        run: pnpm --filter @akp/api exec vitest run --config vitest.integration.config.ts test/product-lifecycle.integration.test.ts
      - name: Publish validated fix and remove staging workflow
        shell: bash
        run: |
          git fetch origin feat/v0.4-enterprise-context-workspace
          test "$(git rev-parse origin/feat/v0.4-enterprise-context-workspace)" = "$GITHUB_SHA"
          git config user.name "AKP CI"
          git config user.email "akp-ci@localhost"
          git rm .github/workflows/p1-source-summary-provenance-fix.yml
          git add \
            apps/api/src/review-policy.ts \
            apps/api/src/routes/reviews.ts \
            apps/api/test/review-policy.integration.test.ts
          git diff --cached --check
          git commit -m "fix(p1): scope source-summary compatibility to ingest reviews"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
