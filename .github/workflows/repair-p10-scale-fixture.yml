name: repair-p10-scale-fixture

on:
  push:
    branches:
      - work/product-completion-final

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Replace synthetic embedding lookup with scoped missing-unit batches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/load-scale-benchmark.ts')
          text = path.read_text()
          old = '''async function insertEmbeddings(
            fixture: FixtureIds,
            start: number,
            end: number,
          ): Promise<number> {
            if (start > end) return 0;
            const batchSize = 10_000;
            let elapsedMs = 0;
            for (let batchStart = start; batchStart <= end; batchStart += batchSize) {
              const batchEnd = Math.min(end, batchStart + batchSize - 1);
              const measured = await timedQuery(
                `insert into unit_embeddings(unit_id,generation_id,content_hash,embedding)
                 select
                   u.id,$4,
                   u.content_hash,
                   $7::vector(64)
                   from generate_series($5::int,$6::int) as generated(i)
                   join knowledge_documents d
                     on d.space_id=$1 and d.vault_id=$2 and d.external_id=$3 || i::text
                   join knowledge_units u
                     on u.document_id=d.id and u.space_id=$1 and u.vault_id=$2
                  on conflict (unit_id,generation_id) do nothing`,
                [
                  fixture.spaceId,
                  fixture.vaultId,
                  fixture.externalPrefix,
                  fixture.embeddingGenerationId,
                  batchStart,
                  batchEnd,
                  `[${Array.from({ length: 64 }, () => "0.01").join(",")}]`,
                ],
              );
              elapsedMs += measured.elapsedMs;
            }
            return elapsedMs;
          }
          '''
          new = '''async function insertEmbeddings(
            fixture: FixtureIds,
            start: number,
            end: number,
          ): Promise<number> {
            if (start > end) return 0;
            const batchSize = 10_000;
            const expected = end - start + 1;
            const vector = `[${Array.from({ length: 64 }, () => "0.01").join(",")}]`;
            let inserted = 0;
            let elapsedMs = 0;
            while (inserted < expected) {
              const measured = await timedQuery<{ unit_id: string }>(
                `with candidates as (
                   select u.id,u.content_hash
                     from knowledge_units u
                    where u.space_id=$1 and u.vault_id=$2
                      and u.corpus_revision='synthetic-v1'
                      and u.embedding_eligible=true
                      and not exists (
                        select 1 from unit_embeddings e
                         where e.unit_id=u.id and e.generation_id=$3
                      )
                    order by u.id
                    limit $4
                 )
                 insert into unit_embeddings(unit_id,generation_id,content_hash,embedding)
                 select c.id,$3,c.content_hash,$5::vector(64)
                   from candidates c
                  on conflict (unit_id,generation_id) do nothing
                 returning unit_id`,
                [
                  fixture.spaceId,
                  fixture.vaultId,
                  fixture.embeddingGenerationId,
                  batchSize,
                  vector,
                ],
              );
              elapsedMs += measured.elapsedMs;
              const batchInserted = measured.result.rowCount ?? 0;
              if (batchInserted === 0) break;
              inserted += batchInserted;
            }
            if (inserted !== expected) {
              throw new Error(
                `synthetic embedding batch cardinality mismatch: expected ${expected}, inserted ${inserted}`,
              );
            }
            return elapsedMs;
          }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'insertEmbeddings exact replacement count={count}')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write scripts/load-scale-benchmark.ts
          git diff --check
          test "$(git diff --name-only)" = "scripts/load-scale-benchmark.ts"
      - name: Validate repository
        run: pnpm check
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://akp:akp@localhost:55432/akp
        run: pnpm db:migrate
      - name: Preflight Scale 100K
        shell: bash
        env:
          DATABASE_URL: postgresql://akp:akp@localhost:55432/akp
        run: |
          set +e
          pnpm benchmark:scale -- --output reports/preflight-scale-100000.json --targets 100000 --iterations 1
          code=$?
          cat reports/preflight-scale-100000.json
          set -e
          test "$code" -eq 0
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('reports/preflight-scale-100000.json', 'utf8'));
          if (report.status !== 'PASSED' || report.cleanup?.succeeded !== true || report.results?.[0]?.targetDocuments !== 100000 || report.results?.[0]?.rows?.embeddings !== 100000) {
            throw new Error(`Scale 100K preflight failed: ${JSON.stringify({status: report.status, cleanup: report.cleanup, failure: report.failure, rows: report.results?.[0]?.rows})}`);
          }
          NODE
      - name: Commit validated harness fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/load-scale-benchmark.ts
          git commit -m "perf(p10): batch scale embeddings by scoped units"
          git push origin HEAD:work/product-completion-final
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
