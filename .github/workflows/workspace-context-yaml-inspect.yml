name: workspace-context-yaml-inspect

on:
  push:
    branches: [feat/v0.4-enterprise-context-workspace]
    paths:
      - .github/workflows/workspace-context-yaml-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
      - name: Validate temporary workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/workspace-context-materializer-inspect.yml
