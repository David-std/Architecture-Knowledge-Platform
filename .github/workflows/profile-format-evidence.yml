name: profile-format-evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/profile-format-evidence.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply repository Prettier
        run: >-
          pnpm exec prettier --write
          packages/compiler/src/knowledge-profile.ts
          apps/worker/test/knowledge-profile-compilation.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: profile-format-evidence-${{ github.run_id }}
          path: |
            packages/compiler/src/knowledge-profile.ts
            apps/worker/test/knowledge-profile-compilation.test.ts
          if-no-files-found: error
