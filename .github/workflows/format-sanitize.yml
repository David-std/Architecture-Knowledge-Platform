name: one-shot-format-sanitize

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format touched P2 files and remove this helper
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/context-fabric.ts \
            apps/api/test/context-fabric-session-isolation.integration.test.ts \
            apps/api/test/workspace-coordination.integration.test.ts
          git rm .github/workflows/format-sanitize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/routes/context-fabric.ts \
            apps/api/test/context-fabric-session-isolation.integration.test.ts \
            apps/api/test/workspace-coordination.integration.test.ts
          git commit -m "style(context-fabric): apply repository formatter"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
