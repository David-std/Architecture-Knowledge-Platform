name: P1 profile governance surfaces materializer

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - scripts/tmp-profile-governance-surfaces.py
      - .github/workflows/profile-governance-surfaces.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Materialize profile governance surfaces
        run: python scripts/tmp-profile-governance-surfaces.py

      - name: Format candidate
        run: >-
          pnpm exec prettier --write
          apps/api/src/routes/profile-governance.ts
          apps/api/src/server.ts
          apps/api/test/profile-governance.integration.test.ts
          apps/cli/src/main.ts
          apps/web/app/admin/profiles/page.tsx
          apps/web/app/layout.tsx
          apps/web/ROUTES.md

      - name: Build workspace packages
        run: pnpm build

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run profile governance integration
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/profile-governance.integration.test.ts
          test/profile-activation.integration.test.ts

      - name: Run CLI profile surface smoke
        run: pnpm --filter @akp/cli exec tsx src/main.ts profile --help

      - name: Run workspace check
        run: pnpm check

      - name: Promote clean product commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/routes/profile-governance.ts \
            apps/api/src/server.ts \
            apps/api/test/profile-governance.integration.test.ts \
            apps/cli/src/main.ts \
            apps/web/app/admin/profiles/page.tsx \
            apps/web/app/layout.tsx \
            apps/web/ROUTES.md
          git rm -f \
            .github/workflows/profile-governance-surfaces.yml \
            scripts/tmp-profile-governance-surfaces.py
          git diff --cached --check
          git commit -m "feat(p1): expose profile governance surfaces"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace

      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans || true
