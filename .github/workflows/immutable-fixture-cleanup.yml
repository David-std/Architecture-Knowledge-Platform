name: one-shot-immutable-provenance-fixture-cleanup

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - name: Preserve durable integration provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected fixture block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "apps/api/test/offline-snapshot.integration.test.ts",
              '    await db.pool.query("delete from users where id=$1", [actorId]);\n',
              "",
          )
          replace(
              "apps/api/test/workspace-coordination.integration.test.ts",
              '''    await db.pool.query("delete from users where id=any($1::uuid[])", [\n      [actorAId, actorBId, outsiderId],\n    ]);\n''',
              "",
          )
          replace(
              "apps/api/test/security.integration.test.ts",
              '''      await db.pool.query(\n        "delete from idempotency_records where idempotency_key=$1",\n        [key],\n      );\n      await db.pool.query("delete from vaults where id=$1", [vaultId]);\n''',
              '''      await db.pool.query(\n        "delete from idempotency_records where idempotency_key=$1",\n        [key],\n      );\n      await db.pool.query("update vaults set enabled=false where id=$1", [\n        vaultId,\n      ]);\n''',
          )
          PY
          git diff --check
          git rm .github/workflows/immutable-fixture-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/test/offline-snapshot.integration.test.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            apps/api/test/security.integration.test.ts
          git commit -m "test(integration): preserve durable provenance fixtures"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
