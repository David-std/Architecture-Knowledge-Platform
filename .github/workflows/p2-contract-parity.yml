name: p2-contract-parity

on:
  push:
    branches:
      - batch/p2-durable-fabric-events-20260916

permissions:
  contents: write

jobs:
  contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Align TypeScript and AsyncAPI P2 event contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p2 = '''  "WorkspaceSessionCreated",\n  "WorkspaceClaimUpdated",\n  "WorkspaceHandoffCreated",\n  "WorkspacePromotionRequested",\n  "ExternalObjectRefUpserted",\n  "OfflineDraftQueued",\n  "OfflineDraftReconciled",\n  "ContextFabricPeerRegistered",\n'''
          contracts = Path('packages/contracts/src/index.ts')
          text = contracts.read_text()
          old = '''  "ContextPackInvalidationRequested",\n  "ImpactedEvalRunRequested",\n]);'''
          new = '''  "ContextPackInvalidationRequested",\n  "ImpactedEvalRunRequested",\n''' + p2 + ''']);'''
          if old not in text:
              raise SystemExit('TypeScript integration-event enum target not found')
          contracts.write_text(text.replace(old, new, 1))

          asyncapi = Path('contracts/asyncapi.yaml')
          text = asyncapi.read_text()
          old = '''            - ContextPackInvalidationRequested\n            - ImpactedEvalRunRequested\n        eventVersion:'''
          new = '''            - ContextPackInvalidationRequested\n            - ImpactedEvalRunRequested\n            - WorkspaceSessionCreated\n            - WorkspaceClaimUpdated\n            - WorkspaceHandoffCreated\n            - WorkspacePromotionRequested\n            - ExternalObjectRefUpserted\n            - OfflineDraftQueued\n            - OfflineDraftReconciled\n            - ContextFabricPeerRegistered\n        eventVersion:'''
          if old not in text:
              raise SystemExit('AsyncAPI integration-event enum target not found')
          text = text.replace(old, new, 1)
          old = '''            - DECISION_CANDIDATE\n            - NOTE\n        payload:'''
          new = '''            - DECISION_CANDIDATE\n            - PROMOTION_REQUESTED\n            - NOTE\n        payload:'''
          if old not in text:
              raise SystemExit('AsyncAPI workspace-event enum target not found')
          asyncapi.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/contracts/src/index.ts contracts/asyncapi.yaml
      - name: Validate contracts
        run: pnpm contracts:validate
      - name: Verify repository formatting
        run: pnpm exec prettier --check .
      - name: Build contract parity slice
        run: pnpm build
      - name: Commit contract parity
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/index.ts contracts/asyncapi.yaml
          git diff --cached --quiet && exit 0
          git commit -m "fix(p2): align durable event contracts"
          git push origin HEAD:batch/p2-durable-fabric-events-20260916
