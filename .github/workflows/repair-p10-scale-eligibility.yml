name: repair-p10-scale-eligibility

on:
  push:
    branches:
      - work/product-completion-final

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
          fetch-depth: 0
      - name: Make synthetic scale units embedding eligible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/load-scale-benchmark.ts')
          text = path.read_text()
          old = "       '{}'::jsonb,jsonb_build_object('path',d.path),null,0,false,false\n       from generate_series($5::int,$6::int) as generated(i)"
          new = "       '{}'::jsonb,jsonb_build_object('path',d.path),null,0,false,true\n       from generate_series($5::int,$6::int) as generated(i)"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one scale eligibility fixture match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "scripts/load-scale-benchmark.ts"
      - name: Commit exact harness repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/load-scale-benchmark.ts
          git commit -m "fix(eval): mark scale fixture units embedding eligible"
          git push origin HEAD:work/product-completion-final
