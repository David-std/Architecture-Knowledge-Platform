name: one-shot-p2-parent-principal-revocation-fix

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Apply parent-principal revocation patch
        run: python scripts/p2-parent-principal-revocation-fix.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format changed TypeScript
        run: pnpm exec prettier --write apps/api/src/auth.ts apps/api/test/principal-auth.integration.test.ts
      - name: Validate static contracts
        run: pnpm check
      - name: Commit fix and consume temporary files
        shell: bash
        run: |
          git rm .github/workflows/p2-parent-principal-revocation-fix.yml
          git rm scripts/p2-parent-principal-revocation-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/auth.ts apps/api/test/principal-auth.integration.test.ts
          git diff --cached --check
          git commit -m "fix(p2): invalidate agents when parent principal is revoked"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
