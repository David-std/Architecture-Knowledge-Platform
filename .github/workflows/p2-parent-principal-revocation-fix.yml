name: one-shot-p2-parent-principal-revocation-fix

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Enforce parent principal revocation and add regression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          auth = Path("apps/api/src/auth.ts")
          text = auth.read_text()
          old = '''      `select p.id,p.kind,p.parent_principal_id,p.session_id,p.vault_id,p.allowed_actions,
              p.policy_revision,p.state
         from principals p
        where p.id=coalesce(
          $1::uuid,
          (select id from principals where kind='HUMAN' and user_id=$2 limit 1)
        )
        limit 1`,
'''
          new = '''      `select p.id,p.kind,p.parent_principal_id,p.session_id,p.vault_id,p.allowed_actions,
              p.policy_revision,p.state,parent.state parent_state
         from principals p
         left join principals parent on parent.id=p.parent_principal_id
        where p.id=coalesce(
          $1::uuid,
          (select id from principals where kind='HUMAN' and user_id=$2 limit 1)
        )
        limit 1`,
'''
          if old not in text:
              raise SystemExit("principal lookup anchor not found")
          text = text.replace(old, new, 1)
          old = '''    if (!principal || principal.state !== "ACTIVE") {
      await reply.code(401).send({ code: "INVALID_TOKEN" });
      return;
    }
'''
          new = '''    // Derived principals never outlive their authority root. Checking only the
    // child state would let an issued AGENT_PROCESS continue after its parent
    // human principal was revoked. Fail closed as an invalid credential when
    // the recorded parent is missing or no longer active.
    if (
      !principal ||
      principal.state !== "ACTIVE" ||
      (principal.parent_principal_id && principal.parent_state !== "ACTIVE")
    ) {
      await reply.code(401).send({ code: "INVALID_TOKEN" });
      return;
    }
'''
          if old not in text:
              raise SystemExit("principal state anchor not found")
          auth.write_text(text.replace(old, new, 1))

          test = Path("apps/api/test/principal-auth.integration.test.ts")
          text = test.read_text()
          anchor = '''    expect(afterRevocation.statusCode).toBe(401);
    expect(afterRevocation.json()).toMatchObject({ code: "INVALID_TOKEN" });
'''
          addition = '''    expect(afterRevocation.statusCode).toBe(401);
    expect(afterRevocation.json()).toMatchObject({ code: "INVALID_TOKEN" });

    const siblingIssued = await app.inject({
      method: "POST",
      url: `/v1/sessions/${sessionId}/agent-processes`,
      headers: humanHeaders,
      payload: {
        label: "Parent revocation child",
        allowedActions: ["workspace:read", "knowledge:read"],
      },
    });
    expect(siblingIssued.statusCode).toBe(201);
    const siblingCredential = siblingIssued.json() as {
      token: string;
      principal: { id: string };
    };

    // Revoke only the HUMAN authority root. The child row intentionally remains
    // ACTIVE so this proves authentication follows the parent edge rather than
    // relying on a cascade that may be delayed or absent.
    await db.pool.query(
      `update principals
          set state='REVOKED',revoked_at=now(),policy_revision=policy_revision+1
        where id=$1 and kind='HUMAN'`,
      [humanPrincipal.rows[0]?.id],
    );
    const childState = await db.pool.query<{ state: string }>(
      "select state from principals where id=$1",
      [siblingCredential.principal.id],
    );
    expect(childState.rows[0]?.state).toBe("ACTIVE");

    const afterParentRevocation = await app.inject({
      method: "GET",
      url: `/v1/sessions/${sessionId}/state`,
      headers: { authorization: `Bearer ${siblingCredential.token}` },
    });
    expect(afterParentRevocation.statusCode).toBe(401);
    expect(afterParentRevocation.json()).toMatchObject({
      code: "INVALID_TOKEN",
    });
'''
          if anchor not in text:
              raise SystemExit("principal revocation test anchor not found")
          test.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format changed TypeScript
        run: pnpm exec prettier --write apps/api/src/auth.ts apps/api/test/principal-auth.integration.test.ts
      - name: Validate static contracts
        run: pnpm check
      - name: Commit fix and consume workflow
        shell: bash
        run: |
          git rm .github/workflows/p2-parent-principal-revocation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/auth.ts apps/api/test/principal-auth.integration.test.ts
          git diff --cached --check
          git commit -m "fix(p2): invalidate agents when parent principal is revoked"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
