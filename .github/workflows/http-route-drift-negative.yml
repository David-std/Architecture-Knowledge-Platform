name: HTTP route drift negative proof

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - .github/workflows/http-route-drift-negative.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Prove undeclared Fastify route fails closed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import YAML from "yaml";
          const path = "contracts/openapi.yaml";
          const doc = YAML.parse(fs.readFileSync(path, "utf8"));
          if (!doc.paths?.["/v1/context-fabric/capabilities"]?.get) {
            throw new Error("negative fixture route is not declared");
          }
          delete doc.paths["/v1/context-fabric/capabilities"].get;
          fs.writeFileSync(path, YAML.stringify(doc));
          NODE
          set +e
          pnpm contracts:validate > route-drift-negative.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "undeclared HTTP route GET /v1/context-fabric/capabilities" route-drift-negative.txt
          git checkout -- contracts/openapi.yaml
          pnpm contracts:validate | tee route-drift-positive.txt
      - uses: actions/upload-artifact@v7
        with:
          name: http-route-drift-proof
          path: |
            route-drift-negative.txt
            route-drift-positive.txt
