name: temporary-lockfile-generation

on:
  pull_request:
    paths:
      - package.json
      - packages/project-adapter/package.json
      - packages/vault-importer/package.json
      - scripts/scan-secrets.mjs
      - scripts/validate-docs.mjs
      - packages/project-adapter/src/index.ts
      - packages/vault-importer/src/index.ts
      - .github/workflows/temporary-lockfile-generation.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --strict-peer-dependencies
      - name: Format regenerated files
        run: |
          pnpm exec prettier --write \
            pnpm-lock.yaml \
            package.json \
            packages/project-adapter/package.json \
            packages/vault-importer/package.json \
            scripts/scan-secrets.mjs \
            scripts/validate-docs.mjs \
            packages/project-adapter/src/index.ts \
            packages/vault-importer/src/index.ts
      - run: pnpm audit --audit-level high
      - name: Commit generated and formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json \
            packages/project-adapter/package.json \
            packages/vault-importer/package.json \
            scripts/scan-secrets.mjs scripts/validate-docs.mjs \
            packages/project-adapter/src/index.ts \
            packages/vault-importer/src/index.ts
          git commit -m "chore(security): format native glob migration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
