name: one-shot-p2-claim-release-mcp-parity

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Apply P2 claim release and MCP parity patch
        shell: bash
        run: |
          printf '%s' ' nJycuLnJlcGxhY2UoIic nJyciLCAiJycnIiksCiAgICAnJycgICAgY2FzZSAiQ0xBSU1fQUNRVUlSRUQiOgogICAgY2FzZSAiQ0xBSU1fSEVBUlRCRUFUIjoKICAgIGNhc2UgIkNMQUlNX1JFTEVBU0VEIjoKICAgICAgcmV0dXJuICJXb3Jrc3BhY2VDbGFpbVVwZGF0ZWQiOyc nJycuLnJlcGxhY2UoIic   cnJwp  aW1wb3J0IHsgU2VhcmNoUmVxdWVzdCB9IGZyb20gIkBha3AvY29udHJhY3RzIjsnLnN0cmlwKCksCiAgICAn     ...' | base64 -d > /tmp/p2_patch.py
          python /tmp/p2_patch.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format changed TypeScript
        run: pnpm exec prettier --write packages/postgres/src/workspace-coordination.ts apps/api/src/routes/sessions.ts apps/mcp/src/server.ts apps/api/test/workspace-coordination.integration.test.ts scripts/mcp-smoke.ts
      - name: Validate static contracts
        run: pnpm check
      - name: Commit implementation and consume workflow
        shell: bash
        run: |
          git rm .github/workflows/p2-claim-release-mcp-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/migrations/040_workspace_claim_release.sql packages/postgres/src/workspace-coordination.ts apps/api/src/routes/sessions.ts apps/mcp/src/server.ts apps/api/test/workspace-coordination.integration.test.ts scripts/mcp-smoke.ts
          git diff --cached --check
          git commit -m "feat(p2): add fenced claim release and MCP parity"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
