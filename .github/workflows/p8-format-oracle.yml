name: p8-format-oracle

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Capture canonical P8 test
        run: |
          mkdir -p reports/p8-format
          pnpm exec prettier packages/indexing/test/multivault-isolation.integration.test.ts \
            > reports/p8-format/multivault-isolation.integration.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: p8-format-${{ github.run_id }}
          path: reports/p8-format
          retention-days: 1
