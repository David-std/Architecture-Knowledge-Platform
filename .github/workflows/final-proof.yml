name: final-proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  same-sha-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Collect same-SHA remote workflow proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AKP_FINAL_PROOF_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          AKP_FINAL_PROOF_POLL_MS: "15000"
          AKP_FINAL_PROOF_WAIT_MS: "1800000"
          AKP_FINAL_PROOF_WORKFLOW_REPORT: reports/ci/final-proof-workflows.json
        run: node scripts/final-proof-workflows.mjs
      - name: Build capability evidence ledger
        env:
          AKP_FINAL_PROOF_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          AKP_FINAL_PROOF_WORKFLOW_REPORT: reports/ci/final-proof-workflows.json
          AKP_CAPABILITY_EVIDENCE_LEDGER: reports/ci/final-proof-evidence.json
        run: pnpm proof:evidence
      - name: Generate capability acceptance matrix
        env:
          AKP_CAPABILITY_EVIDENCE_LEDGER: reports/ci/final-proof-evidence.json
          AKP_CAPABILITY_ACCEPTANCE_JSON: reports/ci/capability-acceptance.json
          AKP_CAPABILITY_ACCEPTANCE_MARKDOWN: reports/ci/capability-acceptance.md
        run: pnpm proof:capabilities
      - name: Upload final-proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-proof-${{ github.run_id }}
          path: |
            reports/ci/final-proof-workflows.json
            reports/ci/final-proof-evidence.json
            reports/ci/capability-acceptance.json
            reports/ci/capability-acceptance.md
          if-no-files-found: warn
          retention-days: 30
