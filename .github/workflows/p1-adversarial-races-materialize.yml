name: P1 adversarial profile races materializer

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - scripts/tmp-p1-adversarial-races.py
      - .github/workflows/p1-adversarial-races-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Materialize adversarial race candidate
        run: python scripts/tmp-p1-adversarial-races.py

      - name: Align existing compilation-stage regression with post-provider profile recheck
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/worker/test/compilation-stage.test.ts")
          text = path.read_text()
          old = '''      .mockResolvedValueOnce({
                rows: [
                  {
                    id: EVIDENCE_ID,
                    locator,
                    content_hash: excerptHash,
                    excerpt,
                  },
                ],
              })
              .mockResolvedValueOnce({ rows: [] });'''
          new = '''      .mockResolvedValueOnce({
                rows: [
                  {
                    id: EVIDENCE_ID,
                    locator,
                    content_hash: excerptHash,
                    excerpt,
                  },
                ],
              })
              .mockResolvedValueOnce({ rows: [] })
              .mockResolvedValueOnce({
                rows: [{ schema_profile: {}, current_revision: "managed:8" }],
              });'''
          if text.count(old) != 1:
              raise SystemExit(f"compilation-stage regression anchor expected once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format candidate
        run: >-
          pnpm exec prettier --write
          apps/worker/src/compilation-stage.ts
          apps/worker/test/knowledge-profile-compilation.test.ts
          apps/worker/test/compilation-stage.test.ts
          packages/postgres/test/knowledge-profile-activation.integration.test.ts

      - name: Build workspace packages
        run: pnpm build

      - name: Run worker profile race tests
        run: >-
          pnpm --filter @akp/worker exec vitest run
          test/knowledge-profile-compilation.test.ts
          test/compilation-stage.test.ts

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run profile activation race integration
        run: >-
          pnpm --filter @akp/postgres exec vitest run
          test/knowledge-profile-activation.integration.test.ts

      - name: Run workspace check
        run: pnpm check

      - name: Promote clean product commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/worker/src/compilation-stage.ts \
            apps/worker/test/knowledge-profile-compilation.test.ts \
            apps/worker/test/compilation-stage.test.ts \
            packages/postgres/test/knowledge-profile-activation.integration.test.ts
          git rm -f \
            .github/workflows/p1-adversarial-races-materialize.yml \
            scripts/tmp-p1-adversarial-races.py
          git diff --cached --check
          git commit -m "fix(p1): reject profile races during compilation and activation"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace

      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans || true
