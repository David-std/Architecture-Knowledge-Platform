name: p2-workspace-format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format workspace coordination files
        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
          pnpm exec prettier --check \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
      - name: Promote exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/routes/sessions.ts \
            apps/api/test/workspace-coordination.integration.test.ts \
            packages/postgres/src/workspace-coordination.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(p2): format workspace coordination"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: actions/upload-artifact@v7
        with:
          name: p2-workspace-formatted
          path: |
            apps/api/src/routes/sessions.ts
            apps/api/test/workspace-coordination.integration.test.ts
            packages/postgres/src/workspace-coordination.ts
          if-no-files-found: error
          retention-days: 1
