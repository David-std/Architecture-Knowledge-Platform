name: workspace-context-materializer-test-inspect

on:
  push:
    branches: [feat/v0.4-enterprise-context-workspace]
    paths:
      - .github/workflows/workspace-context-materializer-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
      - name: Inspect focused integration block
        shell: bash
        run: |
          python - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          workflow = Path('.github/workflows/workspace-context-preflight.yml').read_text()
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit('payload not found')
          lines = zlib.decompress(base64.b64decode(match.group(1))).decode().splitlines()
          for n in range(620, min(720, len(lines))):
              print(f'{n+1:04d}: {lines[n]}')
          PY
