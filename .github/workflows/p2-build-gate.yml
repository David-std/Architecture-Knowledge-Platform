name: p2-build-gate

on:
  push:
    branches:
      - batch/p2-build-gate-20260916

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Fix exact optional-property build errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          context = Path('apps/api/src/routes/context-fabric.ts')
          text = context.read_text()
          old = '''        authority: request.body?.authority,\n        metadata,\n'''
          new = '''        ...(request.body?.authority\n          ? { authority: request.body.authority }\n          : {}),\n        metadata,\n'''
          if old not in text:
              raise SystemExit('context-fabric authority target not found')
          context.write_text(text.replace(old, new, 1))

          presence = Path('apps/api/src/routes/workspace-presence.ts')
          text = presence.read_text()
          old = '''        actorId: actor.id,\n        ttlSeconds: request.body?.ttlSeconds,\n'''
          new = '''        actorId: actor.id,\n        ...(request.body?.ttlSeconds !== undefined\n          ? { ttlSeconds: request.body.ttlSeconds }\n          : {}),\n'''
          if old not in text:
              raise SystemExit('workspace-presence ttl target not found')
          presence.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            apps/api/src/routes/context-fabric.ts \
            apps/api/src/routes/workspace-presence.ts
      - name: Verify formatting
        run: pnpm exec prettier --check .
      - name: Capture build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee p2-build.log
      - name: Commit build correction
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/routes/context-fabric.ts apps/api/src/routes/workspace-presence.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(p2): satisfy exact optional property contracts"
          git push origin HEAD:batch/p2-build-gate-20260916
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p2-build-gate-${{ github.run_id }}
          path: p2-build.log
          if-no-files-found: warn
