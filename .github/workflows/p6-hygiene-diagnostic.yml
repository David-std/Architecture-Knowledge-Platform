name: p6-hygiene-diagnostic

on:
  pull_request:

jobs:
  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Regenerate canonical repository classification for the final tree
        run: |
          rm .github/workflows/p6-hygiene-diagnostic.yml
          node scripts/validate-repository-hygiene.mjs --write
      - name: Validate regenerated classification
        run: node scripts/validate-repository-hygiene.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: p6-hygiene-${{ github.run_id }}
          path: REPOSITORY_FILE_CLASSIFICATION.json
          if-no-files-found: error
          retention-days: 1
