name: p6-hygiene-diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  classification:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/p5-document-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Regenerate canonical inventory and remove this diagnostic
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p6-hygiene-diagnostic.yml
          node scripts/validate-repository-hygiene.mjs --write
          node scripts/validate-repository-hygiene.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_CLASSIFICATION.json .github/workflows/p6-hygiene-diagnostic.yml
          git diff --cached --check
          git commit -m "chore(p6): refresh repository hygiene inventory"
          git push origin HEAD:${GITHUB_HEAD_REF}
