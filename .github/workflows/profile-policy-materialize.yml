name: profile-policy-materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/profile-policy-materialize.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Materialize enforcement slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"anchor not unique in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new))

          replace(
              "packages/contracts/src/knowledge-profile.ts",
              '''  artifactContracts: {\n    "markdown-v03": {\n      root: "knowledge",\n      pathTemplate: "{kind}/{candidateId}.md",\n      extension: ".md",\n    },\n  },''',
              '''  artifactContracts: {\n    "markdown-v03": {\n      root: "20-knowledge/generated",\n      pathTemplate: "{kind}/{slug}.md",\n      extension: ".md",\n    },\n  },''',
          )

          replace(
              "packages/compiler/src/contracts.ts",
              '''    excerpt: z.string().min(1).max(12_000),\n    excerptHash: Sha256,\n  })''',
              '''    excerpt: z.string().min(1).max(12_000),\n    excerptHash: Sha256,\n    trust: TrustTier.optional(),\n  })''',
          )

          replace(
              "packages/compiler/src/contracts.ts",
              '''export type ReviewExistingKnowledgeCandidate = z.infer<\n  typeof ReviewExistingKnowledgeCandidate\n>;\n\nexport const ReviewCompilationContext = z''',
              '''export type ReviewExistingKnowledgeCandidate = z.infer<\n  typeof ReviewExistingKnowledgeCandidate\n>;\n\nexport const EffectiveReviewPolicy = z\n  .object({\n    required: z.literal(true),\n    minimumApprovals: z.number().int().min(1).max(20),\n    allowedRoles: z.array(z.string().min(1).max(100)).min(1),\n    profileSource: z.enum(["DURABLE_REVISION", "V03_DEFAULT"]),\n    profileRevisionId: z.string().uuid().nullable(),\n    profileHash: Sha256,\n    profileId: z.string().min(1).max(100),\n    profileVersion: z.string().min(1).max(100),\n  })\n  .strict();\nexport type EffectiveReviewPolicy = z.infer<typeof EffectiveReviewPolicy>;\n\nexport const ReviewCompilationContext = z''',
          )

          replace(
              "packages/compiler/src/contracts.ts",
              '''    contradictions: z.array(KnowledgeContradiction).max(50),\n    warnings: z.array(z.string().min(1).max(2_000)).max(50),''',
              '''    contradictions: z.array(KnowledgeContradiction).max(50),\n    reviewPolicy: EffectiveReviewPolicy,\n    warnings: z.array(z.string().min(1).max(2_000)).max(50),''',
          )

          replace(
              "packages/compiler/src/grounding.ts",
              '''import {\n  KnowledgeCompilerInput,''',
              '''import type { TrustTier } from "@akp/contracts";\nimport {\n  KnowledgeCompilerInput,''',
          )

          replace(
              "packages/compiler/src/grounding.ts",
              '''export function deriveKnowledgePath(input: {\n  title: string;\n  kind: KnowledgeKind;\n  schemaProfile?: Record<string, unknown>;\n}): string {\n  const configuredRoot = input.schemaProfile?.compiledRoot;\n  const root =\n    typeof configuredRoot === "string" && configuredRoot.trim()\n      ? configuredRoot.replaceAll("\\\\", "/").replaceAll(/\\/+$/g, "")\n      : "20-knowledge/generated";\n  assertCompilerAuthoredKnowledgePath(root);\n  const path = `${root}/${input.kind}/${slug(input.title)}.md`;\n  assertCompilerAuthoredKnowledgePath(path);\n  return path;\n}\n''',
              '''export function deriveKnowledgePath(input: {\n  title: string;\n  kind: KnowledgeKind;\n  schemaProfile?: Record<string, unknown>;\n}): string {\n  const configuredRoot = input.schemaProfile?.compiledRoot;\n  const root =\n    typeof configuredRoot === "string" && configuredRoot.trim()\n      ? configuredRoot.replaceAll("\\\\", "/").replaceAll(/\\/+$/g, "")\n      : "20-knowledge/generated";\n  assertCompilerAuthoredKnowledgePath(root);\n  const path = `${root}/${input.kind}/${slug(input.title)}.md`;\n  assertCompilerAuthoredKnowledgePath(path);\n  return path;\n}\n\nfunction portableArtifactToken(value: string): string {\n  const normalized = value\n    .normalize("NFKD")\n    .replaceAll(/[\\u0300-\\u036f]/g, "")\n    .replaceAll(/[^A-Za-z0-9._-]+/g, "-")\n    .replaceAll(/^-+|-+$/g, "")\n    .slice(0, 128);\n  return normalized || "knowledge";\n}\n\nfunction isV03CompatibilityProfile(\n  profile: KnowledgeCompilerInputType["knowledgeProfile"],\n): boolean {\n  return (\n    profile.profile.profileId === "default" &&\n    profile.profile.version === "0.3-compat"\n  );\n}\n\nexport function deriveProfileKnowledgePath(input: {\n  title: string;\n  kind: KnowledgeKind;\n  candidateId: string;\n  knowledgeProfile: KnowledgeCompilerInputType["knowledgeProfile"];\n  schemaProfile?: Record<string, unknown>;\n}): string {\n  const kind = input.knowledgeProfile.profile.knowledgeKinds[input.kind];\n  if (!kind) throw new Error(`COMPILER_PROFILE_KIND_NOT_DECLARED:${input.kind}`);\n  const contract =\n    input.knowledgeProfile.profile.artifactContracts[kind.artifactContract];\n  if (!contract) {\n    throw new Error(`COMPILER_ARTIFACT_CONTRACT_NOT_FOUND:${kind.artifactContract}`);\n  }\n  const configuredRoot = input.schemaProfile?.compiledRoot;\n  const root =\n    isV03CompatibilityProfile(input.knowledgeProfile) &&\n    typeof configuredRoot === "string" &&\n    configuredRoot.trim()\n      ? configuredRoot.replaceAll("\\\\", "/").replaceAll(/\\/+$/g, "")\n      : contract.root.replaceAll("\\\\", "/").replaceAll(/\\/+$/g, "");\n  assertCompilerAuthoredKnowledgePath(root);\n  const tokens: Record<string, string> = {\n    kind: portableArtifactToken(input.kind),\n    candidateId: portableArtifactToken(input.candidateId),\n    slug: slug(input.title),\n  };\n  let rendered = contract.pathTemplate.replaceAll("\\\\", "/");\n  for (const token of rendered.matchAll(/\\{([^}]+)\\}/g)) {\n    if (!Object.hasOwn(tokens, token[1] ?? "")) {\n      throw new Error(`COMPILER_ARTIFACT_TEMPLATE_TOKEN_UNSUPPORTED:${token[1] ?? ""}`);\n    }\n  }\n  for (const [name, value] of Object.entries(tokens)) {\n    rendered = rendered.replaceAll(`{${name}}`, value);\n  }\n  if (/[{}]/.test(rendered)) {\n    throw new Error("COMPILER_ARTIFACT_TEMPLATE_INVALID");\n  }\n  const withoutExtension = `${root}/${rendered}`.replaceAll(/\\/{2,}/g, "/");\n  const path = withoutExtension.endsWith(contract.extension)\n    ? withoutExtension\n    : `${withoutExtension}${contract.extension}`;\n  assertCompilerAuthoredKnowledgePath(path);\n  return path;\n}\n\nconst TRUST_ORDER: Record<TrustTier, number> = {\n  UNVERIFIED: 0,\n  MACHINE_SUPPORTED: 1,\n  HUMAN_REVIEWED: 2,\n  ATTESTED: 3,\n};\n\nfunction effectiveEvidenceTrust(\n  input: KnowledgeCompilerInputType,\n  evidence: CompilerEvidence,\n): TrustTier {\n  if (evidence.trust) return evidence.trust;\n  return isV03CompatibilityProfile(input.knowledgeProfile)\n    ? "MACHINE_SUPPORTED"\n    : "UNVERIFIED";\n}\n\nfunction effectiveReviewPolicy(\n  input: KnowledgeCompilerInputType,\n  result: KnowledgeCompilerResultType,\n) {\n  const materialCandidateIds = new Set(\n    result.proposedFileChanges.map((change) => change.candidateId),\n  );\n  const kinds = [\n    ...new Set(\n      result.knowledgeCandidates\n        .filter((candidate) =>\n          materialCandidateIds.size\n            ? materialCandidateIds.has(candidate.candidateId)\n            : candidate.proposedAction !== "NO_MATERIAL",\n        )\n        .map((candidate) => candidate.kind),\n    ),\n  ];\n  const policyDefinitions = kinds.map((kindName) => {\n    const kind = input.knowledgeProfile.profile.knowledgeKinds[kindName];\n    if (!kind) throw new Error(`COMPILER_PROFILE_KIND_NOT_DECLARED:${kindName}`);\n    const policy = input.knowledgeProfile.profile.reviewPolicies[kind.reviewPolicy];\n    if (!policy) {\n      throw new Error(`COMPILER_REVIEW_POLICY_NOT_FOUND:${kind.reviewPolicy}`);\n    }\n    return policy;\n  });\n  const minimumApprovals = Math.max(\n    1,\n    ...policyDefinitions.map((policy) => policy.minimumApprovals),\n  );\n  const allowedRoles = policyDefinitions.length\n    ? policyDefinitions\n        .slice(1)\n        .reduce(\n          (roles, policy) =>\n            roles.filter((role) => policy.allowedRoles.includes(role)),\n          [...policyDefinitions[0]!.allowedRoles],\n        )\n        .sort()\n    : ["ADMIN", "ARCHITECT", "REVIEWER"];\n  if (!allowedRoles.length) {\n    throw new Error("COMPILER_REVIEW_POLICY_ROLE_CONFLICT");\n  }\n  return {\n    required: true as const,\n    minimumApprovals,\n    allowedRoles,\n    profileSource: input.knowledgeProfile.source,\n    profileRevisionId: input.knowledgeProfile.revisionId,\n    profileHash: input.knowledgeProfile.profileHash,\n    profileId: input.knowledgeProfile.profile.profileId,\n    profileVersion: input.knowledgeProfile.profile.version,\n  };\n}\n''',
          )

          replace(
              "packages/compiler/src/grounding.ts",
              '''    assertEvidenceReferences(\n      `COMPILER_KNOWLEDGE_CANDIDATE:${candidate.candidateId}`,\n      candidate.evidenceIds,\n      allowedEvidenceIds,\n    );\n    if (\n      candidate.existingDocumentId &&''',
              '''    assertEvidenceReferences(\n      `COMPILER_KNOWLEDGE_CANDIDATE:${candidate.candidateId}`,\n      candidate.evidenceIds,\n      allowedEvidenceIds,\n    );\n    const kindDefinition =\n      input.knowledgeProfile.profile.knowledgeKinds[candidate.kind];\n    if (!kindDefinition) {\n      throw new Error(`COMPILER_PROFILE_KIND_NOT_DECLARED:${candidate.kind}`);\n    }\n    const evidencePolicy =\n      input.knowledgeProfile.profile.evidencePolicies[\n        kindDefinition.evidencePolicy\n      ];\n    if (!evidencePolicy) {\n      throw new Error(\n        `COMPILER_EVIDENCE_POLICY_NOT_FOUND:${kindDefinition.evidencePolicy}`,\n      );\n    }\n    const uniqueEvidenceIds = [...new Set(candidate.evidenceIds)];\n    if (uniqueEvidenceIds.length < Math.max(1, evidencePolicy.minimumEvidence)) {\n      throw new Error(\n        `COMPILER_EVIDENCE_POLICY_MINIMUM_NOT_MET:${candidate.candidateId}`,\n      );\n    }\n    for (const evidenceId of uniqueEvidenceIds) {\n      const evidence = evidenceById.get(evidenceId)!;\n      if (\n        evidencePolicy.requireSourceLocator &&\n        (!evidence.locator.path.trim() || !evidence.locator.source_hash.trim())\n      ) {\n        throw new Error(\n          `COMPILER_EVIDENCE_POLICY_LOCATOR_REQUIRED:${candidate.candidateId}:${evidenceId}`,\n        );\n      }\n      if (\n        TRUST_ORDER[effectiveEvidenceTrust(input, evidence)] <\n        TRUST_ORDER[evidencePolicy.minimumTrust]\n      ) {\n        throw new Error(\n          `COMPILER_EVIDENCE_POLICY_TRUST_NOT_MET:${candidate.candidateId}:${evidenceId}`,\n        );\n      }\n    }\n    if (\n      candidate.existingDocumentId &&''',
          )

          replace(
              "packages/compiler/src/grounding.ts",
              '''      const expectedPath = deriveKnowledgePath({\n        title: candidate.statement,\n        kind: candidate.kind,\n        schemaProfile: input.schemaProfile,\n      });''',
              '''      const expectedPath = deriveProfileKnowledgePath({\n        title: candidate.statement,\n        kind: candidate.kind,\n        candidateId: candidate.candidateId,\n        knowledgeProfile: input.knowledgeProfile,\n        schemaProfile: input.schemaProfile,\n      });''',
          )

          replace(
              "packages/compiler/src/grounding.ts",
              '''  const reviewContext = ReviewCompilationContext.parse({\n    identity: result.identity,''',
              '''  const reviewContext = ReviewCompilationContext.parse({\n    identity: result.identity,''',
          )
          replace(
              "packages/compiler/src/grounding.ts",
              '''    knowledgeCandidates: result.knowledgeCandidates,\n    contradictions: result.contradictions,\n    warnings: result.warnings,''',
              '''    knowledgeCandidates: result.knowledgeCandidates,\n    contradictions: result.contradictions,\n    reviewPolicy: effectiveReviewPolicy(input, result),\n    warnings: result.warnings,''',
          )

          replace(
              "apps/worker/src/compilation-stage.ts",
              '''import { StructuralLocator, type DocumentArtifact } from "@akp/contracts";''',
              '''import {\n  StructuralLocator,\n  type DocumentArtifact,\n  type TrustTier,\n} from "@akp/contracts";''',
          )
          replace(
              "apps/worker/src/compilation-stage.ts",
              '''  content_hash: string;\n  excerpt: string | null;\n}''',
              '''  content_hash: string;\n  excerpt: string | null;\n  review_status?: string | null;\n}''',
          )
          replace(
              "apps/worker/src/compilation-stage.ts",
              '''async function loadEvidence(\n  db: Postgres,''',
              '''function evidenceTrustFromStatus(\n  status: string | null | undefined,\n): TrustTier | undefined {\n  switch (status) {\n    case "MACHINE_EXTRACTED":\n    case "MACHINE_SUPPORTED":\n      return "MACHINE_SUPPORTED";\n    case "HUMAN_REVIEWED":\n      return "HUMAN_REVIEWED";\n    case "ATTESTED":\n      return "ATTESTED";\n    case "PENDING":\n    case "UNVERIFIED":\n      return "UNVERIFIED";\n    default:\n      return undefined;\n  }\n}\n\nasync function loadEvidence(\n  db: Postgres,''',
          )
          replace(
              "apps/worker/src/compilation-stage.ts",
              '''    select id,locator,content_hash,excerpt\n      from evidence''',
              '''    select id,locator,content_hash,excerpt,review_status\n      from evidence''',
          )
          replace(
              "apps/worker/src/compilation-stage.ts",
              '''    excerpt: row.excerpt,\n    excerptHash: row.content_hash,\n  };''',
              '''    excerpt: row.excerpt,\n    excerptHash: row.content_hash,\n    ...(evidenceTrustFromStatus(row.review_status)\n      ? { trust: evidenceTrustFromStatus(row.review_status) }\n      : {}),\n  };''',
          )

          Path("packages/compiler/test/profile-policy-enforcement.test.ts").write_text(r'''import { describe, expect, it } from "vitest";
import {
  KnowledgeCompilerInput,
  deriveKnowledgePath,
  deriveProfileKnowledgePath,
  durableCompilerKnowledgeProfileContext,
  knowledgeProfileHash,
  normalizeKnowledgeCompilerResult,
  resultToCompilationPlan,
} from "../src/index.js";
import {
  DEFAULT_KNOWLEDGE_PROFILE_V1,
  KnowledgeProfileV1,
  NEUTRAL_KNOWLEDGE_PROFILE_V1,
} from "@akp/contracts/knowledge-profile";

const SOURCE_ID = "11111111-1111-4111-8111-111111111111";
const ARTIFACT_ID = "22222222-2222-4222-8222-222222222222";
const EVIDENCE_ID = "33333333-3333-4333-8333-333333333333";
const SPACE_ID = "44444444-4444-4444-8444-444444444444";
const VAULT_ID = "55555555-5555-4555-8555-555555555555";
const REVISION_ID = "66666666-6666-4666-8666-666666666666";
const SOURCE_HASH = "a".repeat(64);
const EXCERPT_HASH = "b".repeat(64);
const STATEMENT = "Invalidate stale cache entries after the authoritative revision changes.";

function locator() {
  return {
    kind: "paragraph" as const,
    source_hash: SOURCE_HASH,
    path: `source:${SOURCE_ID}`,
    paragraph: 1,
    heading_path: ["Guidance"],
  };
}

function durableContext(profile: unknown) {
  const parsed = KnowledgeProfileV1.parse(profile);
  return durableCompilerKnowledgeProfileContext({
    revisionId: REVISION_ID,
    profileHash: knowledgeProfileHash(parsed),
    profile: parsed,
  });
}

function inputFor(profile: unknown, trust: "UNVERIFIED" | "MACHINE_SUPPORTED" = "MACHINE_SUPPORTED") {
  return KnowledgeCompilerInput.parse({
    source: {
      sourceId: SOURCE_ID,
      sourceArtifactId: ARTIFACT_ID,
      sha256: SOURCE_HASH,
      title: "Cache guidance",
      mediaType: "text/markdown",
    },
    documentArtifact: {
      source_id: SOURCE_ID,
      source_hash: SOURCE_HASH,
      media_type: "text/markdown",
      extractor: "fixture",
      extractor_version: "1",
      locators: [locator()],
    },
    evidence: [
      {
        id: EVIDENCE_ID,
        sourceArtifactId: ARTIFACT_ID,
        locator: locator(),
        excerpt: STATEMENT,
        excerptHash: EXCERPT_HASH,
        trust,
      },
    ],
    existingCandidates: [],
    knowledgeProfile: durableContext(profile),
    schemaProfile: { compiledRoot: "legacy-generated" },
    policy: {
      reviewRequired: true,
      allowDirectPublication: false,
      allowedKnowledgeKinds: Object.keys(KnowledgeProfileV1.parse(profile).knowledgeKinds),
    },
    corpusRevision: "corpus-profile-policy",
    spaceId: SPACE_ID,
    vaultId: VAULT_ID,
  });
}

function resultFor(input: ReturnType<typeof inputFor>, kind: string) {
  const candidateId = "candidate-1";
  const path = deriveProfileKnowledgePath({
    title: STATEMENT,
    kind,
    candidateId,
    knowledgeProfile: input.knowledgeProfile,
    schemaProfile: input.schemaProfile,
  });
  return {
    identity: {
      classification: "DISTINCT" as const,
      candidates: [],
      reason: "Distinct grounded guidance.",
    },
    evidenceCandidates: [
      {
        sourceArtifactId: ARTIFACT_ID,
        locator: locator(),
        excerptHash: EXCERPT_HASH,
      },
    ],
    knowledgeCandidates: [
      {
        candidateId,
        kind,
        statement: STATEMENT,
        scope: "Revision-addressed caches.",
        evidenceIds: [EVIDENCE_ID],
        confidence: 0.9,
        proposedAction: "CREATE" as const,
      },
    ],
    contradictions: [],
    proposedFileChanges: [
      {
        candidateId,
        path,
        operation: "CREATE" as const,
        content: `---\nid: CACHE-1\ntype: ${kind}\nstatus: draft\n---\n\n${STATEMENT}\n`,
        reasons: ["Grounded in source evidence."],
        evidenceIds: [EVIDENCE_ID],
      },
    ],
    impactedDocumentIds: [],
    probes: [
      {
        question: "Is the proposal grounded?",
        criticality: "CRITICAL" as const,
        evidenceIds: [EVIDENCE_ID],
      },
    ],
    warnings: [],
    summary: "One review-required proposal.",
  };
}

describe("KnowledgeProfile runtime policy enforcement", () => {
  it("keeps the default profile artifact placement byte-compatible with the legacy compiledRoot rule", () => {
    const context = durableContext(DEFAULT_KNOWLEDGE_PROFILE_V1);
    const schemaProfile = { compiledRoot: "custom-generated" };
    expect(
      deriveProfileKnowledgePath({
        title: STATEMENT,
        kind: "rule",
        candidateId: "candidate-1",
        knowledgeProfile: context,
        schemaProfile,
      }),
    ).toBe(deriveKnowledgePath({ title: STATEMENT, kind: "rule", schemaProfile }));
  });

  it("uses a durable non-default profile artifact contract instead of legacy compiledRoot", () => {
    const input = inputFor(NEUTRAL_KNOWLEDGE_PROFILE_V1, "UNVERIFIED");
    const result = resultFor(input, "note");
    expect(result.proposedFileChanges[0]?.path).toBe("knowledge/note/candidate-1.md");
    expect(() => normalizeKnowledgeCompilerResult(input, result)).not.toThrow();

    const legacyPath = structuredClone(result);
    legacyPath.proposedFileChanges[0]!.path = deriveKnowledgePath({
      title: STATEMENT,
      kind: "note",
      schemaProfile: input.schemaProfile,
    });
    expect(() => normalizeKnowledgeCompilerResult(input, legacyPath)).toThrow(
      /CREATE_PATH_NOT_RUNTIME_DERIVED/,
    );
  });

  it("fails closed when a kind requires more independent evidence references than the model supplied", () => {
    const profile = structuredClone(NEUTRAL_KNOWLEDGE_PROFILE_V1);
    profile.evidencePolicies["optional-evidence"]!.minimumEvidence = 2;
    const input = inputFor(profile, "UNVERIFIED");
    expect(() => normalizeKnowledgeCompilerResult(input, resultFor(input, "note"))).toThrow(
      /COMPILER_EVIDENCE_POLICY_MINIMUM_NOT_MET:candidate-1/,
    );
  });

  it("fails closed when durable evidence trust is below the active profile minimum", () => {
    const input = inputFor(NEUTRAL_KNOWLEDGE_PROFILE_V1, "UNVERIFIED");
    expect(() =>
      normalizeKnowledgeCompilerResult(input, resultFor(input, "procedure")),
    ).toThrow(/COMPILER_EVIDENCE_POLICY_TRUST_NOT_MET:candidate-1/);
  });

  it("keeps human review mandatory even when a profile attempts to make review permissive", () => {
    const profile = structuredClone(NEUTRAL_KNOWLEDGE_PROFILE_V1);
    profile.reviewPolicies["neutral-review"]!.required = false;
    profile.reviewPolicies["neutral-review"]!.minimumApprovals = 0;
    profile.reviewPolicies["neutral-review"]!.allowedRoles = ["CURATOR"];
    const input = inputFor(profile, "UNVERIFIED");
    const plan = resultToCompilationPlan(input, resultFor(input, "note"));
    expect(plan.reviewContext?.reviewPolicy).toMatchObject({
      required: true,
      minimumApprovals: 1,
      allowedRoles: ["CURATOR"],
      profileSource: "DURABLE_REVISION",
      profileRevisionId: REVISION_ID,
      profileId: "neutral-notes",
    });
  });
});
''')
          PY
      - name: Format candidate files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/knowledge-profile.ts
          packages/compiler/src/contracts.ts
          packages/compiler/src/grounding.ts
          apps/worker/src/compilation-stage.ts
          packages/compiler/test/profile-policy-enforcement.test.ts
      - name: Run focused compiler tests
        run: pnpm --filter @akp/compiler test
      - name: Run worker profile integration test
        run: pnpm exec vitest run apps/worker/test/knowledge-profile-compilation.test.ts
      - name: Run TypeScript check
        run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: profile-policy-candidate-${{ github.run_id }}
          path: |
            packages/contracts/src/knowledge-profile.ts
            packages/compiler/src/contracts.ts
            packages/compiler/src/grounding.ts
            apps/worker/src/compilation-stage.ts
            packages/compiler/test/profile-policy-enforcement.test.ts
          if-no-files-found: error
