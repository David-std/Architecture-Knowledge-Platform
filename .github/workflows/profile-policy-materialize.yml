name: profile-policy-materialize

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - ".github/workflows/profile-policy-materialize.yml"
      - "scripts/tmp-profile-policy-materialize.py"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Align materializer anchor with current worker
        run: >-
          sed -i 's/locator: parsedLocator.data,/locator,/'
          scripts/tmp-profile-policy-materialize.py
      - name: Materialize enforcement slice
        run: python scripts/tmp-profile-policy-materialize.py
      - name: Harden candidate typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/compiler/src/grounding.ts")
          text = path.read_text()

          old = '''    return deriveKnowledgePath({
              title: input.title,
              kind: input.kind,
              schemaProfile: input.schemaProfile,
            });'''
          new = '''    return deriveKnowledgePath({
              title: input.title,
              kind: input.kind,
              ...(input.schemaProfile ? { schemaProfile: input.schemaProfile } : {}),
            });'''
          if old not in text:
              raise SystemExit("deriveKnowledgePath typing anchor missing")
          text = text.replace(old, new, 1)

          old = '''      if (
                evidencePolicy.requireSourceLocator &&
                (!evidence.locator.path.trim() || !evidence.locator.source_hash.trim())
              ) {'''
          new = '''      const locatorPath = evidence.locator.path;
              const locatorSourceHash = evidence.locator.source_hash;
              if (
                evidencePolicy.requireSourceLocator &&
                (!locatorPath?.trim() || !locatorSourceHash?.trim())
              ) {'''
          if old not in text:
              raise SystemExit("locator typing anchor missing")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format candidate files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/knowledge-profile.ts
          packages/compiler/src/contracts.ts
          packages/compiler/src/grounding.ts
          apps/worker/src/compilation-stage.ts
          packages/compiler/test/profile-policy-enforcement.test.ts
      - name: Build workspace packages
        run: pnpm build
      - name: Run focused compiler tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @akp/compiler test 2>&1 | tee profile-policy-compiler-test.log
      - name: Run worker profile integration test
        run: pnpm exec vitest run apps/worker/test/knowledge-profile-compilation.test.ts
      - name: Run TypeScript check
        run: pnpm check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-policy-candidate-${{ github.run_id }}
          path: |
            packages/contracts/src/knowledge-profile.ts
            packages/compiler/src/contracts.ts
            packages/compiler/src/grounding.ts
            apps/worker/src/compilation-stage.ts
            packages/compiler/test/profile-policy-enforcement.test.ts
            profile-policy-compiler-test.log
          if-no-files-found: warn
