name: profile-policy-materialize

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - ".github/workflows/profile-policy-materialize.yml"
      - "scripts/tmp-profile-policy-materialize.py"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Align materializer anchor with current worker
        run: >-
          sed -i 's/locator: parsedLocator.data,/locator,/'
          scripts/tmp-profile-policy-materialize.py
      - name: Materialize enforcement slice
        run: python scripts/tmp-profile-policy-materialize.py
      - name: Harden candidate typing and worker regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          grounding = Path("packages/compiler/src/grounding.ts")
          text = grounding.read_text()

          old = "      schemaProfile: input.schemaProfile,\n    });\n  }\n  const kind ="
          new = "      ...(input.schemaProfile ? { schemaProfile: input.schemaProfile } : {}),\n    });\n  }\n  const kind ="
          if text.count(old) != 1:
              raise SystemExit(f"deriveKnowledgePath typing anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = "        (!evidence.locator.path.trim() || !evidence.locator.source_hash.trim())"
          new = "        (!evidence.locator.path?.trim() || !evidence.locator.source_hash?.trim())"
          if text.count(old) != 1:
              raise SystemExit(f"locator typing anchor count={text.count(old)}")
          grounding.write_text(text.replace(old, new, 1))

          test = Path("apps/worker/test/knowledge-profile-compilation.test.ts")
          text = test.read_text()
          old = '''  deriveKnowledgePath,\n  knowledgeProfileHash,'''
          new = '''  deriveKnowledgePath,\n  deriveProfileKnowledgePath,\n  durableCompilerKnowledgeProfileContext,\n  knowledgeProfileHash,'''
          if text.count(old) != 1:
              raise SystemExit(f"worker import anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        path: deriveKnowledgePath({ title: statement, kind }),'''
          new = '''        path:\n          kind === "note"\n            ? deriveProfileKnowledgePath({\n                title: statement,\n                kind,\n                candidateId: "candidate-1",\n                knowledgeProfile: durableCompilerKnowledgeProfileContext({\n                  revisionId: PROFILE_REVISION_ID,\n                  profileHash: knowledgeProfileHash(\n                    NEUTRAL_KNOWLEDGE_PROFILE_V1,\n                  ),\n                  profile: NEUTRAL_KNOWLEDGE_PROFILE_V1,\n                }),\n              })\n            : deriveKnowledgePath({ title: statement, kind }),'''
          if text.count(old) != 1:
              raise SystemExit(f"worker path anchor count={text.count(old)}")
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Format candidate files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/knowledge-profile.ts
          packages/compiler/src/contracts.ts
          packages/compiler/src/grounding.ts
          apps/worker/src/compilation-stage.ts
          packages/compiler/test/profile-policy-enforcement.test.ts
          apps/worker/test/knowledge-profile-compilation.test.ts
      - name: Build workspace packages
        run: pnpm build
      - name: Run focused compiler tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @akp/compiler test 2>&1 | tee profile-policy-compiler-test.log
      - name: Run worker profile integration test
        run: pnpm exec vitest run apps/worker/test/knowledge-profile-compilation.test.ts
      - name: Run TypeScript check
        run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: profile-policy-candidate-${{ github.run_id }}
          path: |
            packages/contracts/src/knowledge-profile.ts
            packages/compiler/src/contracts.ts
            packages/compiler/src/grounding.ts
            apps/worker/src/compilation-stage.ts
            packages/compiler/test/profile-policy-enforcement.test.ts
            apps/worker/test/knowledge-profile-compilation.test.ts
            profile-policy-compiler-test.log
          if-no-files-found: error
      - name: Promote validated slice and remove harness
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "Architecture Knowledge Platform"
          git config user.email "akp@localhost"
          git add \
            packages/contracts/src/knowledge-profile.ts \
            packages/compiler/src/contracts.ts \
            packages/compiler/src/grounding.ts \
            apps/worker/src/compilation-stage.ts \
            packages/compiler/test/profile-policy-enforcement.test.ts \
            apps/worker/test/knowledge-profile-compilation.test.ts
          git rm -f .github/workflows/profile-policy-materialize.yml scripts/tmp-profile-policy-materialize.py
          rm -f profile-policy-compiler-test.log
          git diff --cached --check
          git diff --cached --quiet && { echo "No validated product changes to promote"; exit 1; }
          git commit -m "feat(p1): enforce KnowledgeProfile runtime policies"
          git push origin HEAD:${GITHUB_REF_NAME}
