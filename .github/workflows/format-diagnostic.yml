name: format-diagnostic

on:
  push:
    branches:
      - work/product-completion-final

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Materialize exact Prettier output
        run: |
          pnpm exec prettier --write \
            apps/worker/src/compilation-stage.ts \
            apps/worker/src/instrumentation.ts
          git diff -- \
            apps/worker/src/compilation-stage.ts \
            apps/worker/src/instrumentation.ts \
            > prettier-generated.diff
      - uses: actions/upload-artifact@v7
        with:
          name: prettier-generated-${{ github.run_id }}
          path: |
            apps/worker/src/compilation-stage.ts
            apps/worker/src/instrumentation.ts
            prettier-generated.diff
          retention-days: 1
