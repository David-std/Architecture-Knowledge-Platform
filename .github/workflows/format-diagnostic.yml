name: temporary-format-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Print exact Prettier 3.9.6 diff
        shell: bash
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/knowledge-profile.ts \
            packages/contracts/test/knowledge-profile.test.ts \
            scripts/capability-maturity-baseline.ts
          echo '=== PRETTIER DIFF BEGIN ==='
          git diff --no-ext-diff --no-color -- \
            packages/contracts/src/knowledge-profile.ts \
            packages/contracts/test/knowledge-profile.test.ts \
            scripts/capability-maturity-baseline.ts
          echo '=== PRETTIER DIFF END ==='
