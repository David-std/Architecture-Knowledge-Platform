          PATCH
          python /tmp/repair.py
          pnpm exec prettier --write scripts/load-scale-benchmark.ts scripts/agent-ab-benchmark.ts
          git diff --check
          printf '%s\n' \
            .github/workflows/diagnose-p10-scale-trigger.yml \
            db/migrations/027_set_based_embedding_validation.sql \
            scripts/agent-ab-benchmark.ts \
            scripts/load-scale-benchmark.ts | sort > /tmp/expected
          git diff --name-only | sort > /tmp/changed
          diff -u /tmp/expected /tmp/changed
      - name: Validate repository
        run: pnpm check
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Prove embedding trigger topology
        shell: bash
        run: |
          docker compose exec -T postgres psql -U akp -d akp -Atc "select tgname from pg_trigger where tgrelid='unit_embeddings'::regclass and not tgisinternal order by tgname" | tee /tmp/triggers.txt
          printf '%s\n' unit_embeddings_validate_insert_statement unit_embeddings_validate_update_statement > /tmp/expected-triggers.txt
          diff -u /tmp/expected-triggers.txt /tmp/triggers.txt
      - name: Validate embedding integration semantics
        run: pnpm --filter @akp/indexing exec vitest run test/embedding-index.integration.test.ts
      - name: Validate 100K scale path
        shell: bash
        run: |
          mkdir -p reports/preflight
          pnpm benchmark:scale -- \
            --output reports/preflight/scale-100000.json \
            --targets 100000 \
            --iterations 1
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('reports/preflight/scale-100000.json','utf8'));
          const row=r.results?.[0];
          console.log(JSON.stringify({
            status:r.status,
            load:row?.loadLatencyMs,
            context:row?.contextPacket,
            rows:row?.rows,
            cleanup:r.cleanup
          },null,2));
          if (
            r.status !== 'PASSED' ||
            r.cleanup?.succeeded !== true ||
            row?.targetDocuments !== 100000 ||
            row?.rows?.documents !== 100000 ||
            row?.rows?.units !== 100000 ||
            row?.rows?.embeddings !== 100000 ||
            row?.contextPacket?.candidateCount !== 20
          ) process.exit(1);
          NODE
      - name: Commit validated corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(p10): bound final evidence paths"
          git push origin HEAD:work/product-completion-final
      - name: Capture preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-repair-${{ github.run_id }}
          path: reports/preflight
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
