name: evidence-cleanup

on:
  push:
    branches: [work/product-completion-final]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Remove preflight residue and tighten evidence wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          scale = Path("scripts/load-scale-benchmark.ts")
          replace_once(
              scale,
              '"Deterministic context-packet assembly latency for candidate sets sized to each target"',
              '"Deterministic context-packet assembly latency for the retrieval-bounded candidate set (up to request limit 20)"',
          )
          replace_once(
              scale,
              '"Context-packet timings exercise the in-process deterministic builder over synthetic candidates, not retrieval, persistence or API latency."',
              '"Context-packet timings exercise the in-process deterministic builder over at most the request limit of 20 synthetic candidates; corpus scale is measured in PostgreSQL, while retrieval, persistence and API latency remain separate dimensions."',
          )

          agent = Path("scripts/agent-ab-benchmark.ts")
          replace_once(
              agent,
              '"Keep ANSWER under 120 words and use at most four concise CLAIM lines."',
              '"Keep ANSWER under 120 words. When ABSTAIN is false, return one to four concise CLAIM lines; when true, CLAIM lines may be omitted."',
          )
          replace_once(
              agent,
              '`${basePrompt}\\n\\nFORMAT RETRY: The prior completion violated the line-oriented record contract. Return the same answer again using only ANSWER, ABSTAIN, CITATIONS, and zero to four CLAIM lines.`',
              '`${basePrompt}\\n\\nFORMAT RETRY: The prior completion violated the line-oriented record contract. Return only ANSWER, ABSTAIN, CITATIONS, plus one to four CLAIM lines when ABSTAIN is false; CLAIM lines may be omitted only when ABSTAIN is true.`',
          )
          replace_once(
              agent,
              '  return { answer, abstain, citations, claims };',
              '  if (!abstain && claims.length === 0) {\n    throw new Error("Provider omitted CLAIM lines for a non-abstaining answer.");\n  }\n  return { answer, abstain, citations, claims };',
          )

          report = Path("reports/preflight/scale-100000.json")
          if not report.exists():
              raise SystemExit("expected generated preflight report before cleanup")
          report.unlink()
          PY
          pnpm exec prettier --write scripts/load-scale-benchmark.ts scripts/agent-ab-benchmark.ts
          git diff --check
          printf '%s\n' \
            reports/preflight/scale-100000.json \
            scripts/agent-ab-benchmark.ts \
            scripts/load-scale-benchmark.ts | sort > /tmp/expected
          git diff --name-only | sort > /tmp/changed
          diff -u /tmp/expected /tmp/changed
      - name: Validate repository
        run: pnpm check
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(evidence): keep scale and agent claims honest"
          git push origin HEAD:work/product-completion-final
