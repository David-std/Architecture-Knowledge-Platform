name: p6-finalize-materialization

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'work/p5-document-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Materialize final P6 search formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/web/app/search/page.tsx
          git config user.name "AKP CI"
          git config user.email "akp-ci@localhost"
          git add apps/web/app/search/page.tsx
          git commit -m "style(p6): materialize final search formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
