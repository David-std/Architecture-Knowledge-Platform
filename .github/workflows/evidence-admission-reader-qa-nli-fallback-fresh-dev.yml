name: evidence-admission-reader-qa-nli-fallback-fresh-dev

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-admission-reader-qa-nli-fallback-fresh-dev:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'experiment/reader-qa-nli-fallback-fresh-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AKP_MODEL_CACHE_DIR: /tmp/akp-model-cache
      AKP_LOCAL_AGENT_MODEL: onnx-community/Qwen2.5-1.5B-Instruct
      AKP_LOCAL_AGENT_MODEL_REVISION: 9f9c976052bfb08a20793f0c3013563dc095c966
      AKP_LOCAL_AGENT_DTYPE: q4
      AKP_LOCAL_AGENT_PORT: "18083"
      AKP_READER_QA_NLI_BASE_URL: http://127.0.0.1:18083/chat/completions
      AKP_READER_QA_NLI_MODEL: onnx-community/Qwen2.5-1.5B-Instruct
      AKP_READER_QA_NLI_MODEL_REVISION: 9f9c976052bfb08a20793f0c3013563dc095c966
      AKP_READER_QA_NLI_DTYPE: q4
      AKP_READER_QA_NLI_FRESH_DEV_REPORT: reports/ci/reader-qa-nli-fallback-fresh-dev.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Validate frozen heterogeneous fallback worker
        run: |
          pnpm exec prettier --check \
            evals/generic/reader-qa-nli-fallback-fresh-dev/manifest.json \
            evals/generic/reader-qa-nli-fallback-fresh-dev/domains/*.json \
            scripts/evidence-admission-reader-qa-nli-fallback-fresh-dev-experiment.ts \
            .github/workflows/evidence-admission-reader-qa-nli-fallback-fresh-dev.yml
          pnpm check

      - name: Build provider workspace dependency
        run: pnpm --filter @akp/contracts build

      - name: Prepare experiment evidence
        run: mkdir -p reports/ci "$AKP_MODEL_CACHE_DIR"

      - name: Start pinned 1.5B local reader provider
        shell: bash
        run: |
          pnpm --filter @akp/retrieval exec tsx scripts/local-agent-provider.ts \
            > reports/ci/reader-qa-nli-fallback-provider.log 2>&1 &
          echo $! > /tmp/reader-qa-nli-provider.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:18083/health \
              > reports/ci/reader-qa-nli-provider-health.json; then
              cat reports/ci/reader-qa-nli-provider-health.json
              exit 0
            fi
            sleep 5
          done
          cat reports/ci/reader-qa-nli-fallback-provider.log >&2
          exit 1

      - name: Execute frozen reader plus QA-NLI fallback gate
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/evidence-admission-reader-qa-nli-fallback-fresh-dev-experiment.ts \
            2>&1 | tee reports/ci/reader-qa-nli-fallback-fresh-dev.log

      - name: Validate governed development outcome
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync(
              "reports/ci/reader-qa-nli-fallback-fresh-dev.json",
              "utf8",
            ),
          );
          const health = JSON.parse(
            readFileSync(
              "reports/ci/reader-qa-nli-provider-health.json",
              "utf8",
            ),
          );
          if (
            ![
              "PROCEED_TO_FRESH_HOLDOUT",
              "REJECT_FRESH_DEVELOPMENT_FRONTIER",
            ].includes(report.outcome)
          ) {
            throw new Error("Reader plus QA-NLI development outcome is invalid.");
          }
          if (
            report.heldoutEvaluated !== false ||
            report.candidateCanCreateSupport !== false ||
            report.runtimeChanged !== false ||
            report.productionAdmissionChanged !== false
          ) {
            throw new Error("Heterogeneous fallback crossed its claim boundary.");
          }
          if (
            report.gates?.candidateAdmissionsSubsetOfBaseline !== true ||
            report.gates?.allReaderSupportsSourceBound !== true ||
            report.gates?.allFallbackSpansSourceBound !== true
          ) {
            throw new Error("Heterogeneous fallback invariants failed.");
          }
          if (
            health.model !== "onnx-community/Qwen2.5-1.5B-Instruct" ||
            health.revision !==
              "9f9c976052bfb08a20793f0c3013563dc095c966" ||
            health.dtype !== "q4"
          ) {
            throw new Error("Pinned 1.5B reader identity drifted.");
          }
          console.log(
            JSON.stringify(
              {
                outcome: report.outcome,
                baseline: report.baseline,
                candidate: report.candidate,
                gates: report.gates,
                counts: report.counts,
                protocolHash: report.protocolHash,
                dataFreezeCommit: report.dataFreezeCommit,
              },
              null,
              2,
            ),
          );
          NODE

      - name: Upload heterogeneous fallback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-admission-reader-qa-nli-fallback-fresh-dev-${{ github.run_id }}
          path: |
            reports/ci/reader-qa-nli-fallback-fresh-dev.json
            reports/ci/reader-qa-nli-fallback-fresh-dev.log
            reports/ci/reader-qa-nli-provider-health.json
            reports/ci/reader-qa-nli-fallback-provider.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop 1.5B local reader provider
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/reader-qa-nli-provider.pid ]; then
            kill "$(cat /tmp/reader-qa-nli-provider.pid)" 2>/dev/null || true
          fi
