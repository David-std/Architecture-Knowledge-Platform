name: one-shot-rollback-revision-authority-fix

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - name: Apply canonical revision authority patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch-reviews.py
          python /tmp/patch-reviews.py
          git diff --check
          git rm .github/workflows/rollback-revision-authority-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/reviews.ts
          git commit -m "fix(reviews): align canonical revision through recovery"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
