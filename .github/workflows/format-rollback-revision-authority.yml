name: one-shot-format-rollback-revision-authority

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format exactly the new integration test
        run: pnpm exec prettier --write apps/api/test/rollback-revision-authority.integration.test.ts
      - name: Commit formatted test and consume this workflow
        shell: bash
        run: |
          git rm .github/workflows/format-rollback-revision-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/rollback-revision-authority.integration.test.ts
          git diff --cached --check
          git commit -m "style(reviews): format rollback revision authority test"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
