name: p1-profile-runtime-sync

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/v0.4-enterprise-context-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply P1 active-profile compiler binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one marker, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # Persistence binding also carries the vault corpus revision so consumers
          # do not re-query/duplicate vault binding semantics.
          path = 'packages/postgres/src/knowledge-profile-registry.ts'
          replace_once(path,
          '''export interface KnowledgeProfileBinding {
            source: "DURABLE_REVISION" | "LEGACY_UNBOUND";
            revision: KnowledgeProfileRevisionRecord | null;
            legacySchemaProfile: Record<string, unknown>;
          }''',
          '''export interface KnowledgeProfileBinding {
            source: "DURABLE_REVISION" | "LEGACY_UNBOUND";
            revision: KnowledgeProfileRevisionRecord | null;
            legacySchemaProfile: Record<string, unknown>;
            currentRevision: string | null;
          }''')
          replace_once(path,
          '''  const vault = await db.pool.query<{
            schema_profile: unknown;
            active_knowledge_profile_revision_id: string | null;
          }>(
            `
            select schema_profile,active_knowledge_profile_revision_id
              from vaults where space_id=$1 and id=$2
            `,''',
          '''  const vault = await db.pool.query<{
            schema_profile: unknown;
            current_revision: string | null;
            active_knowledge_profile_revision_id: string | null;
          }>(
            `
            select schema_profile,current_revision,active_knowledge_profile_revision_id
              from vaults where space_id=$1 and id=$2
            `,''')
          replace_once(path,
          '''      legacySchemaProfile: asRecord(vaultRow.schema_profile),
            };
          }''',
          '''      legacySchemaProfile: asRecord(vaultRow.schema_profile),
              currentRevision: vaultRow.current_revision,
            };
          }''')
          replace_once(path,
          '''    legacySchemaProfile: asRecord(vaultRow.schema_profile),
          };
          }''',
          '''    legacySchemaProfile: asRecord(vaultRow.schema_profile),
            currentRevision: vaultRow.current_revision,
          };
          }''')

          # Compiler contract: kinds are profile-defined semantic names, not a
          # platform enum. The input carries the exact effective profile revision.
          path = 'packages/compiler/src/contracts.ts'
          replace_once(path,
          '''import { z } from "zod";
          import {
            DocumentArtifact as DocumentArtifactSchema,''',
          '''import { z } from "zod";
          import { KnowledgeProfileV1 } from "@akp/contracts/knowledge-profile";
          import {
            DocumentArtifact as DocumentArtifactSchema,''')
          replace_once(path,
          '''export const KnowledgeKind = z.enum([
            "claim",
            "decision",
            "rule",
            "workflow",
            "concept",
            "example",
            "counterexample",
          ]);
          export type KnowledgeKind = z.infer<typeof KnowledgeKind>;''',
          '''export const KnowledgeKind = z
            .string()
            .regex(/^[A-Za-z][A-Za-z0-9._:-]{0,127}$/);
          export type KnowledgeKind = z.infer<typeof KnowledgeKind>;''')
          marker = '''export type CompilerPolicy = z.infer<typeof CompilerPolicy>;

          export const KnowledgeCompilerInput = z'''
          insert = '''export type CompilerPolicy = z.infer<typeof CompilerPolicy>;

          export const CompilerKnowledgeProfileContext = z
            .object({
              source: z.enum(["DURABLE_REVISION", "V03_DEFAULT"]),
              revisionId: z.string().uuid().nullable(),
              profileHash: Sha256,
              profile: KnowledgeProfileV1,
            })
            .strict()
            .superRefine((context, refinement) => {
              if (context.source === "DURABLE_REVISION" && !context.revisionId) {
                refinement.addIssue({
                  code: z.ZodIssueCode.custom,
                  path: ["revisionId"],
                  message: "durable profile bindings require a revision id",
                });
              }
              if (context.source === "V03_DEFAULT" && context.revisionId) {
                refinement.addIssue({
                  code: z.ZodIssueCode.custom,
                  path: ["revisionId"],
                  message: "v0.3 default profile bindings cannot claim a durable revision",
                });
              }
            });
          export type CompilerKnowledgeProfileContext = z.infer<
            typeof CompilerKnowledgeProfileContext
          >;

          export const KnowledgeCompilerInput = z'''
          replace_once(path, marker, insert)
          replace_once(path,
          '''    existingCandidates: z.array(ExistingKnowledgeCandidate).max(50),
            schemaProfile: z.record(z.string(), z.unknown()).default({}),''',
          '''    existingCandidates: z.array(ExistingKnowledgeCandidate).max(50),
            knowledgeProfile: CompilerKnowledgeProfileContext,
            schemaProfile: z.record(z.string(), z.unknown()).default({}),''')
          replace_once(path,
          '''    if (input.existingCandidates.length > input.budget.maxExistingCandidates) {
              context.addIssue({
                code: z.ZodIssueCode.custom,
                path: ["existingCandidates"],
                message: "existing knowledge candidates exceed configured budget",
              });
            }
            for (const evidence of input.evidence) {''',
          '''    if (input.existingCandidates.length > input.budget.maxExistingCandidates) {
              context.addIssue({
                code: z.ZodIssueCode.custom,
                path: ["existingCandidates"],
                message: "existing knowledge candidates exceed configured budget",
              });
            }
            const declaredKinds = new Set(
              Object.keys(input.knowledgeProfile.profile.knowledgeKinds),
            );
            for (const kind of input.policy.allowedKnowledgeKinds) {
              if (!declaredKinds.has(kind)) {
                context.addIssue({
                  code: z.ZodIssueCode.custom,
                  path: ["policy", "allowedKnowledgeKinds"],
                  message: `compiler policy allows a kind not declared by the active profile: ${kind}`,
                });
              }
            }
            for (const evidence of input.evidence) {''')

          # Runtime normalization enforces the active profile's kind and evidence
          # policy after provider output, before a review plan can exist.
          path = 'packages/compiler/src/grounding.ts'
          replace_once(path,
          '''    if (!input.policy.allowedKnowledgeKinds.includes(candidate.kind)) {
              throw new Error(`COMPILER_KIND_NOT_ALLOWED:${candidate.kind}`);
            }
            assertEvidenceReferences(''',
          '''    if (!input.policy.allowedKnowledgeKinds.includes(candidate.kind)) {
              throw new Error(`COMPILER_KIND_NOT_ALLOWED:${candidate.kind}`);
            }
            const kindDefinition =
              input.knowledgeProfile.profile.knowledgeKinds[candidate.kind];
            if (!kindDefinition) {
              throw new Error(`COMPILER_PROFILE_KIND_NOT_DECLARED:${candidate.kind}`);
            }
            const evidencePolicy =
              input.knowledgeProfile.profile.evidencePolicies[
                kindDefinition.evidencePolicy
              ];
            if (!evidencePolicy) {
              throw new Error(
                `COMPILER_PROFILE_EVIDENCE_POLICY_MISSING:${candidate.kind}`,
              );
            }
            if (
              new Set(candidate.evidenceIds).size < evidencePolicy.minimumEvidence
            ) {
              throw new Error(
                `COMPILER_PROFILE_EVIDENCE_MINIMUM:${candidate.kind}:${evidencePolicy.minimumEvidence}`,
              );
            }
            const reviewPolicy =
              input.knowledgeProfile.profile.reviewPolicies[
                kindDefinition.reviewPolicy
              ];
            if (!reviewPolicy) {
              throw new Error(
                `COMPILER_PROFILE_REVIEW_POLICY_MISSING:${candidate.kind}`,
              );
            }
            if (reviewPolicy.required && !input.policy.reviewRequired) {
              throw new Error(`COMPILER_PROFILE_REVIEW_REQUIRED:${candidate.kind}`);
            }
            assertEvidenceReferences(''')

          # Grounded compilation receives the exact effective profile and derives
          # provider allowed kinds from that profile rather than global defaults.
          path = 'apps/worker/src/knowledge-compilation.ts'
          replace_once(path,
          '''  type CompilerEvidence,
            type ConfiguredKnowledgeCompiler,''',
          '''  type CompilerEvidence,
            type CompilerKnowledgeProfileContext,
            type ConfiguredKnowledgeCompiler,''')
          replace_once(path,
          '''  evidence: CompilerEvidence[];
            schemaProfile: Record<string, unknown>;
            corpusRevision: string;''',
          '''  evidence: CompilerEvidence[];
            knowledgeProfile: CompilerKnowledgeProfileContext;
            schemaProfile: Record<string, unknown>;
            corpusRevision: string;''')
          replace_once(path,
          '''    existingCandidates: retrieval.candidates,
            schemaProfile: request.schemaProfile,
            policy: {
              reviewRequired: true,
              allowDirectPublication: false,
            },''',
          '''    existingCandidates: retrieval.candidates,
            knowledgeProfile: request.knowledgeProfile,
            schemaProfile: request.schemaProfile,
            policy: {
              reviewRequired: true,
              allowDirectPublication: false,
              allowedKnowledgeKinds: Object.keys(
                request.knowledgeProfile.profile.knowledgeKinds,
              ),
            },''')

          # Worker resolves the durable profile binding once and supplies that exact
          # revision/hash/profile to the compiler. No second semantic authority is
          # introduced in PostgreSQL.
          path = 'apps/worker/src/compilation-stage.ts'
          replace_once(path,
          '''import {
            CompilationPlan,
            type ConfiguredKnowledgeCompiler,
            type KnowledgeCompilerResult,
          } from "@akp/compiler";
          import { StructuralLocator, type DocumentArtifact } from "@akp/contracts";''',
          '''import { createHash } from "node:crypto";
          import {
            CompilationPlan,
            type CompilerKnowledgeProfileContext,
            type ConfiguredKnowledgeCompiler,
            type KnowledgeCompilerResult,
          } from "@akp/compiler";
          import { StructuralLocator, type DocumentArtifact } from "@akp/contracts";
          import {
            DEFAULT_KNOWLEDGE_PROFILE_V1,
            KnowledgeProfileV1,
            canonicalKnowledgeProfileJson,
          } from "@akp/contracts/knowledge-profile";''')
          replace_once(path,
          '''import { resolveAuthorizedVaultScope, type Postgres } from "@akp/postgres";''',
          '''import {
            resolveAuthorizedVaultScope,
            resolveKnowledgeProfileBinding,
            type Postgres,
          } from "@akp/postgres";''')
          replace_once(path,
          '''interface VaultRow {
            schema_profile: Record<string, unknown>;
            current_revision: string | null;
          }

          interface PriorSourceRow {''',
          '''interface PriorSourceRow {''')
          old = '''async function loadVaultContext(
            db: Postgres,
            spaceId: string,
            vaultId: string | null,
          ): Promise<{ schemaProfile: Record<string, unknown>; corpusRevision: string }> {
            if (!vaultId) {
              return { schemaProfile: {}, corpusRevision: "managed:initial" };
            }
            const result = await db.pool.query<VaultRow>(
              `
              select schema_profile,current_revision
                from vaults
               where id=$1 and space_id=$2 and enabled
               limit 1
              `,
              [vaultId, spaceId],
            );
            const row = result.rows[0];
            if (!row) throw new Error("COMPILER_VAULT_NOT_FOUND");
            return {
              schemaProfile: row.schema_profile ?? {},
              corpusRevision: row.current_revision ?? "managed:initial",
            };
          }'''
          new = '''function profileHash(profile: unknown): string {
            return createHash("sha256")
              .update(canonicalKnowledgeProfileJson(profile))
              .digest("hex");
          }

          function defaultProfileContext(): CompilerKnowledgeProfileContext {
            return {
              source: "V03_DEFAULT",
              revisionId: null,
              profileHash: profileHash(DEFAULT_KNOWLEDGE_PROFILE_V1),
              profile: DEFAULT_KNOWLEDGE_PROFILE_V1,
            };
          }

          async function loadVaultContext(
            db: Postgres,
            spaceId: string,
            vaultId: string | null,
          ): Promise<{
            schemaProfile: Record<string, unknown>;
            corpusRevision: string;
            knowledgeProfile: CompilerKnowledgeProfileContext;
          }> {
            if (!vaultId) {
              return {
                schemaProfile: {},
                corpusRevision: "managed:initial",
                knowledgeProfile: defaultProfileContext(),
              };
            }
            const binding = await resolveKnowledgeProfileBinding(db, spaceId, vaultId);
            if (!binding.revision) {
              return {
                schemaProfile: binding.legacySchemaProfile,
                corpusRevision: binding.currentRevision ?? "managed:initial",
                knowledgeProfile: defaultProfileContext(),
              };
            }
            const profile = KnowledgeProfileV1.parse(binding.revision.profile);
            const computedHash = profileHash(profile);
            if (computedHash !== binding.revision.profileHash) {
              throw new Error("ACTIVE_KNOWLEDGE_PROFILE_HASH_MISMATCH");
            }
            return {
              schemaProfile: binding.legacySchemaProfile,
              corpusRevision: binding.currentRevision ?? "managed:initial",
              knowledgeProfile: {
                source: "DURABLE_REVISION",
                revisionId: binding.revision.id,
                profileHash: binding.revision.profileHash,
                profile,
              },
            };
          }'''
          replace_once(path, old, new)
          replace_once(path,
          '''        evidence: [evidence],
            schemaProfile: vault.schemaProfile,
            corpusRevision: vault.corpusRevision,''',
          '''        evidence: [evidence],
            knowledgeProfile: vault.knowledgeProfile,
            schemaProfile: vault.schemaProfile,
            corpusRevision: vault.corpusRevision,''')

          # Focused tests: default binding is visible to the provider and a custom
          # profile cannot smuggle global v0.3 kinds back through compiler policy.
          path = 'packages/compiler/test/compiler-contract.test.ts'
          replace_once(path,
          '''import { describe, expect, it, vi } from "vitest";
          import {''',
          '''import { createHash } from "node:crypto";
          import { describe, expect, it, vi } from "vitest";
          import {
            DEFAULT_KNOWLEDGE_PROFILE_V1,
            NEUTRAL_KNOWLEDGE_PROFILE_V1,
            canonicalKnowledgeProfileJson,
          } from "@akp/contracts/knowledge-profile";
          import {''')
          marker = '''function compilerInput() {
            return KnowledgeCompilerInput.parse({'''
          helper = '''function profileContext(
            profile = DEFAULT_KNOWLEDGE_PROFILE_V1,
            source: "DURABLE_REVISION" | "V03_DEFAULT" = "V03_DEFAULT",
          ) {
            return {
              source,
              revisionId:
                source === "DURABLE_REVISION"
                  ? "77777777-7777-4777-8777-777777777777"
                  : null,
              profileHash: createHash("sha256")
                .update(canonicalKnowledgeProfileJson(profile))
                .digest("hex"),
              profile,
            };
          }

          function compilerInput() {
            return KnowledgeCompilerInput.parse({'''
          replace_once(path, marker, helper)
          replace_once(path,
          '''    existingCandidates: [
              {''',
          '''    knowledgeProfile: profileContext(),
            existingCandidates: [
              {''')
          insert_after = '''  it("rejects unbounded/unknown root fields", () => {
            expect(() =>
              KnowledgeCompilerInput.parse({ ...compilerInput(), surprise: true }),
            ).toThrow();
          });'''
          addition = insert_after + '''

            it("rejects compiler kinds that are not declared by the active profile", () => {
              expect(() =>
                KnowledgeCompilerInput.parse({
                  ...compilerInput(),
                  knowledgeProfile: profileContext(
                    NEUTRAL_KNOWLEDGE_PROFILE_V1,
                    "DURABLE_REVISION",
                  ),
                  policy: {
                    reviewRequired: true,
                    allowDirectPublication: false,
                    allowedKnowledgeKinds: ["rule"],
                  },
                }),
              ).toThrow(/not declared by the active profile/);
            });'''
          replace_once(path, insert_after, addition)

          path = 'apps/worker/test/compilation-stage.test.ts'
          replace_once(path,
          '''    expect(compile.mock.calls[0]?.[0]).toMatchObject({
              spaceId: SPACE_ID,
              vaultId: VAULT_ID,''',
          '''    expect(compile.mock.calls[0]?.[0]).toMatchObject({
              spaceId: SPACE_ID,
              vaultId: VAULT_ID,
              knowledgeProfile: {
                source: "V03_DEFAULT",
                revisionId: null,
                profile: { profileId: "default", version: "0.3-compat" },
              },
              policy: {
                allowedKnowledgeKinds: expect.arrayContaining(["rule", "concept"]),
              },''')
          PY
      - name: Format and execute focused P1 tests
        run: |
          pnpm exec prettier --write \
            packages/postgres/src/knowledge-profile-registry.ts \
            packages/compiler/src/contracts.ts \
            packages/compiler/src/grounding.ts \
            packages/compiler/test/compiler-contract.test.ts \
            apps/worker/src/knowledge-compilation.ts \
            apps/worker/src/compilation-stage.ts \
            apps/worker/test/compilation-stage.test.ts
          pnpm --filter @akp/contracts test
          pnpm --filter @akp/compiler test
          pnpm --filter @akp/worker test
          pnpm --filter @akp/compiler typecheck
          pnpm --filter @akp/worker typecheck
          pnpm exec prettier --check \
            packages/postgres/src/knowledge-profile-registry.ts \
            packages/compiler/src/contracts.ts \
            packages/compiler/src/grounding.ts \
            packages/compiler/test/compiler-contract.test.ts \
            apps/worker/src/knowledge-compilation.ts \
            apps/worker/src/compilation-stage.ts \
            apps/worker/test/compilation-stage.test.ts
      - name: Commit validated runtime slice and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/p1-profile-runtime-sync.yml
          git config user.name "David"
          git config user.email "165101013+David-std@users.noreply.github.com"
          git add \
            packages/postgres/src/knowledge-profile-registry.ts \
            packages/compiler/src/contracts.ts \
            packages/compiler/src/grounding.ts \
            packages/compiler/test/compiler-contract.test.ts \
            apps/worker/src/knowledge-compilation.ts \
            apps/worker/src/compilation-stage.ts \
            apps/worker/test/compilation-stage.test.ts \
            .github/workflows/p1-profile-runtime-sync.yml
          git diff --cached --check
          git commit -m "feat(p1): bind active knowledge profile into compiler"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace
