name: connector-format-apply-once

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - .github/workflows/connector-format-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply canonical connector formatting and consume staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$GITHUB_SHA"
          pnpm exec prettier --write             apps/api/src/routes/context-fabric.ts             contracts/openapi.yaml             docs/context-fabric.md             packages/contracts/src/connector-capabilities.ts
          rm -f .github/workflows/connector-format-diagnostic.yml
          rm -f .github/workflows/connector-format-apply-once.yml
          git add             apps/api/src/routes/context-fabric.ts             contracts/openapi.yaml             docs/context-fabric.md             packages/contracts/src/connector-capabilities.ts             .github/workflows
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(p2): apply canonical connector formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
