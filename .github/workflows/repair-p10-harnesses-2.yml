name: repair-p10-harnesses-2

on:
  push:
    branches: [work/product-completion-final]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply verified second-pass P10 harness corrections
        shell: python
        run: |
          from pathlib import Path

          scale = Path("scripts/load-scale-benchmark.ts")
          text = scale.read_text(encoding="utf-8")
          old_series = "from generate_series($6::int,$7::int) as generated(i)"
          new_series = "from generate_series($5::int,$6::int) as generated(i)"
          if old_series not in text:
              raise SystemExit("expected embedding generate_series placeholders were not found")
          text = text.replace(old_series, new_series, 1)
          old_args = '''      fixture.embeddingGenerationId,\n      fixture.runId,\n      start,\n      end,'''
          new_args = '''      fixture.embeddingGenerationId,\n      start,\n      end,'''
          if old_args not in text:
              raise SystemExit("expected orphan embedding argument was not found")
          text = text.replace(old_args, new_args, 1)
          scale.write_text(text, encoding="utf-8")

          event = Path("scripts/event-concurrency-benchmark.ts")
          text = event.read_text(encoding="utf-8")
          cleanup_block = '''async function cleanup(db: Postgres, consumerName: string): Promise<void> {\n  await db.pool.query(\n    "delete from event_delivery_attempts where consumer_name=$1",\n    [consumerName],\n  );\n  await db.pool.query("delete from event_quarantine where consumer_name=$1", [\n    consumerName,\n  ]);\n  await db.pool.query("delete from event_deliveries where consumer_name=$1", [\n    consumerName,\n  ]);\n  await db.pool.query("delete from event_consumers where consumer_name=$1", [\n    consumerName,\n  ]);\n}\n\n'''
          if cleanup_block not in text:
              raise SystemExit("expected event cleanup function was not found")
          text = text.replace(cleanup_block, "", 1)
          old_finally = '''  } finally {\n    try {\n      await cleanup(db, consumerName);\n    } finally {\n      await db.close();\n    }\n  }'''
          new_finally = '''  } finally {\n    await db.close();\n  }'''
          if old_finally not in text:
              raise SystemExit("expected event cleanup finally block was not found")
          text = text.replace(old_finally, new_finally, 1)
          event.write_text(text, encoding="utf-8")
      - run: pnpm exec prettier --write scripts/load-scale-benchmark.ts scripts/event-concurrency-benchmark.ts
      - name: Verify targeted diff
        shell: bash
        run: |
          git diff --check
          git diff -- scripts/load-scale-benchmark.ts scripts/event-concurrency-benchmark.ts
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "scripts/event-concurrency-benchmark.ts scripts/load-scale-benchmark.ts "
      - name: Commit repaired P10 harnesses
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/load-scale-benchmark.ts scripts/event-concurrency-benchmark.ts
          git commit -m "fix(eval): make P10 harnesses disposable-safe"
          git push origin HEAD:work/product-completion-final
