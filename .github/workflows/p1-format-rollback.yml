name: p1-format-rollback

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - .github/workflows/p1-format-rollback.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format rollback files exactly
        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/profile-activation.ts \
            apps/api/test/profile-rollback.integration.test.ts \
            packages/postgres/test/knowledge-profile-rollback.integration.test.ts
      - name: Verify formatting
        run: pnpm exec prettier --check .
      - uses: actions/upload-artifact@v4
        with:
          name: p1-rollback-prettier-output
          path: |
            apps/api/src/routes/profile-activation.ts
            apps/api/test/profile-rollback.integration.test.ts
            packages/postgres/test/knowledge-profile-rollback.integration.test.ts
