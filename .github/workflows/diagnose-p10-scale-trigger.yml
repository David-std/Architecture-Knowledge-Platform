name: diagnose-p10-scale-trigger

on:
  push:
    branches: [work/product-completion-final]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Apply diagnostic-only trigger and scale fixture corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('db/migrations/027_set_based_embedding_validation.sql')
          text = migration.read_text()
          old = 'drop trigger if exists unit_embeddings_validate_scope on unit_embeddings;'
          new = 'drop trigger if exists unit_embeddings_validate_generation on unit_embeddings;'
          if text.count(old) != 1:
              raise SystemExit(f'027 trigger replacement count={text.count(old)}')
          migration.write_text(text.replace(old, new, 1))

          path = Path('scripts/load-scale-benchmark.ts')
          text = path.read_text()
          old = '''async function insertEmbeddings(
            fixture: FixtureIds,
            start: number,
            end: number,
          ): Promise<number> {
            if (start > end) return 0;
            const batchSize = 10_000;
            let elapsedMs = 0;
            for (let batchStart = start; batchStart <= end; batchStart += batchSize) {
              const batchEnd = Math.min(end, batchStart + batchSize - 1);
              const measured = await timedQuery(
                `insert into unit_embeddings(unit_id,generation_id,content_hash,embedding)
                 select
                   u.id,$4,
                   u.content_hash,
                   $7::vector(64)
                   from generate_series($5::int,$6::int) as generated(i)
                   join knowledge_documents d
                     on d.space_id=$1 and d.vault_id=$2 and d.external_id=$3 || i::text
                   join knowledge_units u
                     on u.document_id=d.id and u.space_id=$1 and u.vault_id=$2
                  on conflict (unit_id,generation_id) do nothing`,
                [
                  fixture.spaceId,
                  fixture.vaultId,
                  fixture.externalPrefix,
                  fixture.embeddingGenerationId,
                  batchStart,
                  batchEnd,
                  `[${Array.from({ length: 64 }, () => "0.01").join(",")}]`,
                ],
              );
              elapsedMs += measured.elapsedMs;
            }
            return elapsedMs;
          }
          '''
          new = '''async function insertEmbeddings(
            fixture: FixtureIds,
            start: number,
            end: number,
          ): Promise<number> {
            if (start > end) return 0;
            const batchSize = 10_000;
            const expected = end - start + 1;
            const vector = `[${Array.from({ length: 64 }, () => "0.01").join(",")}]`;
            let inserted = 0;
            let elapsedMs = 0;
            while (inserted < expected) {
              const measured = await timedQuery<{ unit_id: string }>(
                `with candidates as (
                   select u.id,u.content_hash
                     from knowledge_units u
                    where u.space_id=$1 and u.vault_id=$2
                      and u.corpus_revision='synthetic-v1'
                      and u.embedding_eligible=true
                      and not exists (
                        select 1 from unit_embeddings e
                         where e.unit_id=u.id and e.generation_id=$3
                      )
                    order by u.id
                    limit $4
                 )
                 insert into unit_embeddings(unit_id,generation_id,content_hash,embedding)
                 select c.id,$3,c.content_hash,$5::vector(64)
                   from candidates c
                  on conflict (unit_id,generation_id) do nothing
                 returning unit_id`,
                [
                  fixture.spaceId,
                  fixture.vaultId,
                  fixture.embeddingGenerationId,
                  batchSize,
                  vector,
                ],
              );
              elapsedMs += measured.elapsedMs;
              const batchInserted = measured.result.rowCount ?? 0;
              if (batchInserted === 0) break;
              inserted += batchInserted;
            }
            if (inserted !== expected) {
              throw new Error(
                `synthetic embedding batch cardinality mismatch: expected ${expected}, inserted ${inserted}`,
              );
            }
            return elapsedMs;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'insertEmbeddings replacement count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write scripts/load-scale-benchmark.ts
          git diff --check
      - name: Validate repository
        run: pnpm check
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Prove embedding trigger topology
        shell: bash
        run: |
          docker compose exec -T postgres psql -U akp -d akp -Atc "select tgname from pg_trigger where tgrelid='unit_embeddings'::regclass and not tgisinternal order by tgname" | tee /tmp/triggers.txt
          printf '%s\n' unit_embeddings_validate_insert_statement unit_embeddings_validate_update_statement > /tmp/expected-triggers.txt
          diff -u /tmp/expected-triggers.txt /tmp/triggers.txt
      - name: Validate embedding integration semantics
        run: pnpm --filter @akp/indexing exec vitest run test/embedding-index.integration.test.ts
      - name: Benchmark 10K diagnostic
        shell: bash
        run: |
          mkdir -p reports/diagnostic
          pnpm benchmark:scale -- --output reports/diagnostic/scale-10000.json --targets 10000 --iterations 1
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('reports/diagnostic/scale-10000.json','utf8'));
          console.log(JSON.stringify({status:r.status,failure:r.failure,load:r.results?.[0]?.loadLatencyMs,context:r.results?.[0]?.contextPacket?.latency,cleanup:r.cleanup},null,2));
          if(r.status!=='PASSED'||r.cleanup?.succeeded!==true) process.exit(1);
          NODE
      - name: Benchmark 100K diagnostic
        shell: bash
        run: |
          set +e
          pnpm benchmark:scale -- --output reports/diagnostic/scale-100000.json --targets 100000 --iterations 1
          code=$?
          set -e
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('reports/diagnostic/scale-100000.json','utf8'));
          console.log(JSON.stringify({status:r.status,failure:r.failure,load:r.results?.[0]?.loadLatencyMs,queries:r.results?.[0]?.queryLatency,context:r.results?.[0]?.contextPacket?.latency,rows:r.results?.[0]?.rows,cleanup:r.cleanup},null,2));
          if(r.status!=='PASSED'||r.cleanup?.succeeded!==true||r.results?.[0]?.rows?.embeddings!==100000) process.exit(1);
          NODE
          test "$code" -eq 0
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p10-scale-trigger-diagnostic-${{ github.run_id }}
          path: reports/diagnostic
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
