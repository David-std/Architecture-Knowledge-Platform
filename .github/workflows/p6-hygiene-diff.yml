name: p6-hygiene-diff

on:
  pull_request:

jobs:
  hygiene-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Diff tracked and canonical inventory on PR merge tree
        shell: bash
        run: |
          out="$RUNNER_TEMP/p6-hygiene-diff"
          mkdir -p "$out"
          rm .github/workflows/p6-hygiene-diff.yml
          cp REPOSITORY_FILE_CLASSIFICATION.json "$out/tracked.json"
          set +e
          node scripts/validate-repository-hygiene.mjs --write > "$out/generator.txt" 2>&1
          generator_status=$?
          cp REPOSITORY_FILE_CLASSIFICATION.json "$out/generated.json"
          diff -u "$out/tracked.json" "$out/generated.json" > "$out/diff.txt"
          diff_status=$?
          git status --short > "$out/git-status.txt"
          node scripts/validate-repository-hygiene.mjs > "$out/validation.txt" 2>&1
          validation_status=$?
          printf 'generator=%s\ndiff=%s\nvalidation=%s\n' "$generator_status" "$diff_status" "$validation_status" > "$out/exit-codes.txt"
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: p6-hygiene-diff-${{ github.run_id }}
          path: ${{ runner.temp }}/p6-hygiene-diff
          if-no-files-found: error
          retention-days: 1
