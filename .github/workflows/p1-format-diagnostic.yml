name: p1-format-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Print exact Prettier 3.9.6 diff
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/schema-governance.ts \
            apps/api/test/schema-profile-governance.integration.test.ts \
            packages/contracts/src/knowledge-profile-compatibility.ts \
            packages/postgres/src/knowledge-profile-governance.ts \
            packages/postgres/src/knowledge-profile-registry.ts \
            packages/postgres/test/knowledge-profile-registry.integration.test.ts
          echo '=== PRETTIER DIFF BEGIN ==='
          git diff --no-ext-diff --no-color -- \
            apps/api/src/routes/schema-governance.ts \
            apps/api/test/schema-profile-governance.integration.test.ts \
            packages/contracts/src/knowledge-profile-compatibility.ts \
            packages/postgres/src/knowledge-profile-governance.ts \
            packages/postgres/src/knowledge-profile-registry.ts \
            packages/postgres/test/knowledge-profile-registry.integration.test.ts
          echo '=== PRETTIER DIFF END ==='
