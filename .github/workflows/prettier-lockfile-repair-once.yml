name: prettier-lockfile-repair-once

on:
  push:
    branches:
      - chore/retrieval-generality-policy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format lockfile exactly as repository Prettier expects
        run: pnpm exec prettier --write pnpm-lock.yaml
      - name: Revalidate repaired lockfile
        run: |
          pnpm exec prettier --check pnpm-lock.yaml
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm audit --audit-level high
          git diff --check
      - name: Commit formatted lockfile and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/prettier-lockfile-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/prettier-lockfile-repair-once.yml
          git commit -m "style(lockfile): apply repository prettier"
          git push origin "HEAD:chore/retrieval-generality-policy"
