name: p6-worker-format

on:
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Capture canonical worker test formatting
        run: |
          mkdir -p reports/p6-format
          pnpm exec prettier apps/worker/test/compilation-stage.test.ts > reports/p6-format/compilation-stage.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: p6-worker-format-${{ github.run_id }}
          path: reports/p6-format/compilation-stage.test.ts
          if-no-files-found: error
          retention-days: 1
