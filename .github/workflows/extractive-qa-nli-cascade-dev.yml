name: extractive-qa-nli-cascade-dev

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extractive-qa-nli-cascade-dev:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'experiment/extractive-qa-nli-cascade-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AKP_MODEL_CACHE_DIR: /tmp/akp-model-cache
      AKP_EXTRACTIVE_QA_NLI_CASCADE_DEV_REPORT: reports/ci/extractive-qa-nli-cascade-dev.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Validate development cascade source
        run: |
          pnpm exec prettier --check \
            evals/generic/extractive-qa-nli-cascade-dev/manifest.json \
            scripts/extractive-qa-nli-cascade-dev-experiment.ts \
            .github/workflows/extractive-qa-nli-cascade-dev.yml
          pnpm check
      - name: Execute frozen extractive-QA to NLI development cascade
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci "$AKP_MODEL_CACHE_DIR"
          pnpm exec tsx scripts/extractive-qa-nli-cascade-dev-experiment.ts \
            2>&1 | tee reports/ci/extractive-qa-nli-cascade-dev.log
      - name: Validate governed development outcome
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync("reports/ci/extractive-qa-nli-cascade-dev.json", "utf8"),
          );
          const allowed = new Set([
            "PROCEED_TO_FRESH_HOLDOUT",
            "REJECT_DEVELOPMENT_FRONTIER",
          ]);
          if (!allowed.has(report.outcome)) {
            throw new Error("Invalid cascade outcome: " + String(report.outcome));
          }
          if (
            report.heldoutEvaluated !== false ||
            report.invariants?.allQaSpansSourceBound !== true ||
            report.invariants?.qaInvokedOnlyAfterBaselineAbstention !== true ||
            report.invariants?.qaInvokedOnlyWithSafeSlot !== true ||
            report.invariants?.manualRelationHypothesesUsed !== false ||
            report.invariants?.qaUsedAsAuthority !== false ||
            report.invariants?.generativeReaderUsed !== false ||
            report.invariants?.runtimeChanged !== false ||
            report.invariants?.productionAdmissionChanged !== false
          ) {
            throw new Error("Cascade claim boundary or invariants failed.");
          }
          console.log(
            JSON.stringify(
              {
                outcome: report.outcome,
                baseline: report.baseline,
                selectedBoundary: report.selectedBoundary,
                candidate: report.candidate,
                gates: report.gates,
                counts: report.counts,
              },
              null,
              2,
            ),
          );
          NODE
      - name: Upload development cascade evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extractive-qa-nli-cascade-dev-${{ github.run_id }}
          path: |
            reports/ci/extractive-qa-nli-cascade-dev.json
            reports/ci/extractive-qa-nli-cascade-dev.log
          if-no-files-found: warn
          retention-days: 14
