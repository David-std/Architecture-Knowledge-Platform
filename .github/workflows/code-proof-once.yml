name: code-proof-once

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Check touched formatting
        run: |
          pnpm exec prettier --check             packages/contracts/src/code-graph.ts             packages/contracts/src/federated-graph.ts             packages/contracts/src/index.ts             packages/project-adapter/src             packages/project-adapter/test             packages/postgres/src/federated-graph.ts             packages/postgres/src/outbox.ts             packages/postgres/test/federated-graph.integration.test.ts             contracts/asyncapi.yaml
      - run: docker compose up -d --wait postgres
      - run: pnpm db:migrate
      - run: pnpm contracts:validate
      - run: pnpm --filter @akp/contracts build
      - run: pnpm --filter @akp/project-adapter test
      - run: pnpm --filter @akp/project-adapter build
      - run: pnpm --filter @akp/postgres build
      - name: Run federated graph integration
        run: pnpm --filter @akp/postgres exec vitest run test/federated-graph.integration.test.ts
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
