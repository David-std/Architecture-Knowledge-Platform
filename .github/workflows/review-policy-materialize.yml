name: P1 review policy materializer

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
    paths:
      - scripts/tmp-review-policy-materialize.py
      - .github/workflows/review-policy-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Materialize review-policy candidate
        run: python scripts/tmp-review-policy-materialize.py

      - name: Format candidate
        run: >-
          pnpm exec prettier --write
          packages/compiler/src/grounding.ts
          packages/postgres/src/index.ts
          apps/api/src/auth.ts
          packages/validation/src/index.ts
          apps/api/src/review-policy.ts
          apps/api/src/routes/reviews.ts
          apps/api/test/review-policy.integration.test.ts

      - name: Build workspace packages
        run: pnpm build

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run migrations through review ledger
        run: pnpm db:migrate

      - name: Run review-policy integration
        run: >-
          pnpm --filter @akp/api exec vitest run
          --config vitest.integration.config.ts
          test/review-policy.integration.test.ts

      - name: Run compiler tests
        run: pnpm --filter @akp/compiler test

      - name: Run workspace check
        run: pnpm check

      - name: Promote clean product commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/compiler/src/grounding.ts \
            packages/postgres/src/index.ts \
            apps/api/src/auth.ts \
            packages/validation/src/index.ts \
            apps/api/src/review-policy.ts \
            apps/api/src/routes/reviews.ts \
            apps/api/test/review-policy.integration.test.ts \
            db/migrations/030_review_policy_approvals.sql
          git rm -f .github/workflows/review-policy-materialize.yml scripts/tmp-review-policy-materialize.py
          git diff --cached --check
          git commit -m "feat(p1): enforce profile review policies"
          git push origin HEAD:feat/v0.4-enterprise-context-workspace

      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans || true
