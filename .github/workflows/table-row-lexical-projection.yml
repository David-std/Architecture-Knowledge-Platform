name: table-row-lexical-projection

on:
  push:
    branches:
      - experiment/table-row-lexical-projection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://akp:akp@127.0.0.1:5432/akp
      AKP_TABLE_ROW_PROJECTION_BASELINE_SHA: c96b9e9d07dfa9f19c334344d5d1563851c79a7e
      AKP_TABLE_ROW_PROJECTION_REPORT: .work/table-row-lexical-projection/report.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: docker compose up -d --wait postgres
      - name: Execute table-row lexical representation experiment
        run: pnpm exec tsx scripts/table-row-lexical-projection-experiment.ts
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: table-row-lexical-projection-${{ github.run_id }}
          path: .work/table-row-lexical-projection
          if-no-files-found: warn
      - name: Stop disposable services
        if: always()
        run: docker compose down -v
