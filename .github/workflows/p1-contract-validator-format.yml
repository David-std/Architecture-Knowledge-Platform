name: p1-contract-validator-format

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Print exact Prettier 3.9.6 diff
        shell: bash
        run: |
          pnpm exec prettier --write scripts/validate-contracts.mjs
          echo '=== PRETTIER DIFF BEGIN ==='
          git diff --no-ext-diff --no-color -- scripts/validate-contracts.mjs
          echo '=== PRETTIER DIFF END ==='
