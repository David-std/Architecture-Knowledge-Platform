name: Format reconciled lockfile

on:
  push:
    branches:
      - work/product-completion-final

permissions:
  contents: write

jobs:
  format-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format lockfile with repository Prettier
        run: pnpm exec prettier --write pnpm-lock.yaml
      - name: Commit only formatted lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "style: format reconciled lockfile"
          git push origin HEAD:work/product-completion-final
