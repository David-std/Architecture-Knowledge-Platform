name: semantic-retrieval

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-multilingual-semantic-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_RUN_REAL_MODEL_TESTS: "1"
      AKP_VECTOR_ENABLED: "true"
      AKP_MODEL_CACHE_DIR: /tmp/akp-model-cache
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Fetch exact v0.3 baseline commit
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin \
            a6bdcc38fdf026d6c353db096799366865011022
      - name: Generate v0.3 capability maturity baseline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci
          AKP_CAPABILITY_BASELINE_REPORT=reports/ci/v0.3-capability-maturity-baseline.json \
            pnpm benchmark:capability-baseline \
            2>&1 | tee reports/ci/v0.3-capability-maturity-baseline.log
      - run: pnpm build
      - run: docker compose up -d --wait postgres
      - run: pnpm db:migrate
      - name: Characterize filtered ANN recall under vault and path authorization
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci
          AKP_FILTERED_ANN_REPORT=reports/ci/filtered-ann-baseline.json \
            pnpm benchmark:filtered-ann \
            2>&1 | tee reports/ci/filtered-ann-baseline.log
      - name: Validate filtered ANN evidence boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(
            readFileSync("reports/ci/filtered-ann-baseline.json", "utf8"),
          );
          if (report.status !== "PROVEN") {
            throw new Error(`Filtered ANN measurement status is ${report.status}.`);
          }
          if (report.productionDefaultChanged !== false || report.productionIndexSelected !== false) {
            throw new Error("Filtered ANN characterization must not change or select a production default.");
          }
          if (report.fixture?.duplicateIdentifiersAcrossVaults !== true || report.fixture?.duplicateTextAcrossVaults !== true) {
            throw new Error("Filtered ANN fixture must include cross-vault identifier and text collisions.");
          }
          const measurements = Array.isArray(report.measurements) ? report.measurements : [];
          for (const measurement of measurements) {
            if (measurement.leakageCount !== 0) {
              throw new Error(`Authorization leakage observed in ${measurement.scenario}/${measurement.mode}.`);
            }
            if (!Number.isFinite(measurement.meanRecallAtK) || !Number.isFinite(measurement.minimumRecallAtK)) {
              throw new Error(`Missing recall evidence for ${measurement.scenario}/${measurement.mode}.`);
            }
          }
          const modes = new Set(measurements.map((item) => item.mode));
          for (const requiredMode of ["HNSW_FILTERED", "HNSW_PARTIAL"]) {
            if (!modes.has(requiredMode)) {
              throw new Error(`Filtered ANN baseline is missing ${requiredMode}.`);
            }
          }
          if (report.iterativeScanSupported === true && !modes.has("HNSW_ITERATIVE")) {
            throw new Error("pgvector supports iterative scan but the baseline did not measure it.");
          }
          console.log(JSON.stringify({
            pgvectorVersion: report.pgvectorVersion,
            iterativeScanSupported: report.iterativeScanSupported,
            measurements,
            alternatives: report.alternatives,
          }, null, 2));
          NODE
      - name: Execute pinned multilingual semantic retrieval end to end
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci "$AKP_MODEL_CACHE_DIR"
          pnpm --filter @akp/api exec vitest run \
            --config vitest.integration.config.ts \
            test/real-semantic-retrieval.integration.test.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=../../reports/ci/semantic-retrieval-junit.xml \
            2>&1 | tee reports/ci/semantic-retrieval.log
      - name: Execute retrieval matrix through the real runtime pipeline
        shell: bash
        run: |
          set -o pipefail
          AKP_RUNTIME_RETRIEVAL_REPORT=reports/ci/runtime-retrieval-benchmark.json \
            pnpm benchmark:retrieval:runtime \
            2>&1 | tee reports/ci/runtime-retrieval-benchmark.log
      - name: Execute registered public corpus retrieval benchmark
        shell: bash
        run: |
          set -o pipefail
          AKP_REGISTERED_RETRIEVAL_REPORT=reports/ci/registered-corpus-retrieval-benchmark.json \
            pnpm benchmark:retrieval:registered \
            2>&1 | tee reports/ci/registered-corpus-retrieval-benchmark.log
      - name: Capture semantic retrieval diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports/ci
          docker compose ps --all > reports/ci/semantic-docker-compose-ps.txt 2>&1
          docker compose logs --no-color --timestamps postgres \
            > reports/ci/semantic-postgres.log 2>&1
          docker compose exec -T postgres psql -X -U akp -d akp \
            -c "\\copy (select provider,model,model_revision,dimensions,input_strategy,status,count(*) over () as generation_rows from embedding_generations order by created_at desc) to stdout with csv header" \
            > reports/ci/semantic-generations.csv 2>&1
      - name: Upload semantic retrieval evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-retrieval-${{ github.run_id }}
          path: reports/ci
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
