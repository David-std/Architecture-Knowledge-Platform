name: semantic-retrieval

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-multilingual-semantic-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_RUN_REAL_MODEL_TESTS: "1"
      AKP_VECTOR_ENABLED: "true"
      AKP_MODEL_CACHE_DIR: /tmp/akp-model-cache
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Warm pinned multilingual semantic model cache
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci "$AKP_MODEL_CACHE_DIR"
          pnpm exec tsx scripts/preload-semantic-model.ts \
            2>&1 | tee reports/ci/semantic-model-prefetch.log
          echo "AKP_LOCAL_FILES_ONLY=1" >> "$GITHUB_ENV"
      - name: Fetch exact v0.3 baseline commit
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin \
            a6bdcc38fdf026d6c353db096799366865011022
      - name: Generate v0.3 capability maturity baseline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci
          AKP_CAPABILITY_BASELINE_REPORT=reports/ci/v0.3-capability-maturity-baseline.json \
            pnpm benchmark:capability-baseline \
            2>&1 | tee reports/ci/v0.3-capability-maturity-baseline.log
      - run: pnpm build
      - run: docker compose up -d --wait postgres
      - run: pnpm db:migrate
      - name: Characterize filtered ANN recall under vault and path authorization
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci
          AKP_FILTERED_ANN_REPORT=reports/ci/filtered-ann-baseline.json \
            pnpm benchmark:filtered-ann \
            2>&1 | tee reports/ci/filtered-ann-baseline.log
      - name: Validate filtered ANN evidence boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(
            readFileSync("reports/ci/filtered-ann-baseline.json", "utf8"),
          );
          if (report.status !== "PROVEN") {
            throw new Error(`Filtered ANN measurement status is ${report.status}.`);
          }
          if (report.productionDefaultChanged !== false || report.productionIndexSelected !== false) {
            throw new Error("Filtered ANN characterization must not change or select a production default.");
          }
          if (report.fixture?.duplicateIdentifiersAcrossVaults !== true || report.fixture?.duplicateTextAcrossVaults !== true) {
            throw new Error("Filtered ANN fixture must include cross-vault identifier and text collisions.");
          }
          const measurements = Array.isArray(report.measurements) ? report.measurements : [];
          for (const measurement of measurements) {
            if (measurement.leakageCount !== 0) {
              throw new Error(`Authorization leakage observed in ${measurement.scenario}/${measurement.mode}.`);
            }
            if (!Number.isFinite(measurement.meanRecallAtK) || !Number.isFinite(measurement.minimumRecallAtK)) {
              throw new Error(`Missing recall evidence for ${measurement.scenario}/${measurement.mode}.`);
            }
            if (
              !Number.isFinite(measurement.p50LatencyMs) ||
              !Number.isFinite(measurement.p95LatencyMs) ||
              measurement.p50LatencyMs < 0 ||
              measurement.p95LatencyMs < measurement.p50LatencyMs ||
              !Number.isInteger(measurement.latencySamples) ||
              measurement.latencySamples < measurement.queries
            ) {
              throw new Error(`Missing p50/p95 latency evidence for ${measurement.scenario}/${measurement.mode}.`);
            }
          }
          const candidateScan = report.candidateScanMeasurement;
          const measuredCandidateScan =
            candidateScan?.status === "MEASURED" &&
            Number.isFinite(candidateScan?.candidatesScanned) &&
            candidateScan.candidatesScanned >= 0;
          const unavailableCandidateScan =
            candidateScan?.status === "UNAVAILABLE" &&
            candidateScan?.candidatesScanned === null &&
            typeof candidateScan?.reason === "string" &&
            candidateScan.reason.length > 0;
          if (!measuredCandidateScan && !unavailableCandidateScan) {
            throw new Error("Candidate scan evidence must be measured when available or explicitly report why unavailable.");
          }
          const broad = measurements.find(
            (item) => item.scenario === "VAULT_FILTER" && item.mode === "HNSW_FILTERED",
          );
          const selective = measurements.find(
            (item) => item.scenario === "VAULT_PLUS_PATH_ACL" && item.mode === "HNSW_FILTERED",
          );
          for (const measurement of measurements) {
            if (
              !Number.isInteger(measurement.fixtureRows) ||
              !Number.isInteger(measurement.eligibleRows) ||
              measurement.fixtureRows <= 0 ||
              measurement.eligibleRows <= 0 ||
              !Number.isFinite(measurement.selectivityRatio) ||
              measurement.selectivityRatio <= 0 ||
              measurement.selectivityRatio > 1
            ) {
              throw new Error(`Missing filter selectivity evidence for ${measurement.scenario}/${measurement.mode}.`);
            }
          }
          if (!broad || !selective || selective.selectivityRatio >= broad.selectivityRatio) {
            throw new Error("Path ACL scenario must be measurably more selective than the broad vault filter.");
          }
          const modes = new Set(measurements.map((item) => item.mode));
          for (const requiredMode of ["HNSW_FILTERED", "HNSW_PARTIAL"]) {
            if (!modes.has(requiredMode)) {
              throw new Error(`Filtered ANN baseline is missing ${requiredMode}.`);
            }
          }
          if (report.iterativeScanSupported === true && !modes.has("HNSW_ITERATIVE")) {
            throw new Error("pgvector supports iterative scan but the baseline did not measure it.");
          }
          console.log(JSON.stringify({
            pgvectorVersion: report.pgvectorVersion,
            iterativeScanSupported: report.iterativeScanSupported,
            measurements,
            alternatives: report.alternatives,
          }, null, 2));
          NODE
      - name: Execute pinned multilingual semantic retrieval end to end
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ci "$AKP_MODEL_CACHE_DIR"
          pnpm --filter @akp/api exec vitest run \
            --config vitest.integration.config.ts \
            test/real-semantic-retrieval.integration.test.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=../../reports/ci/semantic-retrieval-junit.xml \
            2>&1 | tee reports/ci/semantic-retrieval.log
      - name: Execute retrieval matrix through the real runtime pipeline
        shell: bash
        run: |
          set -o pipefail
          AKP_RUNTIME_RETRIEVAL_REPORT=reports/ci/runtime-retrieval-benchmark.json \
            pnpm benchmark:retrieval:runtime \
            2>&1 | tee reports/ci/runtime-retrieval-benchmark.log
      - name: Measure baseline ContextPacket placement
        shell: bash
        run: |
          set -o pipefail
          AKP_CONTEXT_PLACEMENT_REPORT=reports/ci/context-placement-baseline.json \
            pnpm benchmark:context-placement \
            2>&1 | tee reports/ci/context-placement-baseline.log
      - name: Benchmark contextual chunk embedding strategies
        shell: bash
        run: |
          set -o pipefail
          AKP_CONTEXTUAL_CHUNK_REPORT=reports/ci/contextual-chunk-benchmark.json \
            pnpm benchmark:contextual-chunks \
            2>&1 | tee reports/ci/contextual-chunk-benchmark.log
      - name: Generate consolidated baseline evidence envelope
        shell: bash
        run: |
          set -o pipefail
          AKP_BASELINE_EVIDENCE_REPORT=reports/ci/baseline-evidence.json \
            pnpm proof:baseline-evidence \
            2>&1 | tee reports/ci/baseline-evidence.log
      - name: Validate incremental vector update evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(
            readFileSync("reports/ci/runtime-retrieval-benchmark.json", "utf8"),
          );
          const runs = Array.isArray(report.runs) ? report.runs : [];
          const vectorRuns = runs.filter((run) => run.vectorEnabled === true);
          if (vectorRuns.length === 0) {
            throw new Error("Runtime retrieval benchmark produced no vector-enabled configurations.");
          }
          for (const run of vectorRuns) {
            const update = run.indexBuildUpdate?.updateEvidence;
            if (
              update?.measured !== true ||
              !Number.isFinite(update.milliseconds) ||
              update.milliseconds < 0 ||
              !Number.isInteger(update.unitCount) ||
              update.unitCount < 2 ||
              update.changedUnits !== 1 ||
              update.embeddingsCreated !== 1 ||
              update.embeddingsReused !== update.unitCount - 1
            ) {
              throw new Error(
                `Vector configuration ${run.configurationName} lacks valid incremental update-cost evidence.`,
              );
            }
          }
          console.log(JSON.stringify({
            vectorConfigurations: vectorRuns.map((run) => run.configurationName),
            updateEvidence: vectorRuns[0]?.indexBuildUpdate?.updateEvidence ?? null,
          }, null, 2));
          NODE
      - name: Execute registered public corpus retrieval benchmark
        shell: bash
        run: |
          set -o pipefail
          AKP_REGISTERED_RETRIEVAL_REPORT=reports/ci/registered-corpus-retrieval-benchmark.json \
            pnpm benchmark:retrieval:registered \
            2>&1 | tee reports/ci/registered-corpus-retrieval-benchmark.log
      - name: Build honest competitive arena report
        shell: bash
        run: |
          set -o pipefail
          AKP_COMPETITIVE_RETRIEVAL_REPORT=reports/ci/registered-corpus-retrieval-benchmark.json \
          AKP_COMPETITIVE_ARENA_REPORT=reports/ci/competitive-arena.json \
          AKP_COMPETITIVE_ARENA_MARKDOWN=reports/ci/competitive-arena.md \
            pnpm benchmark:competitive \
            2>&1 | tee reports/ci/competitive-arena.log
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync("reports/ci/competitive-arena.json", "utf8"),
          );
          if (
            report.superiorityClaimAllowed !== false ||
            report.winner !== null ||
            !report.coverage?.executed?.includes("akp-v0.4-baseline-channels")
          ) {
            throw new Error("Competitive arena evidence discipline failed.");
          }
          const falselyExecuted = (report.systems ?? []).filter(
            (system) =>
              system.id !== "akp-v0.4-baseline-channels" &&
              system.executionStatus === "EXECUTED",
          );
          if (falselyExecuted.length) {
            throw new Error(
              "External/reference systems were falsely marked executed: " +
                falselyExecuted.map((system) => system.id).join(", "),
            );
          }
          const reproducibility = report.benchmarkEvidence?.reproducibility;
          if (
            typeof reproducibility?.tool?.repositoryUrl !== "string" ||
            typeof reproducibility?.tool?.versionOrCommit !== "string" ||
            reproducibility.tool.versionOrCommit !== process.env.GITHUB_SHA ||
            typeof reproducibility?.tool?.licenseObserved !== "string" ||
            !/^[a-f0-9]{64}$/.test(reproducibility?.fixture?.sha256 ?? "") ||
            !/^[a-f0-9]{64}$/.test(
              reproducibility?.configuration?.sha256 ?? "",
            ) ||
            typeof reproducibility?.environment?.node !== "string" ||
            typeof reproducibility?.environment?.postgres !== "string" ||
            !Number.isInteger(reproducibility?.environment?.logicalCpuCount) ||
            reproducibility.environment.logicalCpuCount < 1 ||
            !Number.isFinite(reproducibility?.environment?.totalMemoryBytes) ||
            reproducibility.environment.totalMemoryBytes <= 0 ||
            reproducibility?.invocation !==
              "pnpm benchmark:retrieval:registered"
          ) {
            throw new Error(
              "Competitive benchmark reproducibility descriptor is incomplete.",
            );
          }
          const ablation = report.benchmarkEvidence?.ablation;
          const requiredStages = new Set([
            "BASELINE_EXACT_LEXICAL",
            "ADD_DENSE",
            "ADD_TYPED_GRAPH",
            "ADD_RERANK",
            "ADD_PPR",
            "ADD_COMMUNITY",
          ]);
          for (const entry of ablation?.entries ?? []) {
            if (!requiredStages.delete(entry.stage)) {
              throw new Error(
                "Unexpected or duplicate retrieval ablation stage: " +
                  String(entry.stage),
              );
            }
            for (const value of [
              entry.quality?.recallAt10,
              entry.quality?.mrr,
              entry.quality?.ndcgAt10,
              entry.deltaVsBaseline?.recallAt10,
              entry.deltaVsBaseline?.mrr,
              entry.deltaVsBaseline?.ndcgAt10,
              entry.latency?.meanMs,
              entry.latency?.deltaVsBaselineMs,
              entry.storage?.attributedBytes,
            ]) {
              if (!Number.isFinite(value)) {
                throw new Error(
                  "Retrieval ablation contains an unmeasured required value.",
                );
              }
            }
            if (entry.storage.attributedBytes < 0) {
              throw new Error("Retrieval ablation storage cost is negative.");
            }
          }
          if (requiredStages.size !== 0) {
            throw new Error(
              "Retrieval ablation is missing stages: " +
                [...requiredStages].join(", "),
            );
          }
          if (
            ablation?.optionalChannels?.lateInteraction?.status !==
              "NOT_RETAINED" ||
            typeof ablation.optionalChannels.lateInteraction.reason !== "string"
          ) {
            throw new Error(
              "Late-interaction ablation status must remain explicit.",
            );
          }
          NODE
      - name: Capture semantic retrieval diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reports/ci
          docker compose ps --all > reports/ci/semantic-docker-compose-ps.txt 2>&1
          docker compose logs --no-color --timestamps postgres \
            > reports/ci/semantic-postgres.log 2>&1
          docker compose exec -T postgres psql -X -U akp -d akp \
            -c "\\copy (select provider,model,model_revision,dimensions,input_strategy,status,count(*) over () as generation_rows from embedding_generations order by created_at desc) to stdout with csv header" \
            > reports/ci/semantic-generations.csv 2>&1
      - name: Upload semantic retrieval evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-retrieval-${{ github.run_id }}
          path: reports/ci
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
