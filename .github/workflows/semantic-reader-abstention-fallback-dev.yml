name: semantic-reader-abstention-fallback-dev

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-reader-abstention-fallback-dev:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'experiment/semantic-reader-abstention-fallback-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AKP_LOCAL_AGENT_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_LOCAL_AGENT_MODEL_REVISION: cc5cc01a65cc3ff17bdb73a7de33d879f62599b0
      AKP_LOCAL_AGENT_DTYPE: q4
      AKP_LOCAL_AGENT_PORT: "18081"
      AKP_SEMANTIC_READER_FALLBACK_DEV_BASE_URL: http://127.0.0.1:18081/chat/completions
      AKP_SEMANTIC_READER_FALLBACK_DEV_MODEL: onnx-community/Qwen2.5-0.5B-Instruct
      AKP_SEMANTIC_READER_FALLBACK_DEV_MODEL_REVISION: cc5cc01a65cc3ff17bdb73a7de33d879f62599b0
      AKP_SEMANTIC_READER_FALLBACK_DEV_DTYPE: q4
      AKP_SEMANTIC_READER_FALLBACK_DEV_REPORT: reports/ci/semantic-reader-abstention-fallback-dev.json
      AKP_SEMANTIC_READER_FALLBACK_DEV_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Validate development probe source
        run: |
          pnpm exec prettier --check \
            evals/generic/semantic-reader-abstention-fallback-dev/manifest.json \
            scripts/semantic-reader-abstention-fallback-dev-experiment.ts \
            packages/retrieval/tsconfig.evidence-benchmarks.json \
            .github/workflows/semantic-reader-abstention-fallback-dev.yml
          pnpm check
      - name: Build provider workspace dependency
        run: pnpm --filter @akp/contracts build
      - name: Prepare experiment evidence
        run: mkdir -p reports/ci
      - name: Start pinned local reader provider
        shell: bash
        run: |
          pnpm --filter @akp/retrieval exec tsx scripts/local-agent-provider.ts \
            > reports/ci/semantic-reader-fallback-dev-provider.log 2>&1 &
          echo $! > /tmp/semantic-reader-fallback-dev-provider.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18081/health \
              > reports/ci/semantic-reader-fallback-dev-provider-health.json; then
              cat reports/ci/semantic-reader-fallback-dev-provider-health.json
              exit 0
            fi
            sleep 5
          done
          cat reports/ci/semantic-reader-fallback-dev-provider.log >&2
          exit 1
      - name: Execute frozen development-only fallback probe
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/semantic-reader-abstention-fallback-dev-experiment.ts \
            2>&1 | tee reports/ci/semantic-reader-abstention-fallback-dev.log
      - name: Validate governed development outcome
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(
            readFileSync(
              "reports/ci/semantic-reader-abstention-fallback-dev.json",
              "utf8",
            ),
          );
          const health = JSON.parse(
            readFileSync(
              "reports/ci/semantic-reader-fallback-dev-provider-health.json",
              "utf8",
            ),
          );

          if (
            !["PROCEED_TO_FRESH_HOLDOUT", "REJECT_DEVELOPMENT_FRONTIER"].includes(
              report.outcome,
            )
          ) {
            throw new Error("Development fallback probe is invalid.");
          }
          if (
            report.heldoutEvaluated !== false ||
            report.runtimeChanged !== false ||
            report.productionAdmissionChanged !== false ||
            report.readerReceivesRequestedAnswerSlot !== false ||
            report.slotUsedAsEvidenceAuthority !== false
          ) {
            throw new Error("Development fallback probe crossed its claim boundary.");
          }
          if (
            report.gates?.readerInvokedOnlyAfterBaselineAbstention !== true ||
            report.gates?.readerInvokedOnlyWithSafeSlotProjection !== true ||
            report.gates?.baselineSupportedCasesPreserved !== true ||
            report.gates?.allSemanticSupportsSourceBound !== true
          ) {
            throw new Error("Development fallback invariants failed.");
          }
          if (
            health.model !== "onnx-community/Qwen2.5-0.5B-Instruct" ||
            health.revision !==
              "cc5cc01a65cc3ff17bdb73a7de33d879f62599b0" ||
            health.dtype !== "q4"
          ) {
            throw new Error("Development fallback provider identity drifted.");
          }

          console.log(
            JSON.stringify(
              {
                outcome: report.outcome,
                baseline: report.baseline,
                candidate: report.candidate,
                counts: report.counts,
                gates: report.gates,
                protocolHash: report.protocolHash,
              },
              null,
              2,
            ),
          );
          NODE
      - name: Upload semantic-reader development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-reader-abstention-fallback-dev-${{ github.run_id }}
          path: |
            reports/ci/semantic-reader-abstention-fallback-dev.json
            reports/ci/semantic-reader-abstention-fallback-dev.log
            reports/ci/semantic-reader-fallback-dev-provider-health.json
            reports/ci/semantic-reader-fallback-dev-provider.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local reader provider
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/semantic-reader-fallback-dev-provider.pid ]; then
            kill "$(cat /tmp/semantic-reader-fallback-dev-provider.pid)" 2>/dev/null || true
          fi
