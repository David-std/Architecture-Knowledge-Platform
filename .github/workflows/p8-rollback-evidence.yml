name: p8-rollback-evidence

on:
  pull_request:

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_API_TOKEN: akp-ci-integration-token-not-for-production
      AKP_API_TOKEN_SCOPES: >-
        {"spaces":[{"spaceId":"00000000-0000-0000-0000-000000000003","pathPrefix":null,"permissions":["knowledge:read","source:read","source:write","knowledge:propose","knowledge:review","eval:run","admin"]}]}
      AKP_API_URL: http://127.0.0.1:8080
      PORT: 8080
      AKP_INGEST_ROOTS: ${{ github.workspace }}/test/fixtures
      AKP_PROJECT_ROOTS: ${{ github.workspace }}
      AKP_MANAGED_REPO: /tmp/akp-managed-knowledge
      AKP_EXTRACTOR_TOKEN: akp-ci-extractor-token-not-for-production
      AKP_RAW_SECRET_KEY: akp-ci-minio-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node scripts/p8-rollback-materialize.mjs
      - run: node scripts/p8-rollback-test-fix.mjs
      - run: node scripts/p8-delete-materialize.mjs
      - run: node scripts/p8-delivery-order-fix.mjs
      - run: >-
          pnpm exec prettier --write
          apps/api/src/routes/reviews.ts
          apps/api/test/review-publication.integration.test.ts
          apps/api/test/product-lifecycle.integration.test.ts
          apps/worker/src/event-handlers.ts
          apps/worker/test/event-handlers.test.ts
          packages/indexing/src/index.ts
      - run: pnpm check
      - run: docker compose up -d --wait postgres minio extractor
      - run: |
          git init -b main "$AKP_MANAGED_REPO"
          git -C "$AKP_MANAGED_REPO" config user.name "AKP P8 CI"
          git -C "$AKP_MANAGED_REPO" config user.email "akp-p8-ci@localhost"
          git -C "$AKP_MANAGED_REPO" commit --allow-empty -m "chore: initialize P8 managed knowledge"
      - run: pnpm db:migrate
      - run: pnpm auth:provision
      - name: Execute rollback integration evidence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/p8-test
          pnpm --filter @akp/api exec vitest run \
            --config vitest.integration.config.ts \
            test/review-publication.integration.test.ts \
            test/product-lifecycle.integration.test.ts \
            --reporter=default --reporter=junit \
            --outputFile.junit=../../reports/p8-test/junit.xml \
            2>&1 | tee reports/p8-test/vitest.txt
      - name: Upload rollback test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p8-rollback-test-${{ github.run_id }}
          path: reports/p8-test
          if-no-files-found: ignore
          retention-days: 2
      - run: |
          mkdir -p reports/p8-materialized/apps/api/src/routes
          mkdir -p reports/p8-materialized/apps/api/test
          mkdir -p reports/p8-materialized/apps/worker/src
          mkdir -p reports/p8-materialized/apps/worker/test
          mkdir -p reports/p8-materialized/packages/indexing/src
          cp apps/api/src/routes/reviews.ts reports/p8-materialized/apps/api/src/routes/reviews.ts
          cp apps/api/test/review-publication.integration.test.ts reports/p8-materialized/apps/api/test/review-publication.integration.test.ts
          cp apps/api/test/product-lifecycle.integration.test.ts reports/p8-materialized/apps/api/test/product-lifecycle.integration.test.ts
          cp apps/worker/src/event-handlers.ts reports/p8-materialized/apps/worker/src/event-handlers.ts
          cp apps/worker/test/event-handlers.test.ts reports/p8-materialized/apps/worker/test/event-handlers.test.ts
          cp packages/indexing/src/index.ts reports/p8-materialized/packages/indexing/src/index.ts
      - uses: actions/upload-artifact@v7
        with:
          name: p8-rollback-materialized-${{ github.run_id }}
          path: reports/p8-materialized
          retention-days: 2
      - if: always()
        run: docker compose down -v --remove-orphans
