name: dependency-audit-repair-once

on:
  push:
    branches:
      - chore/retrieval-generality-policy

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Apply patched dependency constraints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const webPath = "apps/web/package.json";
          const web = JSON.parse(readFileSync(webPath, "utf8"));
          web.dependencies.next = "16.3.6";
          writeFileSync(webPath, JSON.stringify(web, null, 2) + "\n");

          const rootPath = "package.json";
          const root = JSON.parse(readFileSync(rootPath, "utf8"));
          root.pnpm = {
            ...(root.pnpm ?? {}),
            overrides: {
              ...(root.pnpm?.overrides ?? {}),
              "@grpc/grpc-js": "1.14.5",
              "adm-zip": "0.6.1",
              "sharp": "0.35.4",
            },
          };
          writeFileSync(rootPath, JSON.stringify(root, null, 2) + "\n");
          NODE
      - name: Resolve lockfile with pnpm
        run: pnpm install --lockfile-only --strict-peer-dependencies
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify high severity audit
        run: pnpm audit --audit-level high
      - name: Commit repaired dependencies and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/dependency-audit-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json pnpm-lock.yaml .github/workflows/dependency-audit-repair-once.yml
          git diff --cached --check
          git commit -m "chore(deps): patch audited dependencies"
          git push origin "HEAD:chore/retrieval-generality-policy"
      - name: Upload generated dependency repair
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-repair
          path: |
            package.json
            apps/web/package.json
            pnpm-lock.yaml
          retention-days: 2
