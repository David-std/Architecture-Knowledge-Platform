name: p2-closure-preflight-once

on:
  push:
    branches:
      - feat/v0.4-enterprise-context-workspace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://akp:akp@localhost:55432/akp
      AKP_MANAGED_REPO: /tmp/akp-managed-knowledge
      AKP_INGEST_ROOTS: ${{ github.workspace }}/test/fixtures
      AKP_PROJECT_ROOTS: ${{ github.workspace }}
      PORT: 8080
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.4-enterprise-context-workspace
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec prettier --check .
      - run: docker compose up -d --wait postgres
      - run: |
          git init -b main "$AKP_MANAGED_REPO"
          git -C "$AKP_MANAGED_REPO" config user.name "AKP P2 Closure"
          git -C "$AKP_MANAGED_REPO" config user.email "akp-p2-closure@localhost"
          git -C "$AKP_MANAGED_REPO" commit --allow-empty -m "chore: initialize managed knowledge for P2 closure"
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm contracts:validate
      - run: pnpm docs:validate
      - run: pnpm hygiene:validate
      - run: pnpm build
      - name: Run focused P2 API integration proof
        run: |
          pnpm --filter @akp/api exec vitest run             --config vitest.integration.config.ts             test/bootstrap-context.integration.test.ts             test/context-revision-set.integration.test.ts             test/context-fabric.integration.test.ts             test/offline-snapshot.integration.test.ts             test/workspace-coordination.integration.test.ts             test/governed-product-flow.integration.test.ts             test/security.integration.test.ts
      - name: Stop disposable services
        if: always()
        run: docker compose down -v --remove-orphans
