name: repair-scale-batching

on:
  push:
    branches: [work/product-completion-final]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/product-completion-final
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Batch synthetic embedding materialization below statement timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/load-scale-benchmark.ts')
          text = path.read_text()
          old = '''async function insertEmbeddings(
            fixture: FixtureIds,
            start: number,
            end: number,
          ): Promise<number> {
            if (start > end) return 0;
            const { elapsedMs } = await timedQuery(
              `insert into unit_embeddings(unit_id,generation_id,content_hash,embedding)
               select
                 u.id,$4,
                 u.content_hash,
                 ('[' || (((i % 1000)::numeric / 1000)::text) || ',' ||
                   repeat('0.01,',62) || '0.01]')::vector(64)
                 from generate_series($5::int,$6::int) as generated(i)
                 join knowledge_documents d
                   on d.space_id=$1 and d.vault_id=$2 and d.external_id=$3 || i::text
                 join knowledge_units u
                   on u.document_id=d.id and u.space_id=$1 and u.vault_id=$2
                on conflict (unit_id,generation_id) do nothing`,
              [
                fixture.spaceId,
                fixture.vaultId,
                fixture.externalPrefix,
                fixture.embeddingGenerationId,
                start,
                end,
              ],
            );
            return elapsedMs;
          }
          '''
          new = '''async function insertEmbeddings(
            fixture: FixtureIds,
            start: number,
            end: number,
          ): Promise<number> {
            if (start > end) return 0;
            const batchSize = 10_000;
            let elapsedMs = 0;
            for (let batchStart = start; batchStart <= end; batchStart += batchSize) {
              const batchEnd = Math.min(end, batchStart + batchSize - 1);
              const measured = await timedQuery(
                `insert into unit_embeddings(unit_id,generation_id,content_hash,embedding)
                 select
                   u.id,$4,
                   u.content_hash,
                   ('[' || (((i % 1000)::numeric / 1000)::text) || ',' ||
                     repeat('0.01,',62) || '0.01]')::vector(64)
                   from generate_series($5::int,$6::int) as generated(i)
                   join knowledge_documents d
                     on d.space_id=$1 and d.vault_id=$2 and d.external_id=$3 || i::text
                   join knowledge_units u
                     on u.document_id=d.id and u.space_id=$1 and u.vault_id=$2
                  on conflict (unit_id,generation_id) do nothing`,
                [
                  fixture.spaceId,
                  fixture.vaultId,
                  fixture.externalPrefix,
                  fixture.embeddingGenerationId,
                  batchStart,
                  batchEnd,
                ],
              );
              elapsedMs += measured.elapsedMs;
            }
            return elapsedMs;
          }
          '''
          if old not in text:
              raise SystemExit('expected insertEmbeddings implementation not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write scripts/load-scale-benchmark.ts
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "scripts/load-scale-benchmark.ts"
      - name: Commit bounded batching fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/load-scale-benchmark.ts
          git commit -m "fix(eval): batch scale embedding fixture writes"
          git push origin HEAD:work/product-completion-final
