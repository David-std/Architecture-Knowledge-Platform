[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "akp-extractor"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  # Marker-PDF currently requires Pillow <11; keep the shared runtime range
  # compatible so the opt-in provider extra remains installable.
  "pillow>=10.1,<11",
  "pydantic>=2.9,<3",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "python-pptx>=1.0,<2",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
# Heavy providers are intentionally opt-in. The deterministic adapter remains
# the only default path; installing an extra does not select that provider.
docling = ["docling>=2.0,<3"]
# CPU provider profile keeps the same PyTorch/TorchVision versions.
docling-cpu = [
  "docling>=2.0,<3",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "docling-core==2.92.0; sys_platform != 'darwin'",
]
marker = ["marker-pdf>=2.0,<3"]
chunkr = ["chunkr-ai>=0.3,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "provider_runtime: executes an opt-in heavyweight provider against a real local fixture"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Modules are importable source files, not executable scripts. Windows checkouts
# do not preserve executable bits consistently when copied into CI containers.
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
# These two nested routing guards intentionally keep capability selection readable;
# combining them is style-only and does not change runtime semantics.
"app/registry.py" = ["SIM102"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv]
# Retain the existing macOS provider lock while adding an accelerator fork.
constraint-dependencies = [
  "docling==2.99.0; sys_platform == 'darwin'",
  "docling-core==2.78.0; sys_platform == 'darwin'",
]
conflicts = [
  [{ extra = "docling-cpu" }, { extra = "docling" }],
  [{ extra = "docling-cpu" }, { extra = "marker" }],
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "docling-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", extra = "docling-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
