[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "akp-extractor"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-multipart>=0.0.12",
  "beautifulsoup4>=4.12",
  "pillow>=11.0",
  "python-docx>=1.1",
  "python-pptx>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Modules are importable source files, not executable scripts. Windows checkouts
# do not preserve executable bits consistently when copied into CI containers.
ignore = ["EXE002"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
