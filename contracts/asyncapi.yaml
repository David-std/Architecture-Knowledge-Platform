asyncapi: 3.0.0
info:
  title: Architecture Knowledge Platform Persisted Events
  version: 0.2.0
  description: >
    Schemas for events persisted by the current runtime. The platform uses
    PostgreSQL as its durable event source; LISTEN / NOTIFY is only a local
    wake-up optimization and is not an external broker.
channels:
  outboxEvents:
    address: internal.akp_outbox
    description: >
      Durable integration events stored in PostgreSQL event_outbox. LISTEN /
      NOTIFY is only a wake-up hint; consumers claim rows with a lease.
    messages:
      integrationEvent:
        $ref: "#/components/messages/IntegrationEvent"
  ingestJobEvents:
    address: internal.ingest_job_events
    description: Rows persisted in the ingest_job_events PostgreSQL table.
    messages:
      ingestJobEvent:
        $ref: "#/components/messages/IngestJobEvent"
  auditEvents:
    address: internal.audit_events
    description: Rows persisted in the audit_events PostgreSQL table.
    messages:
      auditEvent:
        $ref: "#/components/messages/AuditEvent"
operations:
  consumeOutboxEvents:
    action: receive
    channel:
      $ref: "#/channels/outboxEvents"
    summary: Claim and process durable integration events
    messages:
      - $ref: "#/channels/outboxEvents/messages/integrationEvent"
components:
  messages:
    IntegrationEvent:
      name: IntegrationEvent
      title: Versioned transactional outbox event
      payload:
        $ref: "#/components/schemas/IntegrationEventEnvelope"
    IngestJobEvent:
      name: IngestJobEvent
      title: Persisted ingest job event
      payload:
        $ref: "#/components/schemas/IngestJobEventPayload"
    AuditEvent:
      name: AuditEvent
      title: Persisted audit event
      payload:
        $ref: "#/components/schemas/AuditEventPayload"
  schemas:
    IntegrationEventEnvelope:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventType
        - eventVersion
        - resourceId
        - occurredAt
        - payload
      properties:
        eventId: { type: string, format: uuid }
        eventType:
          type: string
          enum:
            - SourceRegistered
            - ExtractionRequested
            - ExtractionCompleted
            - CompilationRequested
            - KnowledgeDraftCreated
            - ValidationRequested
            - KnowledgePublished
            - CorpusRevisionPublished
            - LexicalIndexUpdateRequested
            - VectorIndexUpdateRequested
            - GraphIndexUpdateRequested
            - ContextPackInvalidationRequested
            - ImpactedEvalRunRequested
        eventVersion: { type: integer, minimum: 1 }
        resourceId: { type: string, minLength: 1 }
        organizationId: { type: [string, "null"], format: uuid }
        spaceId: { type: [string, "null"], format: uuid }
        vaultId: { type: [string, "null"], format: uuid }
        correlationId: { type: [string, "null"] }
        causationId: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
    IngestJobEventPayload:
      type: object
      required: [jobId, state, eventType, payload, createdAt]
      properties:
        jobId: { type: string, format: uuid }
        state: { type: string }
        eventType: { type: string }
        payload:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    AuditEventPayload:
      type: object
      required: [action, resourceType, metadata, createdAt]
      properties:
        id: { type: integer }
        organizationId:
          type: [string, "null"]
          format: uuid
        spaceId:
          type: [string, "null"]
          format: uuid
        actorId:
          type: [string, "null"]
          format: uuid
        action: { type: string }
        resourceType: { type: string }
        resourceId:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties: true
        traceId:
          type: [string, "null"]
        createdAt: { type: string, format: date-time }
