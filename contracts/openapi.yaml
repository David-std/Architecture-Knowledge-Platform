          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/audit/export/{vaultId}:
    get:
      tags: [Governance]
      operationId: exportSanitizedAuditBundle
      x-akp-permission: admin
      x-akp-requires-unrestricted-space: true
      description: >
        Exports a bounded, metadata-only audit ZIP. Requires whole-space admin,
        explicit confirmation and an authorized private/team/central vault.
        Raw binaries, evidence excerpts, document bodies, secrets, host paths,
        source URIs and full ContextPacket content are never included.
      parameters:
        - in: path
          name: vaultId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: confirm
          required: true
          schema: { type: string, const: EXPORT_SANITIZED_AUDIT_BUNDLE }
        - in: query
          name: locator
          schema:
            type: string
            maxLength: 8192
          description: JSON object or array of at most 16 evidence-locator filters.
        - in: query
          name: maxPackets
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Deterministic sanitized audit bundle.
          headers:
            X-AKP-Bundle-Hash:
              schema: { type: string, pattern: "^[a-f0-9]{64}$" }
            X-AKP-Bundle-Schema-Version:
              schema: { type: string, const: "1.0" }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Configured audit bundle limit exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/audit/export/{vaultId}/metadata:
    get:
      tags: [Governance]
      operationId: inspectSanitizedAuditBundle
      x-akp-permission: admin
      x-akp-requires-unrestricted-space: true
      description: >
        Returns only bounded revision, count and manifest-hash metadata. No ZIP,
        document path, locator, evidence, source title or ContextPacket content
        crosses this endpoint; use it for MCP preflight.
      parameters:
        - in: path
          name: vaultId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: confirm
          required: true
          schema: { type: string, const: EXPORT_SANITIZED_AUDIT_BUNDLE }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/evidence/export/{vaultId}/{evidenceId}:
    get:
      tags: [Governance]
      operationId: exportRawEvidenceById
      x-akp-permission: source:read
      x-akp-requires-vault-scope: true
      x-akp-raw-egress: true
      description: >
        Returns one raw immutable source object selected by evidence ID inside
        the explicit vault. Requires source:read (or admin), the literal
        EXPORT_RAW_EVIDENCE confirmation, an authorized path scope and a
        bounded maxBytes value. Object SHA-256 and byte size are verified
        before the response. Raw bytes may contain the original source's own
        content; object-store keys, credentials and host paths are never sent
        as response metadata. Disabled unless AKP_ENABLE_RAW_EVIDENCE_EXPORT=true.
      parameters:
        - in: path
          name: vaultId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: evidenceId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: confirm
          required: true
          schema: { type: string, const: EXPORT_RAW_EVIDENCE }
        - in: query
          name: locator
          schema: { type: string, maxLength: 8192 }
          description: Optional JSON object that must match the evidence locator.
        - in: query
          name: maxBytes
          schema:
            type: integer
            minimum: 1
            maximum: 52428800
            default: 52428800
      responses:
        "200":
          description: Verified raw source bytes for the selected evidence row.
          headers:
            X-AKP-Evidence-SHA256:
              schema: { type: string, pattern: "^[a-f0-9]{64}$" }
            X-AKP-Evidence-Bytes:
              schema: { type: integer, minimum: 0 }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/evidence/export/{vaultId}:
    get:
      tags: [Governance]
      operationId: exportRawEvidenceByLocator
      x-akp-permission: source:read
      x-akp-requires-vault-scope: true
      x-akp-raw-egress: true
      description: >
        Returns one raw immutable source object selected by an exact JSON
        evidence locator (or evidenceId query parameter). The selector must
        resolve to exactly one row; all raw-egress controls of the ID endpoint
        apply. Disabled unless AKP_ENABLE_RAW_EVIDENCE_EXPORT=true.
      parameters:
        - in: path
          name: vaultId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: confirm
          required: true
          schema: { type: string, const: EXPORT_RAW_EVIDENCE }
        - in: query
          name: evidenceId
          schema: { type: string, format: uuid }
        - in: query
          name: locator
          schema: { type: string, maxLength: 8192 }
        - in: query
          name: maxBytes
          schema:
            type: integer
            minimum: 1
            maximum: 52428800
            default: 52428800
      responses:
        "200":
          description: Verified raw source bytes for exactly one evidence row.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/reindex:
    post:
      tags: [Governance]
      operationId: reindexCanonicalCorpus
      x-akp-permission: admin
      x-akp-requires-unrestricted-space: true
      description: >
        Rebuilds derived relations, projections and lint for one explicitly
        selected authorized vault. The caller must have admin permission with
        pathPrefix null (whole-space access). Use REIMPORT_AND_REBUILD only
        when the latest read-only import for that vault should run before
        rebuilding.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexRequest"
      responses:
        "200":
          description: Derived relations, projections and lint rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResponse"
        "400": { $ref: "#/components/responses/ReindexSpaceRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReindexForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReindexConfirmationRequired" }
        "500": { $ref: "#/components/responses/ServerError" }

