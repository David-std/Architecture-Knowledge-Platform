                toUserId: { type: string, format: uuid }
                toPrincipalId:
                  type: string
                  format: uuid
                  description: >-
                    Optional exact target principal. When omitted, the target
                    participant's HUMAN principal owns the transferred claim.
                fencingToken: { type: integer, minimum: 1 }
                leaseSeconds:
                  { type: integer, minimum: 15, maximum: 900, default: 120 }
                summary: { type: string, minLength: 1, maxLength: 4096 }
                completed:
                  type: array
                  maxItems: 50
                  items: { type: string, minLength: 1, maxLength: 2000 }
                remaining:
                  type: array
                  maxItems: 50
                  items: { type: string, minLength: 1, maxLength: 2000 }
                blockers:
                  type: array
                  maxItems: 50
                  items: { type: string, minLength: 1, maxLength: 2000 }
                changedResourceRefs:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 1000 }
                evidenceRefs:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 1000 }
                questions:
                  type: array
                  maxItems: 50
                  items: { type: string, minLength: 1, maxLength: 2000 }
                note:
                  type: string
                  maxLength: 2048
                  description: Legacy compatibility note; prefer structured handoff fields.
      responses:
