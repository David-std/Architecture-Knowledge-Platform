components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
      description: >
        Provisioned out of band with an explicit TokenScopeSet. Token scopes
        are intersected with the user's current memberships on every request.
    cookieAuth:
      type: apiKey
      in: cookie
      name: akp_session
      description: HttpOnly session carrying the effective TokenScopeSet snapshot.
    providerTaskCallbackAuth:
      type: apiKey
      in: header
      name: x-akp-provider-task-token
      description: Internal extractor/provider callback journal token.
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Actor- and operation-scoped key. Reuse with a different request returns 409.
      schema: { type: string, minLength: 8, maxLength: 200 }
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 16 }
    UuidId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    StableId:
      in: path
      name: id
      required: true
      description: Database UUID, stable external ID, alias or title where supported.
      schema: { type: string, minLength: 1 }
  responses:
    ObjectResponse:
      description: Runtime response object
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, expired, revoked or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Permission, space or path scope denied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found in the authorized scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Resource state, publication lock or optimistic revision conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Requested raw evidence exceeds the bounded byte limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: The raw object-store export capability is disabled or unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Publication or internal runtime failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReindexSpaceRequired:
      description: A target space and vault are required for the rebuild.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum:
                  [
                    REINDEX_SPACE_REQUIRED,
                    REINDEX_VAULT_REQUIRED,
                    INVALID_IDEMPOTENCY_KEY,
                  ]
            additionalProperties: true
    ReindexForbidden:
      description: Admin whole-space access is required for the target space.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum: [PERMISSION_DENIED, PATH_SCOPE_DENIED]
            additionalProperties: true
    ReindexConfirmationRequired:
      description: Confirmation must match the requested rebuild mode.
      content:
        application/json:
          schema:
            type: object
            required: [code, confirmation]
            properties:
              code: { type: string, const: REINDEX_CONFIRMATION_REQUIRED }
              confirmation:
                type: string
                enum: [REBUILD_DERIVED_PROJECTIONS, REIMPORT_AND_REBUILD]
  schemas:
    ConnectorCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          accessMode,
          permissionFidelity,
          syncFidelity,
          incrementalSync,
          deletionPropagation,
          cursorOrWebhook,
          sourceAuthority,
          writeBack,
          identityMapping,
          dataResidency,
          replayable,
          auditTrail,
          rateLimit,
          degradation,
          health,
        ]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        accessMode:
          type: string
          enum: [MIRROR_INDEXED, REMOTE_FEDERATED, REFERENCE_LIVE, HYBRID_CACHE]
        permissionFidelity:
          type: string
          enum: [SOURCE_ACL_EXACT, SOURCE_ACL_MAPPED, WORKSPACE_WIDE, NONE]
        syncFidelity:
          type: string
          enum: [APPEND, UPSERT, MIRROR]
        incrementalSync: { type: boolean }
        deletionPropagation:
          type: string
          enum: [IMMEDIATE, EVENTUAL, NONE]
        freshnessSlaSeconds: { type: integer, minimum: 1 }
        cursorOrWebhook: { type: boolean }
        sourceAuthority:
          type: string
          enum: [SYSTEM_OF_RECORD, REFERENCE, DERIVED]
        writeBack:
          type: string
          enum: [NONE, BOUNDED_ACTIONS, FULL]
        identityMapping:
          type: string
          enum: [EXACT, MAPPED, NONE]
        dataResidency:
          type: string
          enum: [LOCAL, ORG, EXTERNAL]
        replayable: { type: boolean }
        auditTrail:
          type: string
          enum: [FULL, METADATA_ONLY, NONE]
        rateLimit:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [NONE] }
            - type: object
              additionalProperties: false
              required: [kind, requestsPerMinute, onExceeded]
              properties:
                kind: { type: string, enum: [DECLARED] }
                requestsPerMinute: { type: integer, minimum: 1 }
                burst: { type: integer, minimum: 1 }
                onExceeded:
                  type: string
                  enum: [BACKOFF, QUEUE, FAIL_CLOSED]
        degradation:
          type: object
          additionalProperties: false
          required: [onUnavailable]
          properties:
            onUnavailable:
              type: string
              enum: [FAIL_CLOSED, STALE_READ]
            maxStaleSeconds: { type: integer, minimum: 0 }
        health:
          type: string
          enum: [HEALTHY, DEGRADED, STALE, UNAVAILABLE]
    CodeSymbolSelector:
      type: object
      additionalProperties: false
      required: [repository]
      properties:
        repository: { type: string, minLength: 1, maxLength: 2048 }
        commitSha:
          type: string
          pattern: "^[a-fA-F0-9]{40}$"
        path: { type: string, minLength: 1, maxLength: 4096 }
        qualifiedName: { type: string, minLength: 1, maxLength: 2048 }
        name: { type: string, minLength: 1, maxLength: 1024 }
        kind: { type: string, minLength: 1, maxLength: 120 }
        signature: { type: string, minLength: 1, maxLength: 4096 }
      anyOf:
        - required: [path]
        - required: [qualifiedName]
        - required: [name]
        - required: [signature]
    CodePathOptions:
      type: object
      additionalProperties: false
      properties:
        relationTypes:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 160 }
        maxHops: { type: integer, minimum: 1, maximum: 16 }
        maxFanout: { type: integer, minimum: 1, maximum: 1000 }
        maxCandidates: { type: integer, minimum: 1, maximum: 10000 }
        timeBudgetMs: { type: integer, minimum: 1, maximum: 60000 }
    CodeImpactOptions:
      allOf:
        - { $ref: "#/components/schemas/CodePathOptions" }
        - type: object
          properties:
            direction:
              type: string
              enum: [outgoing, incoming, both]
            includeTests: { type: boolean }
            includeCatalogBridges: { type: boolean }
            includeRulesDecisions: { type: boolean }
            includeRuntimeObservations: { type: boolean }
    CodeScopedSelectorRequest:
      type: object
      additionalProperties: false
      required: [spaceId, selector]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        vaultIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        federated: { type: boolean, default: false }
        freshnessPolicy:
          type: string
          enum: [FRESH_ONLY, ALLOW_STALE]
          default: FRESH_ONLY
        selector: { $ref: "#/components/schemas/CodeSymbolSelector" }
    CodeScopedPathRequest:
      type: object
      additionalProperties: false
      required: [spaceId, source, target]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        vaultIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        federated: { type: boolean, default: false }
        freshnessPolicy:
          type: string
          enum: [FRESH_ONLY, ALLOW_STALE]
          default: FRESH_ONLY
        source: { $ref: "#/components/schemas/CodeSymbolSelector" }
        target: { $ref: "#/components/schemas/CodeSymbolSelector" }
        options: { $ref: "#/components/schemas/CodePathOptions" }
    CodeScopedImpactRequest:
      type: object
      additionalProperties: false
      required: [spaceId, selector]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        vaultIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        federated: { type: boolean, default: false }
        freshnessPolicy:
          type: string
          enum: [FRESH_ONLY, ALLOW_STALE]
          default: FRESH_ONLY
        selector: { $ref: "#/components/schemas/CodeSymbolSelector" }
        options: { $ref: "#/components/schemas/CodeImpactOptions" }
    CodeScopedChangeImpactRequest:
      type: object
      additionalProperties: false
      required: [spaceId, repository, commitSha, changedPaths]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        vaultIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        federated: { type: boolean, default: false }
        freshnessPolicy:
          type: string
          enum: [FRESH_ONLY, ALLOW_STALE]
          default: FRESH_ONLY
        repository: { type: string, minLength: 1, maxLength: 2048 }
        commitSha:
          type: string
          pattern: "^[a-fA-F0-9]{40}$"
        changedPaths:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 4096 }
        options: { $ref: "#/components/schemas/CodeImpactOptions" }
    CodeScopedCommitDeltaImpactRequest:
      type: object
      additionalProperties: false
      required: [spaceId, repository, baseSha, headSha]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        vaultIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        federated: { type: boolean, default: false }
        freshnessPolicy:
          type: string
          enum: [FRESH_ONLY, ALLOW_STALE]
          default: FRESH_ONLY
        repository: { type: string, minLength: 1, maxLength: 2048 }
        baseSha:
          type: string
          pattern: "^[a-fA-F0-9]{40}$"
        headSha:
          type: string
          pattern: "^[a-fA-F0-9]{40}$"
        options: { $ref: "#/components/schemas/CodeImpactOptions" }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
      additionalProperties: true
    ContextPacketBudgetError:
      type: object
      additionalProperties: false
      required: [code, maxTokens, requiredTokens]
      properties:
        code:
          type: string
          const: CONTEXT_PACKET_BUDGET_TOO_SMALL
        maxTokens:
          type: integer
          minimum: 1
        requiredTokens:
          type: integer
          minimum: 1
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: UP }
    Readiness:
      type: object
      required: [status, database, rawObjectStore, extractor]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        database: { type: boolean }
        rawObjectStore: { type: boolean }
        extractor: { type: boolean }
    SearchMode:
      type: string
      enum:
        [COMPILED_ONLY, SOURCE_BACKED, RAW_ONLY, PROJECT_CODE, DRAFT_INCLUDED]
    TrustTier:
      type: string
      enum: [UNVERIFIED, MACHINE_SUPPORTED, HUMAN_REVIEWED, ATTESTED]
    Lifecycle:
      type: string
      enum: [DRAFT, ACTIVE, DISPUTED, SUPERSEDED, ARCHIVED, DELETED_TOMBSTONE]
    GraphRelationType:
      type: string
      enum:
        [
          derives_from,
          supports,
          contradicts,
          supersedes,
          implements,
          applies_to,
          example_of,
          counterexample_of,
          uses,
          requires,
          validated_by,
          produces,
          consumed_by,
          related_to,
        ]
    GraphPathNode:
      type: object
      additionalProperties: false
      required: [documentId, document]
      properties:
        documentId: { type: string, format: uuid }
        document: { type: string, minLength: 1 }
        relation: { $ref: "#/components/schemas/GraphRelationType" }
        direction:
          type: string
          enum: [outgoing, incoming]
    GraphPathProvenance:
      type: object
      additionalProperties: false
      required:
        [channel, seedDocumentId, targetDocumentId, path, hops, graphScore]
      properties:
        channel: { type: string, const: graph }
        seedDocumentId: { type: string, format: uuid }
        targetDocumentId: { type: string, format: uuid }
        path:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/GraphPathNode" }
        hops: { type: integer, minimum: 1 }
        graphScore: { type: number, minimum: 0 }
    FederationRemoteQueryBudget:
      type: object
      additionalProperties: false
      required: [maxResults, maxWallMs, maxResponseBytes]
      properties:
        maxResults: { type: integer, minimum: 1, maximum: 100, default: 20 }
        maxWallMs:
          { type: integer, minimum: 100, maximum: 60000, default: 5000 }
        maxResponseBytes:
          { type: integer, minimum: 1024, maximum: 5000000, default: 1000000 }
    FederationRevisionPreference:
      type: object
      additionalProperties: false
      required: [vaultId, corpusRevision]
      properties:
        vaultId: { type: string, format: uuid }
        corpusRevision: { type: string, minLength: 1, maxLength: 512 }
    FederationRemoteSearchInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        intent:
          type: string
          enum:
            [
              EXACT_LOOKUP,
              CONCEPTUAL,
              COMPARISON,
              WORKFLOW_EXECUTION,
              SOURCE_VERIFICATION,
              PROJECT_CODE,
              GLOBAL_SYNTHESIS,
              IMPACT_ANALYSIS,
              NO_RETRIEVAL_REQUIRED,
            ]
        projectId: { type: string, format: uuid }
        truthConsistency: { type: string, enum: [STRICT, BEST_EFFORT] }
        types:
          type: array
          items: { type: string }
          default: []
        minimumTrust:
          allOf:
            - { $ref: "#/components/schemas/TrustTier" }
          default: MACHINE_SUPPORTED
        mode:
          allOf:
            - { $ref: "#/components/schemas/SearchMode" }
          default: SOURCE_BACKED
    FederationRemoteQueryRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, caller, scope, request, budget]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        caller:
          type: object
          additionalProperties: false
          required: [nodeId, requestId]
          properties:
            nodeId:
              type: string
              pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$"
            requestId: { type: string, format: uuid }
        scope:
          type: object
          additionalProperties: false
          required: [spaceId, vaultIds]
          properties:
            spaceId: { type: string, format: uuid }
            vaultIds:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items: { type: string, format: uuid }
        request: { $ref: "#/components/schemas/FederationRemoteSearchInput" }
        budget: { $ref: "#/components/schemas/FederationRemoteQueryBudget" }
        revisionPreferences:
          type: array
          maxItems: 20
          default: []
          items: { $ref: "#/components/schemas/FederationRevisionPreference" }
    FederationPeerQueryRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, scope, request, budget]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        requestId: { type: string, format: uuid }
        scope:
          type: object
          additionalProperties: false
          required: [spaceId, vaultIds]
          properties:
            spaceId: { type: string, format: uuid }
            vaultIds:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items: { type: string, format: uuid }
        request: { $ref: "#/components/schemas/FederationRemoteSearchInput" }
        budget: { $ref: "#/components/schemas/FederationRemoteQueryBudget" }
        revisionPreferences:
          type: array
          maxItems: 20
          default: []
          items: { $ref: "#/components/schemas/FederationRevisionPreference" }
    FederationRemoteQueryResponse:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          requestId,
          remote,
          scope,
          partial,
          stale,
          warnings,
          indexRevisions,
          hits,
        ]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        requestId: { type: string, format: uuid }
        remote:
          type: object
          additionalProperties: false
          required: [nodeId, deploymentMode, revision]
          properties:
            nodeId:
              type: string
              pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$"
            deploymentMode: { type: string, minLength: 1, maxLength: 64 }
            revision: { type: [string, "null"], maxLength: 512 }
        scope:
          type: object
          additionalProperties: false
          required: [spaceId, vaultIds]
          properties:
            spaceId: { type: string, format: uuid }
            vaultIds:
              type: array
              minItems: 1
              maxItems: 20
              items: { type: string, format: uuid }
        partial: { type: boolean }
        stale: { type: boolean }
        warnings:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 512 }
        indexRevisions: { type: object, additionalProperties: true }
        hits:
          type: array
          maxItems: 100
          items:
            allOf:
              - { $ref: "#/components/schemas/SearchHit" }
              - type: object
                required: [remoteProvenance]
                properties:
                  remoteProvenance:
                    type: object
                    additionalProperties: false
                    required:
                      [nodeId, nodeRevision, documentRevision, trust, lifecycle]
                    properties:
                      nodeId:
                        type: string
                        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$"
                      nodeRevision: { type: [string, "null"], maxLength: 512 }
                      documentRevision: { type: string, minLength: 1 }
                      trust: { $ref: "#/components/schemas/TrustTier" }
                      lifecycle: { $ref: "#/components/schemas/Lifecycle" }
        noAnswer: {}
    FederationFanoutPeerRequest:
      type: object
      additionalProperties: false
      required: [peerId, query]
      properties:
        peerId: { type: string, format: uuid }
        query: { $ref: "#/components/schemas/FederationPeerQueryRequest" }
    FederationFanoutRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, local]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        local: { $ref: "#/components/schemas/SearchRequest" }
        peers:
          type: array
          maxItems: 4
          uniqueItems: true
          default: []
          items: { $ref: "#/components/schemas/FederationFanoutPeerRequest" }
        requireAllPeers: { type: boolean, default: false }
    FederationFanoutResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, local, remotes, failures, partial, warnings]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        local: { type: object, additionalProperties: true }
        remotes:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [peerId, response]
            properties:
              peerId: { type: string, format: uuid }
              response:
                { $ref: "#/components/schemas/FederationRemoteQueryResponse" }
        failures:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [peerId, code]
            properties:
              peerId: { type: string, format: uuid }
              code:
                type: string
                pattern: "^[A-Z][A-Z0-9_]*$"
        partial: { type: boolean }
        warnings:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 512 }
    SearchRequest:
      type: object
      required: [query, spaceId]
      properties:
        query: { type: string, minLength: 1 }
        intent:
          type: string
          enum:
            [
              EXACT_LOOKUP,
              CONCEPTUAL,
              COMPARISON,
              WORKFLOW_EXECUTION,
              SOURCE_VERIFICATION,
              PROJECT_CODE,
              GLOBAL_SYNTHESIS,
              IMPACT_ANALYSIS,
              NO_RETRIEVAL_REQUIRED,
            ]
        organizationId: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        vaultIds:
          type: array
          maxItems: 20
          default: []
          items: { type: string, format: uuid }
        federated:
          type: boolean
          default: false
          description: Must be true when more than one vaultId is requested.
        projectId: { type: string, format: uuid }
        truthConsistency:
          type: string
          enum: [STRICT, BEST_EFFORT]
          default: STRICT
        types:
          type: array
          items: { type: string }
          default: []
        minimumTrust:
          allOf:
            - { $ref: "#/components/schemas/TrustTier" }
          default: MACHINE_SUPPORTED
        mode:
          allOf:
            - { $ref: "#/components/schemas/SearchMode" }
          default: SOURCE_BACKED
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      anyOf:
        - required: [vaultId]
        - properties:
            vaultIds: { type: array, minItems: 1 }
          required: [vaultIds]
    RetrievalTraceGeneration:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [LEXICAL, VECTOR, GRAPH, COMMUNITY, CONTEXT_PACK, CODE]
        id: { type: string, minLength: 1, maxLength: 2048 }
        provider: { type: string, minLength: 1, maxLength: 512 }
        model: { type: string, minLength: 1, maxLength: 512 }
        modelRevision: { type: string, minLength: 1, maxLength: 512 }
        configurationHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    RetrievalTraceQueryTransform:
      type: object
      additionalProperties: false
      required: [transformerId, kind, ordinal, reason]
      properties:
        transformerId: { type: string, minLength: 1, maxLength: 512 }
        traceId: { type: string, format: uuid }
        kind:
          type: string
          enum: [DECOMPOSITION, MULTI_QUERY, HYDE]
        ordinal: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1024 }
    RetrievalTraceContribution:
      type: object
      additionalProperties: false
      required: [channel, rank, channelWeight, reason]
      properties:
        channel: { type: string, minLength: 1, maxLength: 128 }
        rank: { type: integer, minimum: 1 }
        channelWeight: { type: number, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2048 }
        rawScore: { type: number }
        candidateRevision: { type: [string, "null"] }
        generation: { $ref: "#/components/schemas/RetrievalTraceGeneration" }
        queryTransform:
          { $ref: "#/components/schemas/RetrievalTraceQueryTransform" }
        supportSetId: { type: string, minLength: 1, maxLength: 2048 }
    RetrievalTrace:
      type: object
      additionalProperties: false
      required:
        [
          authorization,
          truth,
          temporal,
          contributions,
          fusion,
          finalSelectionReason,
        ]
      properties:
        authorization:
          type: object
          additionalProperties: false
          required: [decision, spaceId, vaultId, pathRestricted]
          properties:
            decision: { type: string, enum: [ALLOW, SCOPED_INTERNAL] }
            spaceId: { type: string, format: uuid }
            vaultId: { type: string, format: uuid }
            pathRestricted: { type: boolean }
        truth:
          type: object
          additionalProperties: false
          required: [state, consistency, revisionHash, capturedAt]
          properties:
            state:
              type: string
              enum: [SUPPORTED, DISPUTED, UNANNOTATED]
            consistency:
              type: string
              enum: [STRICT, BEST_EFFORT]
            revisionHash:
              type: [string, "null"]
              pattern: "^[a-f0-9]{64}$"
            capturedAt: { type: string, format: date-time }
        temporal:
          type: object
          additionalProperties: false
          required: [lifecycle, refreshStatus]
          properties:
            lifecycle: { $ref: "#/components/schemas/Lifecycle" }
            refreshStatus: { type: string, minLength: 1, maxLength: 128 }
        contributions:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/RetrievalTraceContribution" }
        fusion:
          type: object
          additionalProperties: false
          required: [score, reasons]
          properties:
            score: { type: number }
            reasons:
              type: array
              maxItems: 64
              items: { type: string, minLength: 1, maxLength: 2048 }
        rerank:
          type: object
          additionalProperties: false
          required: [reranker, preRank, postRank, preScore, postScore]
          properties:
            reranker: { type: string, minLength: 1, maxLength: 512 }
            preRank: { type: integer, minimum: 1 }
            postRank: { type: integer, minimum: 1 }
            preScore: { type: number }
            postScore: { type: number }
        finalSelectionReason:
          type: string
          minLength: 1
          maxLength: 8192
    SearchHit:
      type: object
      required:
        [
          documentId,
          vaultId,
          document,
          revision,
          title,
          type,
          trust,
          lifecycle,
          score,
          reasons,
          excerpt,
          citations,
        ]
      properties:
        documentId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        unitType: { type: string }
        parentUnitId: { type: string, format: uuid }
        parentUnitType: { type: string }
        headingPath:
          type: array
          items: { type: string }
        parentContext:
          type: string
          description: Bounded structural parent context; never the full dossier container.
        document:
          type: object
          required: [externalId, path, title]
          properties:
            externalId: { type: [string, "null"] }
            path: { type: string }
            title: { type: string }
        revision: { type: string }
        title: { type: string }
        type: { type: string }
        trust: { $ref: "#/components/schemas/TrustTier" }
        lifecycle: { $ref: "#/components/schemas/Lifecycle" }
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
        fusionContributions:
          type: array
          items:
            type: object
            required: [channel, rank, channelWeight, reason]
            properties:
              channel: { type: string }
              rank: { type: integer, minimum: 1 }
              channelWeight: { type: number, minimum: 0 }
              reason: { type: string }
              rawScore:
                type: number
                description: Channel-native score retained for explanation; it does not enter RRF.
              candidateRevision: { type: [string, "null"] }
        rerankTrace:
          type: object
          required: [reranker, preRank, postRank]
          properties:
            reranker: { type: string, minLength: 1 }
            preRank: { type: integer, minimum: 1 }
            postRank: { type: integer, minimum: 1 }
            preScore: { type: number }
            postScore: { type: number }
        retrievalTrace: { $ref: "#/components/schemas/RetrievalTrace" }
        excerpt: { type: string }
        citations:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        graphProvenance:
          type: array
          items: { $ref: "#/components/schemas/GraphPathProvenance" }
    DocumentIntelligenceIngestOptions:
      type: object
      additionalProperties: false
      properties:
        complexity:
          type: string
          enum:
            [simple, digital, complex, scanned, formula, table-heavy, unknown]
        ocrRequired: { type: boolean, default: false }
        tables: { type: boolean, default: false }
        formula: { type: boolean, default: false }
        costPolicy:
          type: string
          enum: [NO_PAID, STANDARD, QUALITY]
          default: STANDARD
        privacyPolicy:
          type: string
          enum: [LOCAL_ONLY, LOCAL_PREFERRED, REMOTE_ALLOWED]
          default: LOCAL_PREFERRED
        language:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_-]{1,31}$"
        extractor:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,99}$"
        ocr: { type: boolean }
        ocrEngine:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        forceFullPageOcr: { type: boolean }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 900 }
    IngestRequest:
      type: object
      required: [spaceId, vaultId, sourceUri]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        sourceUri: { type: string, minLength: 1 }
        expectedSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        title: { type: string }
        mediaType: { type: string }
        modelResidency:
          type: string
          enum: [LOCAL_ONLY, ORG_APPROVED, EXTERNAL_ALLOWED]
        documentIntelligence:
          { $ref: "#/components/schemas/DocumentIntelligenceIngestOptions" }
        policy:
          type: string
          enum: [REVIEW_REQUIRED, ALLOW_LOW_RISK_AUTO_APPROVAL]
          default: REVIEW_REQUIRED
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    ProposalRequest:
      type: object
      required: [spaceId, vaultId, changes]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        summary: { type: string }
        changes:
          type: array
          minItems: 1
          items:
            type: object
            required: [path, content]
            properties:
              path: { type: string, minLength: 1 }
              content: { type: string }
              reason: { type: string }
    EvaluationTarget:
      type: object
      additionalProperties: false
      required: [spaceId, vaultId]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        evalPack:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
          default: generic
    VaultEvalPack:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        version: { type: string, minLength: 1 }
        enabled: { type: boolean, default: true }
        criticalCases:
          type: array
          default: []
          items: { type: string }
    VaultRegistration:
      type: object
      additionalProperties: false
      required: [vaultKey, name, spaceId, localPath]
      properties:
        vaultKey:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        name: { type: string, minLength: 1, maxLength: 200 }
        spaceId: { type: string, format: uuid }
        visibility:
          type: string
          enum: [PRIVATE, TEAM, CENTRAL]
          default: PRIVATE
        gitRepository: { type: [string, "null"] }
        defaultBranch: { type: string, minLength: 1, default: main }
        localPath: { type: string, minLength: 1 }
        contentRoots:
          type: array
          minItems: 1
          default: ["."]
          items: { type: string, minLength: 1 }
        sourceRoots:
          type: array
          default: []
          items: { type: string, minLength: 1 }
        schemaProfile: { type: object, additionalProperties: true, default: {} }
        evalPack: { $ref: "#/components/schemas/VaultEvalPack" }
        retrievalConfig:
          { type: object, additionalProperties: true, default: {} }
        permissions: { type: object, additionalProperties: true, default: {} }
        enabled: { type: boolean, default: true }
    OptionalReason:
      type: object
      properties:
        reason: { type: string }
    RequiredReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    TokenScope:
      type: object
      additionalProperties: false
      required: [spaceId, pathPrefix, permissions]
      description: >
        One least-privilege authorization tuple. pathPrefix null means the
        whole space; a string is a non-empty relative path without dot
        segments or empty path segments. Paths are canonicalized with forward
        slashes before authorization.
      properties:
        spaceId: { type: string, format: uuid }
        pathPrefix:
          oneOf:
            - type: "null"
            - type: string
              minLength: 1
              pattern: "^(?!/)(?!.*//)(?!.*(?:^|/)(?:\\.{1,2})(?:/|$))[^/]+(?:/[^/]+)*$"
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              [
                knowledge:read,
                source:read,
                source:write,
                knowledge:propose,
                knowledge:review,
                eval:run,
                admin,
              ]
    TokenScopeSet:
      type: object
      additionalProperties: false
      required: [spaces]
      properties:
        spaces:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TokenScope" }
    ReindexRequest:
      type: object
      additionalProperties: false
      required: [spaceId, vaultId, confirm]
      properties:
        spaceId: { type: string, format: uuid }
        vaultId:
          type: string
          format: uuid
          description: Explicit vault registry identity to rebuild; never inferred from the space.
        confirm:
          type: string
          enum: [REBUILD_DERIVED_PROJECTIONS, REIMPORT_AND_REBUILD]
        reimportVault:
          type: boolean
          default: false
          description: Run the latest read-only vault import before rebuilding.
      allOf:
        - if:
            properties:
              reimportVault: { const: true }
            required: [reimportVault]
          then:
            properties:
              confirm: { const: REIMPORT_AND_REBUILD }
        - if:
            anyOf:
              - not:
                  required: [reimportVault]
              - properties:
                  reimportVault: { const: false }
                required: [reimportVault]
          then:
            properties:
              confirm: { const: REBUILD_DERIVED_PROJECTIONS }
    ReindexResponse:
      type: object
      required: [status, imports, relationCount, projection, lint]
      properties:
        status:
          type: string
          const: REBUILT_FROM_CURRENT_CANONICAL_REVISION
        imports:
          { type: array, items: { type: object, additionalProperties: true } }
        relationCount: { type: integer, minimum: 0 }
        projection: { type: object, additionalProperties: true }
        lint: { type: object, additionalProperties: true }
