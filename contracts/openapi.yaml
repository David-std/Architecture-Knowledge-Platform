        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/context-fabric/peers:
    get:
      tags: [Governance]
      operationId: listContextFabricPeers
      x-akp-permission: knowledge:read
      parameters:
        - name: spaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: vaultId
          in: query
          required: false
          description: Optional vault whose active KnowledgeProfile connector policy should be evaluated.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized federation discovery metadata. No remote query is performed.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Governance]
      operationId: upsertContextFabricPeer
      x-akp-permission: admin
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [spaceId, peerKey, displayName, capabilities]
              properties:
                spaceId: { type: string, format: uuid }
                peerKey: { type: string, minLength: 1, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 200 }
                endpoint: { type: string }
                discoveryMode:
                  type: string
                  enum: [CATALOG_ONLY, REMOTE_QUERY, MIRROR_BUNDLE]
                  default: CATALOG_ONLY
                trustState:
                  type: string
                  enum: [DISCOVERED, APPROVED, DISABLED]
                  default: DISCOVERED
                capabilities:
                  { $ref: "#/components/schemas/ConnectorCapabilities" }
                revision: { type: string }
                credentialRef:
                  type: string
                  pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
                  description: Non-secret environment-variable name resolved by the API process.
      responses:
        "201":
          description: Peer discovery metadata recorded without network contact.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/context-fabric/federation/query:
    post:
      tags: [Governance]
      operationId: serveFederationRemoteQuery
      x-akp-permission: knowledge:read
      description: >
        Execute an authenticated remote query against this node. The caller
        cannot supply local authority; normal bearer/session authorization is
        applied again through the local search route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/FederationRemoteQueryRequest" }
      responses:
        "200":
          description: Bounded remote results with node/revision/trust provenance.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/FederationRemoteQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/context-fabric/peers/{id}/query:
    post:
      tags: [Governance]
      operationId: queryContextFabricPeer
      x-akp-permission: knowledge:read
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationPeerQueryRequest" }
      responses:
        "200":
          description: Validated peer response; remote trust and lifecycle are preserved.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/FederationRemoteQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/context-fabric/peers/{id}/revoke:
    post:
      tags: [Governance]
      operationId: revokeContextFabricPeer
      x-akp-permission: admin
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      description: >
        Disable the peer immediately and remove its outbound credential
        reference. The referenced secret itself remains outside PostgreSQL.
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/context-fabric/federation/fanout:
    post:
      tags: [Governance]
      operationId: fanoutFederationQuery
      x-akp-permission: knowledge:read
      description: >
        Run the local search and up to four explicit peer queries. Peer
        failures produce a partial response unless requireAllPeers is true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationFanoutRequest" }
      responses:
        "200":
          description: Local results plus successful remote responses and explicit failures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationFanoutResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/ServerError" }

