      operationId: appendAgentSessionEvent
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:event:append
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventType]
              properties:
                eventType:
                  type: string
                  enum:
                    [
                      FINDING,
                      BLOCKER,
                      QUESTION,
                      ARTIFACT,
                      DECISION_CANDIDATE,
                      NOTE,
                    ]
                claimId:
                  type: string
                  format: uuid
                  description: >-
                    Optional claim that owns this coordination write. When set,
                    fencingToken is required and must match the current
                    principal-owned live claim.
                fencingToken:
                  type: integer
                  minimum: 1
                  description: Required together with claimId.
                payload:
                  type: object
                  additionalProperties: true
                  description: Bounded to 16 KiB after JSON serialization.
      responses:
        "201": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: Event payload is invalid or exceeds 16 KiB.

  /v1/sessions/{id}/agent-processes:
    post:
      tags: [Sessions, Authentication]
      operationId: issueAgentProcessCredential
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:manage-agents
      x-akp-idempotency-exempt: true
      x-akp-secret-response: true
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
      description: >
        HUMAN-participant operation that creates a session- and vault-bound
        AGENT_PROCESS child of the authenticated human principal. A participant
        cannot issue a child under another user or parent principal. The raw
        bearer token is returned exactly once; only its SHA-256 hash is
        persisted, so this operation is deliberately not replayed through the
        idempotency journal and is not exposed as an MCP tool.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, minLength: 1, maxLength: 200 }
                durationMinutes:
                  { type: number, minimum: 5, maximum: 720, default: 60 }
                allowedActions:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - workspace:read
                      - workspace:claim
                      - workspace:handoff
                      - workspace:event:append
                      - knowledge:read
                      - knowledge:propose
      responses:
        "201":
          description: Newly issued principal metadata plus one-time raw bearer token.
          content:
            application/json:
              schema:
                type: object
                required: [principal, token, authenticationKind]
                properties:
                  principal: { type: object, additionalProperties: true }
                  token: { type: string, minLength: 32 }
                  authenticationKind: { type: string, const: PRINCIPAL_TOKEN }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agent-processes/{id}/revoke:
    post:
      tags: [Sessions, Authentication]
      operationId: revokeAgentProcessCredential
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:manage-agents
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      description: >
        Revoke an AGENT_PROCESS principal owned by the current human principal.
        Existing process credentials stop authenticating after revocation.
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

