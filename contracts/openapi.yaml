  /v1/schema/dry-run:
    post:
      tags: [Governance]
      operationId: dryRunKnowledgeSchema
      x-akp-permission: admin
      x-akp-requires-unrestricted-space: true
      x-akp-requires-vault-scope: true
      description: >
        Validates either the legacy schema candidate or a complete
        KnowledgeProfileV1 against the exact authorized vault corpus.
        Full-profile dry-runs persist an immutable profile revision and
        corpus-pinned validation evidence without activating it.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [spaceId, vaultId]
              anyOf:
                - required: [candidateVersion]
                - required: [profile]
              properties:
                spaceId: { type: string, format: uuid }
                vaultId: { type: string, format: uuid }
                candidateVersion: { type: string, minLength: 1 }
                requiredFrontmatterFields:
                  { type: array, items: { type: string } }
                allowedTypes: { type: array, items: { type: string } }
                profile: { $ref: "./knowledge-profile.schema.json" }
                supersedesRevisionId: { type: string, format: uuid }
      responses:
        "200":
          description: Corpus-pinned compatibility report; full-profile mode also returns the durable profile revision.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    id,
                    createdAt,
                    candidateHash,
                    corpusFingerprintBefore,
                    corpusFingerprintAfter,
                    compatibilityStatus,
                    compatibilityClass,
                    affectedDocumentCount,
                    corpusRevision,
                    corpusUnchanged,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
                  profileRevisionId: { type: string, format: uuid }
                  profileRevisionStatus:
                    type: string
                    enum:
                      [
                        DRAFT,
                        VALIDATED,
                        REVIEW_REQUIRED,
                        ACTIVE,
                        SUPERSEDED,
                        RETIRED,
                      ]
                  candidateHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                  corpusFingerprintBefore:
                    { type: string, pattern: "^[a-f0-9]{64}$" }
                  corpusFingerprintAfter:
                    { type: string, pattern: "^[a-f0-9]{64}$" }
                  compatibilityStatus:
                    type: string
                    enum: [COMPATIBLE, MIGRATION_REQUIRED]
                  compatibilityClass:
                    type: string
                    enum:
                      [
                        NON_BREAKING,
                        REINDEX_REQUIRED,
                        RECOMPILE_REQUIRED,
                        MIGRATION_REQUIRED,
                        UNSAFE,
                      ]
                  affectedDocumentCount: { type: integer, minimum: 0 }
                  corpusRevision: { type: string, minLength: 1 }
                  corpusUnchanged: { type: boolean }
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/schema/adopt:
    post:
      tags: [Governance]
      operationId: adoptKnowledgeProfile
      x-akp-permission: admin
      x-akp-requires-unrestricted-space: true
      x-akp-requires-vault-scope: true
      description: >
        Binds a vault to a differently-identified KnowledgeProfile. Activation
        governs successive revisions of one profile and treats a changed
        profile id as UNSAFE, so moving between profiles is this separate,
        separately-authorized act. It is permitted only when no compiled
        knowledge would be reinterpreted: every incompatibility the classifier
        found must apply to zero existing documents. Otherwise it refuses with
        the blocking kinds and their usage counts.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  spaceId,
                  vaultId,
                  profileRevisionId,
                  dryRunId,
                  expectedProfileHash,
                  expectedCorpusRevision,
                ]
              properties:
                spaceId: { type: string, format: uuid }
                vaultId: { type: string, format: uuid }
                profileRevisionId: { type: string, format: uuid }
                dryRunId: { type: string, format: uuid }
                expectedProfileHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                expectedCorpusRevision: { type: string, minLength: 1 }
      responses:
        "200":
          description: The vault now runs the adopted profile.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The adoption was refused. KNOWLEDGE_PROFILE_ADOPTION_WOULD_REINTERPRET
            carries the blocking kinds and how many documents use each.
          content:
            application/json:
              schema: { type: object }

  /v1/schema/activate:
    post:
      tags: [Governance]
      operationId: activateKnowledgeProfile
      x-akp-permission: admin
      x-akp-requires-unrestricted-space: true
      x-akp-requires-vault-scope: true
      description: >
        Atomically activates a VALIDATED, NON_BREAKING profile only
        when the exact dry-run, profile hash, corpus revision and
        corpus fingerprint still match. REVIEW_REQUIRED and breaking
        profiles remain blocked until governed profile review and
        migration approval are complete.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  spaceId,
                  vaultId,
                  profileRevisionId,
                  dryRunId,
                  expectedProfileHash,
                  expectedCorpusRevision,
                ]
              properties:
                spaceId: { type: string, format: uuid }
                vaultId: { type: string, format: uuid }
                profileRevisionId: { type: string, format: uuid }
                dryRunId: { type: string, format: uuid }
                expectedProfileHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                expectedCorpusRevision: { type: string, minLength: 1 }
      responses:
        "200":
          description: Active profile binding, including idempotent replay state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    profileRevisionId,
                    profileId,
                    version,
                    profileHash,
                    status,
                    corpusRevision,
                    dryRunId,
                    alreadyActive,
                  ]
                properties:
                  profileRevisionId: { type: string, format: uuid }
                  profileId: { type: string }
                  version: { type: string }
                  profileHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                  status: { type: string, const: ACTIVE }
                  previousRevisionId:
                    type: [string, "null"]
                    format: uuid
                  corpusRevision: { type: string, minLength: 1 }
                  dryRunId: { type: string, format: uuid }
                  alreadyActive: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
