openapi: 3.1.0
info:
  title: Architecture Knowledge Platform API
  version: 0.2.0
  x-akp-write-idempotency: >
    Mutating POST operations accept Idempotency-Key and MCP write tools require
    it. POST /v1/auth/session is intentionally exempt because it creates a
    Set-Cookie response that cannot be safely replayed. Agent-process credential
    issuance is also exempt because its raw token is returned exactly once and
    is never stored in replayable plaintext form.
  description: >
    HTTP contract for the routes registered by the current Fastify runtime.
    All /v1 operations require a scoped bearer API token or an unexpired
    HttpOnly web session and enforce the permission recorded in
    x-akp-permission. Session-authenticated writes also require X-CSRF-Token.
servers:
  - url: http://127.0.0.1:8080
    description: Local development default
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - { name: Health }
  - { name: Authentication }
  - { name: Retrieval }
  - { name: Knowledge }
  - { name: Sources }
  - { name: Ingestion }
  - { name: Reviews }
  - { name: Governance }
  - { name: Evaluation }
  - { name: Projects }
  - { name: Sessions }
paths:
  /health/liveness:
    get:
      tags: [Health]
      operationId: liveness
      security: []
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/readiness:
    get:
      tags: [Health]
      operationId: readiness
      security: []
      responses:
        "200":
          description: Database, raw object store and extractor are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /v1/status:
    get:
      tags: [Knowledge]
      operationId: getPlatformStatus
      x-akp-permission: knowledge:read
      responses:
        "200":
          description: Authorized corpus and capability status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/auth/session:
    get:
      tags: [Authentication]
      operationId: inspectWebSession
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Authentication]
      operationId: createWebSession
      x-akp-idempotency-exempt: true
      description: >
        Exchanges an authorized bearer token for an opaque HttpOnly session and
        CSRF token. This endpoint intentionally does not use Idempotency-Key:
        each exchange creates fresh Set-Cookie credentials and cannot replay a
        prior response safely. The session stores the effective token scopes
        and intersects them with current memberships on each request.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMinutes:
                  { type: integer, minimum: 5, maximum: 720, default: 480 }
      responses:
        "201": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/auth/session/revoke:
    post:
      tags: [Authentication]
      operationId: revokeWebSession
      security:
        - cookieAuth: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/truth/facts:
    get:
      tags: [Knowledge]
      operationId: queryTemporalTruthFacts
      x-akp-permission: knowledge:read
      parameters:
        - {
            name: spaceId,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: vaultId,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: subjectRef,
            in: query,
            schema: { type: string, maxLength: 2048 },
          }
        - {
            name: predicate,
            in: query,
            schema: { type: string, maxLength: 512 },
          }
        - {
            name: mode,
            in: query,
            schema:
              { type: string, enum: [CURRENT, HISTORY], default: CURRENT },
          }
        - {
            name: validAt,
            in: query,
            schema: { type: string, format: date-time },
          }
        - {
            name: recordedAtOrBefore,
            in: query,
            schema: { type: string, format: date-time },
          }
        - {
            name: truthRevisionHash,
            in: query,
            schema: { type: string, pattern: "^[a-f0-9]{64}$" },
          }
        - {
            name: changedSince,
            in: query,
            schema: { type: string, format: date-time },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 100 },
          }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/truth/facts/{factId}/support-history:
    get:
      tags: [Knowledge]
      operationId: getTemporalTruthSupportHistory
      x-akp-permission: knowledge:read
      parameters:
        - {
            name: factId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: spaceId,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: vaultId,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/code/knowledge-links:
    post:
      tags: [Code]
      operationId: approveCodeKnowledgeLink
      x-akp-permission: knowledge:review
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [projectId, documentId, reviewId, relationType, selector]
              properties:
                projectId: { type: string, format: uuid }
                documentId: { type: string, format: uuid }
                reviewId: { type: string, format: uuid }
                relationType:
                  type: string
                  enum: [rationale_ref, applies_to]
                selector:
                  type: object
                  additionalProperties: false
                  properties:
                    path: { type: string, minLength: 1, maxLength: 4096 }
                    qualifiedName:
                      { type: string, minLength: 1, maxLength: 2048 }
                    name: { type: string, minLength: 1, maxLength: 1024 }
                    kind: { type: string, minLength: 1, maxLength: 120 }
                    signature: { type: string, minLength: 1, maxLength: 4096 }
                  anyOf:
                    - required: [path]
                    - required: [qualifiedName]
                    - required: [name]
                    - required: [signature]
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "202": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/code/symbol:
    post:
      tags: [Code]
      operationId: findCodeSymbol
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeScopedSelectorRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/callers:
    post:
      tags: [Code]
      operationId: findCodeCallers
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeScopedSelectorRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/callees:
    post:
      tags: [Code]
      operationId: findCodeCallees
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeScopedSelectorRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/path:
    post:
      tags: [Code]
      operationId: findCodeDependencyPath
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeScopedPathRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408":
          description: Bounded graph query exceeded its time budget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/impact:
    post:
      tags: [Code]
      operationId: analyzeCodeImpact
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeScopedImpactRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408":
          description: Bounded graph query exceeded its time budget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/change-impact:
    post:
      tags: [Code]
      operationId: analyzeCodeChangeImpact
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CodeScopedChangeImpactRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408":
          description: Bounded graph query exceeded its time budget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/commit-delta-impact:
    post:
      tags: [Code]
      operationId: analyzeCodeCommitDeltaImpact
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CodeScopedCommitDeltaImpactRequest",
              }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408":
          description: Bounded graph query exceeded its time budget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/tests:
    post:
      tags: [Code]
      operationId: findCodeTests
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeScopedSelectorRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/code/explain:
    post:
      tags: [Code]
      operationId: explainCodePath
      x-akp-permission: knowledge:read
      x-akp-principal-action: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeScopedPathRequest" }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408":
          description: Bounded graph query exceeded its time budget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/search:
    post:
      tags: [Retrieval]
      operationId: searchKnowledge
      x-akp-permission: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Retrieval plan, active channels, index revisions and ranked hits
          content:
            application/json:
              schema:
                type: object
                required:
                  [mode, intent, plan, degraded, channels, hits, noAnswer]
                properties:
                  mode: { $ref: "#/components/schemas/SearchMode" }
                  intent: { type: string }
                  plan: { type: object, additionalProperties: true }
                  degraded: { type: boolean }
                  channels:
                    type: array
                    items: { type: string }
                  indexRevisions:
                    type: [object, "null"]
                    additionalProperties: true
                  truth:
                    type: [object, "null"]
                    additionalProperties: true
                  hits:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
                  noAnswer:
                    oneOf:
                      - type: "null"
                      - type: object
                        required:
                          [
                            status,
                            reason,
                            searchedChannels,
                            gaps,
                            conflicts,
                            recommendedActions,
                            guidance,
                          ]
                        properties:
                          status:
                            type: string
                            enum: [INSUFFICIENT_KNOWLEDGE]
                          reason: { type: string }
                          searchedChannels:
                            type: array
                            items: { type: string }
                          gaps:
                            type: array
                            items: { type: string }
                          conflicts:
                            type: array
                            items: { type: string }
                          recommendedActions:
                            type: array
                            items: { type: string }
                          guidance: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/context:
    post:
      tags: [Retrieval]
      operationId: buildContextPacket
      x-akp-permission: knowledge:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SearchRequest" }
                - type: object
                  properties:
                    intent: { type: string }
                    packetMode:
                      type: string
                      enum: [FULL_CONTEXT_PACKET, COMPACT_AGENT_PACKET]
                      default: FULL_CONTEXT_PACKET
                    contextLevel:
                      type: string
                      enum: [L0, L1, L2, L3]
                      default: L2
                    reasoningMode:
                      type: string
                      enum: [DIRECT, PLAN]
                      default: DIRECT
                    sessionId: { type: string, format: uuid }
                    objectRefId: { type: string, format: uuid }
                    maxTokens:
                      {
                        type: integer,
                        minimum: 256,
                        maximum: 32000,
                        default: 6000,
                      }
      responses:
        "200":
          description: Persisted, revisioned and token-bounded ContextPacket
          content:
            application/json:
              schema:
                $ref: "./context-packet.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Requested token budget cannot represent the context packet envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPacketBudgetError"

  /v1/workspace/handoffs/inbox:
    get:
      tags: [Sessions]
      operationId: listWorkspaceHandoffInbox
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:read
      description: >
        List durable structured handoffs addressed to the authenticated user
        within one authorized space and vault. AGENT_PROCESS callers remain
        constrained to the vault bound into their credential.
      parameters:
        - name: spaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: vaultId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions:
    get:
      tags: [Sessions]
      operationId: listAgentSessions
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:read
      description: >
        List durable workspace sessions visible to the current participant. An
        AGENT_PROCESS principal only sees the session bound into its credential.
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Sessions]
      operationId: startAgentSession
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:create
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, spaceId, vaultId]
              properties:
                purpose: { type: string, minLength: 1 }
                contextBudget:
                  { type: integer, minimum: 256, maximum: 32000, default: 6000 }
                projectId: { type: string, format: uuid }
                spaceId: { type: string, format: uuid }
                vaultId: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/sessions/{id}/state:
    get:
      tags: [Sessions]
      operationId: getAgentSessionState
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:read
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
      description: >
        Read the durable structured workspace snapshot for one authorized
        participant. The snapshot is sufficient for another participant to
        resume without relying on a prior chat transcript.
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{id}/participants:
    post:
      tags: [Sessions]
      operationId: addAgentSessionParticipant
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:manage-participants
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/ObjectResponse" }
        "201": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Target participant is not authorized for the full session vault.

  /v1/sessions/{id}/activity:
    get:
      tags: [Sessions]
      operationId: listWorkActivity
      x-akp-permission: knowledge:read
      description: >
        Activity recorded against the work objects this session's vault
        projects, newest first. Scoped through session participation, so an
        actor cannot page through another vault's work history.
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
        - name: objectRefId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Activity events for the authorized scope.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Sessions]
      operationId: recordWorkActivity
      x-akp-permission: knowledge:read
      description: >
        Record one observation about a work object. Append-only: correcting an
        earlier observation means recording a later one. `derivation` states how
        the assertion is known, and a `CAUSED` action may only rest on
        SOURCE_EXPLICIT, HUMAN_ASSERTED or DYNAMICALLY_PROVEN — an observed
        ordering never becomes a causal claim however often it recurs.
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [objectRefId, action, occurredAt, sourceSystem, derivation]
              properties:
                objectRefId: { type: string, format: uuid }
                targetRefId: { type: string, format: uuid }
                action:
                  type: string
                  enum:
                    - CREATED
                    - UPDATED
                    - COMMENTED
                    - REVIEWED
                    - APPROVED
                    - REJECTED
                    - MERGED
                    - CLOSED
                    - REOPENED
                    - ASSIGNED
                    - ESCALATED
                    - DEPLOYED
                    - ROLLED_BACK
                    - RESOLVED
                    - LINKED
                    - REFERENCED
                    - CAUSED
                occurredAt: { type: string, format: date-time }
                sourceSystem: { type: string, minLength: 1, maxLength: 80 }
                derivation:
                  type: string
                  enum:
                    - SOURCE_EXPLICIT
                    - OBSERVED_CORRELATION
                    - MODEL_INFERRED
                    - HUMAN_ASSERTED
                    - DYNAMICALLY_PROVEN
                relationKind:
                  type: string
                  enum:
                    - DEPENDS_ON
                    - PROVIDES_TO
                    - CODE_REPOSITORY
                    - INCIDENT
                    - RUNS_ON
                    - RULE
                    - RELATED
                actorExternalId: { type: string, minLength: 1, maxLength: 512 }
                evidenceRefs:
                  type: array
                  maxItems: 50
                  items: { type: string, minLength: 1 }
                payload: { type: object }
      responses:
        "201":
          description: The recorded, immutable activity event.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            The session, or one of the referenced work objects, is not visible
            in this scope.
          content:
            application/json:
              schema: { type: object }
        "422":
          description: >-
            WORK_ACTIVITY_CAUSALITY_UNSUPPORTED - a causal claim was asserted on
            a derivation that cannot support one.
          content:
            application/json:
              schema: { type: object }

  /v1/sessions/{id}/bootstrap:
    post:
      tags: [Sessions]
      operationId: bootstrapAgentSessionContext
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:read
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query: { type: string, maxLength: 4096 }
                intent:
                  type: string
                  default: WORKFLOW_EXECUTION
                  enum:
                    - EXACT_LOOKUP
                    - CONCEPTUAL
                    - COMPARISON
                    - WORKFLOW_EXECUTION
                    - SOURCE_VERIFICATION
                    - PROJECT_CODE
                    - GLOBAL_SYNTHESIS
                    - IMPACT_ANALYSIS
                    - NO_RETRIEVAL_REQUIRED
                packetMode:
                  type: string
                  default: COMPACT_AGENT_PACKET
                  enum: [COMPACT_AGENT_PACKET, FULL_CONTEXT_PACKET]
                objectRefId: { type: string, format: uuid }
      responses:
        "200":
          description: >-
            An authorized context packet resolved against the revision this
            session pinned, with that revision set reported back.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The pinned context revision changed, or a pin is required. The node
            reports the drift rather than mixing two snapshots.
          content:
            application/json:
              schema: { type: object }
        "413":
          description: The bootstrap query exceeds the bounded payload size.
          content:
            application/json:
              schema: { type: object }

  /v1/sessions/{id}/promotions:
    post:
      tags: [Sessions]
      operationId: requestWorkspacePromotion
      x-akp-permission: knowledge:propose
