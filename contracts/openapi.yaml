  /v1/sessions/{id}/handoffs/{handoffId}/import:
    post:
      tags: [Sessions]
      operationId: importWorkspaceHandoff
      x-akp-permission: knowledge:read
      x-akp-principal-action: workspace:handoff
      parameters:
        - { $ref: "#/components/parameters/UuidId" }
        - name: handoffId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
        - { $ref: "#/components/parameters/IdempotencyKey" }
      description: >
        Import one durable handoff addressed to the authenticated user into a
        different authorized session in the same space and vault. The import
        preserves source context revision metadata and records whether the
        receiver is pinned to a different revision; it never copies transcript
        state or publishes canonical knowledge.
      responses:
        "201": { $ref: "#/components/responses/ObjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

